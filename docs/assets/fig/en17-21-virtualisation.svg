<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Three layers of WAN virtualisation and the three Inter-AS options with what crosses each boundary</title>
  <desc id="d15">Three layers of virtualisation are laid out: a VRF gives one routing table per tenant on the provider edge and is the tenant boundary; Multi-VRF CE or VRF-lite lets the customer segment its own CE so the boundary sits on the customer side; and carrier supporting carrier lets one carrier carry another carrier's VPN for wholesale scale. Three Inter-AS options then place the boundary differently: option A exchanges VRF to VRF in back-to-back fashion so no labels cross but the ASBR needs one interface per VPN; option B runs MP-eBGP between ASBRs carrying VPNv4 labels so the ASBR holds all VPN routes, which is the normal inter-provider design; option C runs multi-hop MP-eBGP between route reflectors so the ASBR holds no VPN state and scales best, but it forwards labels it cannot inspect, so it fits one operator with several autonomous systems rather than two distrusting providers.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="464" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">WAN virtualisation is three layers, and Inter-AS is the layer that decides who trusts whom</text>  <text class="s" x="24" y="45">VRF gives the tenant, CSC gives the carrier's carrier, and the Inter-AS option decides where labels and routes stop</text>
  <text class="k" x="24" y="78">THREE LAYERS OF VIRTUALISATION</text>
  <rect x="24" y="88" width="264" height="78" rx="3" fill="#ffffff" stroke="#29a08f" stroke-width=".8"/>
  <text class="b" x="36" y="106">VRF</text>
  <text class="c" x="36" y="122">one routing table per tenant on the PE</text>
  <line x1="36" y1="132" x2="276" y2="132" stroke="#eef2f8" stroke-width=".8"/>
  <text class="k" x="36" y="148">ROLE</text>
  <text class="w" x="84" y="148">the tenant boundary</text>
  <rect x="312" y="88" width="264" height="78" rx="3" fill="#ffffff" stroke="#4a7ee0" stroke-width=".8"/>
  <text class="b" x="324" y="106">Multi-VRF CE / VRF-lite</text>
  <text class="c" x="324" y="122">the customer segments its own CE</text>
  <line x1="324" y1="132" x2="564" y2="132" stroke="#eef2f8" stroke-width=".8"/>
  <text class="k" x="324" y="148">ROLE</text>
  <text class="w" x="372" y="148">tenant boundary on your side</text>
  <rect x="600" y="88" width="264" height="78" rx="3" fill="#ffffff" stroke="#8b6bd0" stroke-width=".8"/>
  <text class="b" x="612" y="106">CSC (carrier supporting carrier)</text>
  <text class="c" x="612" y="122">one carrier carries another's VPN</text>
  <line x1="612" y1="132" x2="852" y2="132" stroke="#eef2f8" stroke-width=".8"/>
  <text class="k" x="612" y="148">ROLE</text>
  <text class="w" x="660" y="148">scale and wholesale</text>
  <text class="k" x="24" y="194">INTER-AS OPTIONS: THREE PLACES TO PUT THE BOUNDARY</text>
  <rect x="24" y="204" width="264" height="100" rx="3" fill="#f7f9fd" stroke="#d99b2b" stroke-width=".8"/>
  <text class="h" x="36" y="222" fill="#d99b2b">A</text>
  <text class="b" x="58" y="222">VRF to VRF</text>
  <text class="c" x="36" y="240">back-to-back VRF on the ASBR</text>
  <text class="c" x="36" y="254">one session per VPN, no labels cross</text>
  <text class="c" x="36" y="266"></text>
  <text class="k" x="36" y="282">FIT</text>
  <text class="w" x="64" y="282">few VPNs, strict control</text>
  <rect x="312" y="204" width="264" height="100" rx="3" fill="#f7f9fd" stroke="#29a08f" stroke-width=".8"/>
  <text class="h" x="324" y="222" fill="#29a08f">B</text>
  <text class="b" x="346" y="222">ASBR to ASBR</text>
  <text class="c" x="324" y="240">MP-eBGP between ASBRs</text>
  <text class="c" x="324" y="254">VPNv4 labels cross the boundary</text>
  <text class="c" x="324" y="266"></text>
  <text class="k" x="324" y="282">FIT</text>
  <text class="w" x="352" y="282">many VPNs, ASBR holds state</text>
  <rect x="600" y="204" width="264" height="100" rx="3" fill="#f7f9fd" stroke="#8b6bd0" stroke-width=".8"/>
  <text class="h" x="612" y="222" fill="#8b6bd0">C</text>
  <text class="b" x="634" y="222">RR to RR</text>
  <text class="c" x="612" y="240">multi-hop MP-eBGP</text>
  <text class="c" x="612" y="254">between route reflectors, no ASBR state</text>
  <text class="c" x="612" y="266"></text>
  <text class="k" x="612" y="282">FIT</text>
  <text class="w" x="640" y="282">scale, but ASBRs must be trusted</text>
  <rect x="24" y="320" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="335">OPTION</text>  <text class="k" x="222.0" y="335">WHAT CROSSES THE BOUNDARY</text>  <text class="k" x="472.0" y="335">COST / STATE</text>  <text class="k" x="722.0" y="335">WHEN IT IS THE RIGHT ANSWER</text>  <rect x="24" y="342" width="852" height="24" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="358">A: VRF to VRF</text>  <text class="g" x="222.0" y="358">none</text>  <text class="x" x="472.0" y="358">ASBR per VPN</text>  <text class="c" x="722.0" y="358">providers do not trust each other</text>  <line x1="24" y1="366" x2="876" y2="366" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="366" width="852" height="24" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="382">B: ASBR to ASBR</text>  <text class="c" x="222.0" y="382">VPNv4 labels</text>  <text class="c" x="472.0" y="382">ASBR holds all VPN routes</text>  <text class="g" x="722.0" y="382">normal inter-provider VPN</text>  <line x1="24" y1="390" x2="876" y2="390" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="390" width="852" height="24" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="406">C: RR to RR</text>  <text class="c" x="222.0" y="406">multi-hop VPNv4</text>  <text class="g" x="472.0" y="406">ASBR holds no VPN state</text>  <text class="c" x="722.0" y="406">one operator, several AS</text>  <line x1="24" y1="414" x2="876" y2="414" stroke="#eef2f8" stroke-width=".7"/>
  <line x1="24" y1="416" x2="876" y2="416" stroke="#dfe6f1" stroke-width=".8"/>
  <text class="b" x="24" y="434">The question is not which option scales best, but who is allowed to see your VPN routes at the ASBR</text>
  <text class="c" x="24" y="450">Option C is the most scalable and the least trusted: the ASBR forwards labels it cannot inspect, so it works inside one operator, not across two.</text>
</svg>
