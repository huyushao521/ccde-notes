<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" role="img" aria-labelledby="t5 d5">

  <title id="t5">TOGAF ADM 八阶段循环与贯穿全程的需求管理</title>
  <desc id="d5">A 到 H 八个阶段沿环形顺时针排列，相邻阶段以箭头相连，D 技术架构为网络设计的主场并高亮；环心为需求管理，贯穿 A 到 H 全部阶段。右侧说明迭代含义、需求管理的中心地位与常见误读。</desc>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/>
    </marker>
  </defs>
  <style>
    .h{font:600 12.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .lt{font:700 11px "Segoe UI",sans-serif;fill:#1f4fc0}
    .nm{font:9.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2233}
    .ct{font:600 11.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#0f7f73}
    .cs{font:9px "Segoe UI","Microsoft YaHei",sans-serif;fill:#0f7f73}
    .rn{font:600 10.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2233}
    .rb{font:9.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#4a5a72}
  </style>

  <rect x="0" y="0" width="900" height="460" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">TOGAF ADM：八个阶段围成一个环，需求管理在环心</text>
  <text class="s" x="24" y="48">它描述的是"架构思考的分类与循环"，不是一张项目甘特图</text>

  <circle cx="250" cy="270" r="145" fill="none" stroke="#e6ecf4" stroke-width="1.2" stroke-dasharray="4 5"/>

  <line x1="274" y1="135" x2="328" y2="157" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#a5)"/>
  <line x1="362" y1="191" x2="384" y2="244" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#a5)"/>
  <line x1="385" y1="295" x2="363" y2="348" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#a5)"/>
  <line x1="328" y1="382" x2="274" y2="404" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#a5)"/>
  <line x1="226" y1="404" x2="171" y2="382" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#a5)"/>
  <line x1="137" y1="348" x2="115" y2="295" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#a5)"/>
  <line x1="115" y1="245" x2="137" y2="192" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#a5)"/>
  <line x1="171" y1="157" x2="225" y2="135" stroke="#2f6fed" stroke-width="1.3" marker-end="url(#a5)"/>

  <rect x="202" y="105" width="96" height="40" rx="6" fill="#fff" stroke="#2f6fed" stroke-width="1.2"/>
  <text class="lt" x="250" y="120" text-anchor="middle">A</text>
  <text class="nm" x="250" y="136" text-anchor="middle">架构愿景</text>

  <rect x="304" y="147" width="96" height="40" rx="6" fill="#fff" stroke="#2f6fed" stroke-width="1.2"/>
  <text class="lt" x="352" y="162" text-anchor="middle">B</text>
  <text class="nm" x="352" y="178" text-anchor="middle">业务架构</text>

  <rect x="347" y="250" width="96" height="40" rx="6" fill="#fff" stroke="#2f6fed" stroke-width="1.2"/>
  <text class="lt" x="395" y="265" text-anchor="middle">C</text>
  <text class="nm" x="395" y="281" text-anchor="middle">信息系统架构</text>

  <rect x="304" y="352" width="96" height="40" rx="6" fill="#fff4e0" stroke="#d98600" stroke-width="1.5"/>
  <text class="lt" x="352" y="367" text-anchor="middle" fill="#a86400">D</text>
  <text class="nm" x="352" y="383" text-anchor="middle" fill="#a86400">技术架构</text>

  <rect x="202" y="395" width="96" height="40" rx="6" fill="#fff" stroke="#2f6fed" stroke-width="1.2"/>
  <text class="lt" x="250" y="410" text-anchor="middle">E</text>
  <text class="nm" x="250" y="426" text-anchor="middle">机会与方案</text>

  <rect x="99" y="352" width="96" height="40" rx="6" fill="#fff" stroke="#2f6fed" stroke-width="1.2"/>
  <text class="lt" x="147" y="367" text-anchor="middle">F</text>
  <text class="nm" x="147" y="383" text-anchor="middle">迁移规划</text>

  <rect x="57" y="250" width="96" height="40" rx="6" fill="#fff" stroke="#2f6fed" stroke-width="1.2"/>
  <text class="lt" x="105" y="265" text-anchor="middle">G</text>
  <text class="nm" x="105" y="281" text-anchor="middle">实施治理</text>

  <rect x="99" y="147" width="96" height="40" rx="6" fill="#fff" stroke="#2f6fed" stroke-width="1.2"/>
  <text class="lt" x="147" y="162" text-anchor="middle">H</text>
  <text class="nm" x="147" y="178" text-anchor="middle">变更管理</text>

  <rect x="172" y="242" width="156" height="58" rx="8" fill="#e8f7f4" stroke="#12a594" stroke-width="1.3"/>
  <text class="ct" x="250" y="264" text-anchor="middle">需求管理</text>
  <text class="cs" x="250" y="282" text-anchor="middle">贯穿 A – H，没有"收完"的时刻</text>

  <text class="rn" x="504" y="100">三条最容易记错的点</text>

  <rect x="500" y="110" width="376" height="76" rx="6" fill="#fff4e0" stroke="#f0d6a8" stroke-width="1"/>
  <text class="rn" x="514" y="130" fill="#a86400">D 是你的主场，但要能往上追溯</text>
  <text class="rb" x="514" y="150">技术架构（分段、拓扑、协议）落在 D；说不清 B 的业务目标</text>
  <text class="rb" x="514" y="168">和 C 的信息流，那就只是自底向上，不是自顶向下。</text>

  <rect x="500" y="196" width="376" height="76" rx="6" fill="#eaf1ff" stroke="#c9dbff" stroke-width="1"/>
  <text class="rn" x="514" y="216">环，不是流水线</text>
  <text class="rb" x="514" y="236">A→H 走完回到 A：业务变了，架构跟着演进。</text>
  <text class="rb" x="514" y="254">所以架构文档是有保质期的，不是一次性交付物。</text>

  <rect x="500" y="282" width="376" height="76" rx="6" fill="#e8f7f4" stroke="#b6e3da" stroke-width="1"/>
  <text class="rn" x="514" y="302" fill="#0f7f73">需求管理在环心，不在起点</text>
  <text class="rb" x="514" y="322">需求持续变化，贯穿每个阶段；把它当"第一阶段"</text>
  <text class="rb" x="514" y="340">就会得出"需求收完了再设计"的错误流程。</text>

  <rect x="500" y="368" width="376" height="76" rx="6" fill="#fdecec" stroke="#e8b4b4" stroke-width="1"/>
  <text class="rn" x="514" y="388" fill="#a32020">常见误读：把 ADM 当项目计划</text>
  <text class="rb" x="514" y="408" fill="#a32020">它是分类框架，阶段可按项目规模裁剪；用八个阶段</text>
  <text class="rb" x="514" y="426" fill="#a32020">串成一条瀑布来管理项目，会把小项目做成大工程。</text>
</svg>
