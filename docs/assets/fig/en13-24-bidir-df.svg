<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="100%" role="img" aria-labelledby="t1324 d1324">
  <title id="t1324">BiDir-PIM: one shared tree rooted at the RP, and a DF election that is per segment, per group and directional</title>
  <desc id="d1324">Left: the bidirectional shared tree. Every source sends up toward the RP and every receiver is served down from the RP, so two receivers on the same side of the network still exchange traffic through the root. Right: the DF election rules - scope is per segment, per group and directional (only the direction toward the RP is a DF role); election basis is the unicast metric to that group's RP, tie broken by highest IP; signalling rides in PIM Hello as a DF election option with Offer, Pass, Winner and Backoff states; the DF forwards toward the RP, a non-DF does not. Bottom: three consequences - suboptimal path of twice the distance to the RP, RP failure stops every group in the range with no SPT to fall back on, and state proportional to groups only, independent of source count. A footer warns that show ip pim df must be read per group.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
  </style>
  <rect x="0" y="0" width="900" height="486" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">BiDir keeps one tree for every source, and one role that only points at the RP</text>
  <text class="s" x="24" y="45">The DF is not "the router that owns the segment". It is "the router that owns the segment, for this group, toward the RP".</text>

  <rect x="24" y="58" width="416" height="252" rx="4" fill="#ffffff" stroke="#dfe6f1" stroke-width=".7"/>
  <text class="k" x="36" y="76">TREE MODEL</text>
  <rect x="176" y="86" width="112" height="26" rx="3" fill="#eef3fd" stroke="#1f4fc0" stroke-width=".8"/>
  <text class="b" x="232" y="103" text-anchor="middle">RP = tree root</text>
  <line x1="232" y1="112" x2="232" y2="140" stroke="#1f4fc0" stroke-width=".8"/>
  <line x1="118" y1="140" x2="346" y2="140" stroke="#1f4fc0" stroke-width=".8"/>
  <line x1="118" y1="140" x2="118" y2="164" stroke="#1f4fc0" stroke-width=".8"/>
  <line x1="346" y1="140" x2="346" y2="164" stroke="#1f4fc0" stroke-width=".8"/>
  <rect x="88" y="164" width="60" height="22" rx="3" fill="#fbfcfe" stroke="#7c8b9f" stroke-width=".7"/>
  <text class="c" x="118" y="179" text-anchor="middle">R1 = DF</text>
  <rect x="316" y="164" width="60" height="22" rx="3" fill="#fbfcfe" stroke="#7c8b9f" stroke-width=".7"/>
  <text class="c" x="346" y="179" text-anchor="middle">R2 = DF</text>
  <line x1="118" y1="186" x2="96" y2="224" stroke="#a9b6c9" stroke-width=".7" stroke-dasharray="3 2"/>
  <line x1="118" y1="186" x2="152" y2="224" stroke="#a9b6c9" stroke-width=".7" stroke-dasharray="3 2"/>
  <line x1="346" y1="186" x2="324" y2="224" stroke="#a9b6c9" stroke-width=".7" stroke-dasharray="3 2"/>
  <line x1="346" y1="186" x2="380" y2="224" stroke="#a9b6c9" stroke-width=".7" stroke-dasharray="3 2"/>
  <rect x="76" y="224" width="40" height="20" rx="10" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".7"/>
  <text class="c" x="96" y="238" text-anchor="middle">src A</text>
  <rect x="132" y="224" width="40" height="20" rx="10" fill="#eef7f5" stroke="#bcdcd6" stroke-width=".7"/>
  <text class="c" x="152" y="238" text-anchor="middle">rcv 1</text>
  <rect x="304" y="224" width="60" height="20" rx="10" fill="#f7f3fe" stroke="#d6c9f0" stroke-width=".7"/>
  <text class="c" x="334" y="238" text-anchor="middle">src B / rcv 2</text>
  <text class="w" x="232" y="196" text-anchor="middle">traffic up, then down</text>
  <text class="x" x="36" y="264">A to rcv 2 still detours through the RP</text>
  <text class="w" x="36" y="278">no source tree, no Register, no SPT - and no shortcut either</text>
  <text class="w" x="36" y="292">latency between two one-hop neighbours = 2 x distance to the root</text>

  <rect x="456" y="58" width="420" height="252" rx="4" fill="#ffffff" stroke="#dfe6f1" stroke-width=".7"/>
  <text class="k" x="468" y="76">DF ELECTION</text>
  <text class="c" x="468" y="96">Scope</text>
  <text class="b" x="556" y="96">per segment x per group x direction</text>
  <text class="w" x="556" y="110">only the direction toward the RP is a DF role</text>
  <line x1="468" y1="120" x2="864" y2="120" stroke="#eaeff7" stroke-width=".7"/>
  <text class="c" x="468" y="136">Basis</text>
  <text class="b" x="556" y="136">unicast metric to that group's RP</text>
  <text class="w" x="556" y="150">tie break: highest IP address wins</text>
  <line x1="468" y1="160" x2="864" y2="160" stroke="#eaeff7" stroke-width=".7"/>
  <text class="c" x="468" y="176">Signalling</text>
  <text class="b" x="556" y="176">PIM Hello, DF election option</text>
  <text class="m" x="556" y="190">Offer / Pass / Winner / Backoff</text>
  <line x1="468" y1="200" x2="864" y2="200" stroke="#eaeff7" stroke-width=".7"/>
  <text class="c" x="468" y="216">Role</text>
  <text class="g" x="556" y="216">DF forwards toward the RP</text>
  <text class="w" x="556" y="230">a non-DF still forwards downstream, it just never sends up</text>
  <line x1="468" y1="240" x2="864" y2="240" stroke="#eaeff7" stroke-width=".7"/>
  <text class="c" x="468" y="256">Read it</text>
  <text class="m" x="556" y="256">show ip pim df &lt;group&gt;</text>
  <text class="x" x="556" y="270">"am I the DF" is the wrong question - always ask per group</text>
  <text class="w" x="468" y="292">group 239.20.1.1 via RP A: I am DF   |   group 239.20.2.1 via RP B: I am not</text>

  <rect x="24" y="324" width="258" height="94" rx="4" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".7"/>
  <text class="k" x="36" y="342">PATH</text>
  <text class="b" x="36" y="360">Suboptimal by construction</text>
  <text class="w" x="36" y="376">every flow is forced through the root,</text>
  <text class="w" x="36" y="390">so receiver-to-receiver latency is not</text>
  <text class="w" x="36" y="404">a design choice you can tune away</text>

  <rect x="294" y="324" width="258" height="94" rx="4" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".7"/>
  <text class="k" x="306" y="342">ROOT</text>
  <text class="b" x="306" y="360">RP failure stops every group</text>
  <text class="w" x="306" y="376">in the range at once, with no SPT to</text>
  <text class="w" x="306" y="390">fall back on. This is why BiDir and</text>
  <text class="w" x="306" y="404">a single RP should never be paired</text>

  <rect x="564" y="324" width="312" height="94" rx="4" fill="#eef7f5" stroke="#bcdcd6" stroke-width=".7"/>
  <text class="k" x="576" y="342">STATE</text>
  <text class="b" x="576" y="360">One (*,G) per group, whatever the sources</text>
  <text class="w" x="576" y="376">state count is a function of groups, not sources -</text>
  <text class="w" x="576" y="390">which is exactly why many-to-many (trading,</text>
  <text class="w" x="576" y="404">conferencing, discovery) fits BiDir and not ASM</text>

  <rect x="24" y="430" width="852" height="36" rx="3" fill="#f8f6ee" stroke="#e4dcc0" stroke-width=".7"/>
  <text class="c" x="36" y="453">Boundary to watch: ip pim bidir-enable must be on every router in the domain, and the DF result must agree with the tree you drew - otherwise traffic silently dies at one segment.</text>
</svg>
