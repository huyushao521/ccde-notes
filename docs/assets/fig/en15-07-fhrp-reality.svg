<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 362" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The FHRP switchover timeline, what it preserves and what it does not, and the three ways the design still breaks</title>
  <desc id="d15">A timeline with four stages: at time zero the active dies from a line card, power or crash; after three to ten seconds the standby notices through three second hellos and a ten second hold timer, or faster with BFD; then a gratuitous ARP moves the virtual MAC while the IP stays; then after one to ten seconds traffic resumes with the old flows gone. Two lists follow: what FHRP preserves - the default gateway IP, the virtual MAC, the host ARP cache, first hop reachability of the subnet - and what it does not - TCP sessions through the failed box, NAT and stateful inspection state, the physical first hop itself, and the return path when routing is asymmetric. A footer gives three failure modes: HSRP active on one switch while the STP root is on the other, FHRP timers tuned to milliseconds without BFD, and FHRP on an SVI whose VLAN still spans three closets.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="362" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">FHRP keeps the gateway address; it does not keep the first hop</text>  <text class="s" x="24" y="45">A gateway failure is downgraded from outage to switchover - not from outage to no hiccup.</text>  <line x1="60" y1="132" x2="840" y2="132" stroke="#dfe6f1" stroke-width="1"/>  <line x1="66" y1="132" x2="846" y2="132" stroke="#4a7ee0" stroke-width="1.2" marker-end="url(#ab)"/>  <rect x="60" y="76" width="180" height="48" rx="3" fill="#fdf0ee" stroke="#eef2f8" stroke-width=".8"/>  <text class="k" x="70" y="92">t = 0</text>  <text class="b" x="70" y="106">active dies</text>  <text class="w" x="70" y="119">line card, power, crash</text>  <rect x="148" y="126" width="4" height="4" rx="2" fill="#d0564a" stroke="none"/>  <line x1="242" y1="100" x2="260" y2="100" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <rect x="256" y="76" width="180" height="48" rx="3" fill="#fdf8ee" stroke="#eef2f8" stroke-width=".8"/>  <text class="k" x="266" y="92">3-10 s</text>  <text class="b" x="266" y="106">standby notices</text>  <text class="w" x="266" y="119">hello 3 s, hold 10 s; BFD if you built it</text>  <rect x="344" y="126" width="4" height="4" rx="2" fill="#d99b2b" stroke="none"/>  <line x1="438" y1="100" x2="456" y2="100" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <rect x="452" y="76" width="180" height="48" rx="3" fill="#f4f8ff" stroke="#eef2f8" stroke-width=".8"/>  <text class="k" x="462" y="92">+1 packet</text>  <text class="b" x="462" y="106">gratuitous ARP</text>  <text class="w" x="462" y="119">the MAC moves, the IP stays</text>  <rect x="540" y="126" width="4" height="4" rx="2" fill="#4a7ee0" stroke="none"/>  <line x1="634" y1="100" x2="652" y2="100" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <rect x="648" y="76" width="180" height="48" rx="3" fill="#f3fbf9" stroke="#eef2f8" stroke-width=".8"/>  <text class="k" x="658" y="92">1-10 s</text>  <text class="b" x="658" y="106">traffic resumes</text>  <text class="w" x="658" y="119">new first hop, old flows are gone</text>  <rect x="736" y="126" width="4" height="4" rx="2" fill="#29a08f" stroke="none"/>  <text class="b" x="24" y="168">What FHRP preserves</text>  <rect x="24" y="178" width="228" height="16" rx="8.0" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".7"/>  <text class="g" x="138.0" y="189" text-anchor="middle">the default gateway IP</text>  <rect x="274" y="178" width="228" height="16" rx="8.0" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".7"/>  <text class="g" x="388.0" y="189" text-anchor="middle">the virtual MAC seen by hosts</text>  <rect x="24" y="204" width="228" height="16" rx="8.0" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".7"/>  <text class="g" x="138.0" y="215" text-anchor="middle">the host ARP cache entry</text>  <rect x="274" y="204" width="228" height="16" rx="8.0" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".7"/>  <text class="g" x="388.0" y="215" text-anchor="middle">first-hop reachability of the subnet</text>  <text class="b" x="560" y="168">What FHRP does not preserve</text>  <rect x="560" y="178" width="300" height="18" rx="9.0" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".7"/>  <text class="x" x="710.0" y="191" text-anchor="middle">TCP sessions through the failed box</text>  <rect x="560" y="200" width="300" height="18" rx="9.0" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".7"/>  <text class="x" x="710.0" y="213" text-anchor="middle">NAT and stateful-inspection state</text>  <rect x="560" y="222" width="300" height="18" rx="9.0" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".7"/>  <text class="x" x="710.0" y="235" text-anchor="middle">the physical first hop (it did die)</text>  <rect x="560" y="244" width="300" height="18" rx="9.0" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".7"/>  <text class="x" x="710.0" y="257" text-anchor="middle">the return path, if routing is asymmetric</text>  <line x1="24" y1="258" x2="876" y2="258" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="278">Where the design actually breaks</text>  <text class="w" x="24" y="294">1. HSRP active on A, STP root on B: every client's traffic crosses the inter-switch link twice, and that link becomes</text>  <text class="w" x="36" y="307">the first thing to saturate - put root and active on the same box, and verify it with a failover test.</text>  <text class="w" x="24" y="324">2. FHRP timers tuned to milliseconds with no BFD: the two sides disagree about who is active and you get a dual-active window.</text>  <text class="w" x="24" y="341">3. FHRP on an SVI whose VLAN spans three closets: the switchover is fast, the spanning tree is not - the outage is somewhere else.</text>
</svg>
