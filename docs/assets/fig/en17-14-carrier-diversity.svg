<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Three diversity checks, five WAN connectivity shapes and the shared single points that hide behind a second carrier</title>
  <desc id="d15">Three checks must be documented rather than promised: the physical route through the same duct, manhole or bridge; the access point, where both fibres enter the same exchange room, rack and power; and the committed rate on the backup, because a ten megabit backup cannot carry a twenty megabit site. Five connectivity shapes are ranked by what they actually survive: a single link survives nothing, dual links on one carrier survive a link but not the carrier, dual carriers into one CPE survive a carrier but not the CPE, dual carriers with dual CPEs survive carrier and CPE but not the duct, and adding an overlay with probes lets you survive anything you can measure. A table lists the WAN single points that hide - one CPE, one PE port, a shared inter-carrier handoff, one backhaul to the hub - with the evidence to demand for each.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="490" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Two carriers are not two paths until you can prove physical diversity</text>  <text class="s" x="24" y="45">In the WAN the shared single points are worse than in the internet edge: one CPE, one PE port, one duct</text>
  <text class="k" x="24" y="78">THREE CHECKS THAT MUST BE DOCUMENTED, NOT PROMISED</text>
  <rect x="24" y="88" width="852" height="78" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>
  <rect x="36" y="96" width="4" height="44" rx="2" fill="#d0564a" stroke="none"/>
  <text class="b" x="50" y="110">Physical route</text>
  <text class="c" x="50" y="126">same duct, same manhole, same bridge?</text>
  <text class="c" x="50" y="140">ask for the path diagram, not the words 'diverse'</text>
  <rect x="320" y="96" width="4" height="44" rx="2" fill="#d99b2b" stroke="none"/>
  <text class="b" x="334" y="110">Access point</text>
  <text class="c" x="334" y="126">both fibres into the same exchange room?</text>
  <text class="c" x="334" y="140">the room, the rack and the power are shared</text>
  <rect x="604" y="96" width="4" height="44" rx="2" fill="#8b6bd0" stroke="none"/>
  <text class="b" x="618" y="110">Committed rate</text>
  <text class="c" x="618" y="126">is the backup CIR enough at peak?</text>
  <text class="c" x="618" y="140">a 10 Mbps backup cannot carry a 20 Mbps site</text>
  <text class="k" x="24" y="192">FIVE CONNECTIVITY SHAPES AND WHAT EACH ONE ACTUALLY SURVIVES</text>
  <rect x="24" y="204" width="16" height="16" rx="8" fill="#d0564a" stroke="none"/>
  <text class="w" x="32" y="216" text-anchor="middle">1</text>
  <text class="b" x="52" y="216">Single link</text>
  <text class="c" x="230" y="216">survives: nothing</text>
  <rect x="24" y="228" width="16" height="16" rx="8" fill="#d99b2b" stroke="none"/>
  <text class="w" x="32" y="240" text-anchor="middle">2</text>
  <text class="b" x="52" y="240">Dual link, one carrier</text>
  <text class="c" x="230" y="240">survives: a link, not the carrier</text>
  <rect x="24" y="252" width="16" height="16" rx="8" fill="#d99b2b" stroke="none"/>
  <text class="w" x="32" y="264" text-anchor="middle">3</text>
  <text class="b" x="52" y="264">Dual carrier, one CPE</text>
  <text class="c" x="230" y="264">survives: a carrier, not the CPE</text>
  <rect x="24" y="276" width="16" height="16" rx="8" fill="#29a08f" stroke="none"/>
  <text class="w" x="32" y="288" text-anchor="middle">4</text>
  <text class="b" x="52" y="288">Dual carrier, dual CPE</text>
  <text class="c" x="230" y="288">survives: carrier and CPE, not the duct</text>
  <rect x="24" y="300" width="16" height="16" rx="8" fill="#29a08f" stroke="none"/>
  <text class="w" x="32" y="312" text-anchor="middle">5</text>
  <text class="b" x="52" y="312">+ overlay and probes</text>
  <text class="c" x="230" y="312">survives: everything you can measure</text>
  <rect x="460" y="204" width="416" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="468" y="219">SINGLE POINT</text>  <text class="k" x="588.0" y="219">WHY IT HIDES</text>  <text class="k" x="778.0" y="219">EVIDENCE TO DEMAND</text>  <rect x="460" y="226" width="416" height="28" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="468" y="246">WAN single point</text>  <text class="c" x="588.0" y="246">seen in most enterprises</text>  <text class="c" x="778.0" y="246">what to ask for</text>  <line x1="460" y1="254" x2="876" y2="254" stroke="#eef2f8" stroke-width=".7"/>  <rect x="460" y="254" width="416" height="28" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="468" y="274">One CPE</text>  <text class="c" x="588.0" y="274">carrier-independent, but one PSU, one code load</text>  <text class="c" x="778.0" y="274">dual CPE, dual power feed</text>  <line x1="460" y1="282" x2="876" y2="282" stroke="#eef2f8" stroke-width=".7"/>  <rect x="460" y="282" width="416" height="28" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="468" y="302">One PE port</text>  <text class="c" x="588.0" y="302">carrier's failure, your outage</text>  <text class="c" x="778.0" y="302">two ports, two PEs</text>  <line x1="460" y1="310" x2="876" y2="310" stroke="#eef2f8" stroke-width=".7"/>  <rect x="460" y="310" width="416" height="28" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="468" y="330">Shared NNI</text>  <text class="c" x="588.0" y="330">inter-carrier handoff inside one city</text>  <text class="c" x="778.0" y="330">handoff in two cities</text>  <line x1="460" y1="338" x2="876" y2="338" stroke="#eef2f8" stroke-width=".7"/>  <rect x="460" y="338" width="416" height="28" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="468" y="358">Backhaul to hub</text>  <text class="c" x="588.0" y="358">all sites converge on one path</text>  <text class="g" x="778.0" y="358">second hub or cloud path</text>  <line x1="460" y1="366" x2="876" y2="366" stroke="#eef2f8" stroke-width=".7"/>
  <rect x="24" y="390" width="852" height="54" rx="3" fill="#fdf5f4" stroke="#f2cfcb" stroke-width=".8"/>
  <text class="k" x="36" y="408">THE DIVERSITY STATEMENT THAT IS WORTH WRITING</text>
  <text class="b" x="36" y="426">Two paths are diverse when a single excavator cannot remove both lanes - and you can name the two exchanges and two cities.</text>
  <text class="c" x="36" y="440">Anything less is redundancy of contracts, which reads well in the design doc and fails in the incident report.</text>
  <line x1="24" y1="458" x2="876" y2="458" stroke="#dfe6f1" stroke-width=".8"/>
  <text class="c" x="24" y="476">In the WAN, the second path is usually slower: verify failover with real traffic, not with a ping and a shrug.</text>
</svg>
