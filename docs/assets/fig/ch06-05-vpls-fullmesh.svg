<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="100%" role="img" aria-labelledby="t5 d5">

  <title id="t5">VPLS 基本模型：PE 之间必须全互联 PW，靠水平分割防环</title>
  <desc id="d5">三个 CE 经 U-PE 接入运营商 MPLS 域中的 N-PE，三个 N-PE 之间两两建立全互联 PW。底部说明水平分割规则：从一条 PW 收到的帧不再转发到另一条 PW，这是唯一的环路屏障；并给出 PW 数量公式 n(n-1)/2。</desc>
  <style>
    .h{font:600 12.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .n{font:9px "Segoe UI",sans-serif;fill:#1a2233}
    .g{font:9px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .b{font:9.5px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .c{font:9.5px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .pt{font:600 10px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
  </style>

  <rect x="0" y="0" width="900" height="404" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">VPLS 基本模型：运营商帮你建一台"跨地域的大交换机"</text>
  <text class="s" x="24" y="48">同一台交换机的所有端口必须两两通 —— 这就是全互联 PW 的由来</text>

  <rect x="173" y="64" width="64" height="32" rx="4" fill="#fff" stroke="#2f6fed"/>
  <text class="n" x="205" y="85" text-anchor="middle">CE1</text>
  <rect x="413" y="64" width="64" height="32" rx="4" fill="#fff" stroke="#2f6fed"/>
  <text class="n" x="445" y="85" text-anchor="middle">CE2</text>
  <rect x="653" y="64" width="64" height="32" rx="4" fill="#fff" stroke="#2f6fed"/>
  <text class="n" x="685" y="85" text-anchor="middle">CE3</text>

  <rect x="100" y="120" width="700" height="200" rx="14" fill="#f4f7fb" stroke="#8494a8"/>
  <line x1="205" y1="96" x2="205" y2="120" stroke="#8494a8"/>
  <line x1="445" y1="96" x2="445" y2="120" stroke="#8494a8"/>
  <line x1="685" y1="96" x2="685" y2="120" stroke="#8494a8"/>
  <text class="g" x="450" y="112" text-anchor="middle">UNI / AC</text>

  <text class="b" x="450" y="144" text-anchor="middle">U-PE 提供客户 UNI 接入　·　N-PE 提供 VPLS 终结与 L3 服务　·　每个 PE 维护一个 VSI</text>

  <path d="M260 250 Q445 178 630 250" fill="none" stroke="#2f6fed" stroke-width="1.3"/>
  <line x1="260" y1="261" x2="390" y2="261" stroke="#2f6fed" stroke-width="1.3"/>
  <line x1="500" y1="261" x2="630" y2="261" stroke="#2f6fed" stroke-width="1.3"/>
  <text class="c" x="450" y="196" text-anchor="middle">全互联 PW：三个 PE 两两直达，缺一条就形成中转路径 → 必须防环</text>

  <rect x="150" y="240" width="110" height="42" rx="4" fill="#fff" stroke="#2f6fed"/>
  <text class="n" x="205" y="266" text-anchor="middle">N-PE1</text>
  <rect x="390" y="240" width="110" height="42" rx="4" fill="#fff" stroke="#2f6fed"/>
  <text class="n" x="445" y="266" text-anchor="middle">N-PE2</text>
  <rect x="630" y="240" width="110" height="42" rx="4" fill="#fff" stroke="#2f6fed"/>
  <text class="n" x="685" y="266" text-anchor="middle">N-PE3</text>
  <text class="g" x="450" y="306" text-anchor="middle">VSI 做三件事：MAC 学习、未知单播 / 广播泛洪、按 MAC 转发</text>

  <rect x="24" y="334" width="430" height="62" rx="7" fill="#e8f7f4" stroke="#b6e3da"/>
  <text class="c" x="40" y="352" font-weight="600">水平分割（Split Horizon）：唯一的环路屏障</text>
  <text class="b" x="40" y="370">从一条 PW 收到的帧，不再转发到另一条 PW。</text>
  <text class="b" x="40" y="386">正因如此，H-VPLS 一旦引入中间层，单靠它就不够了。</text>

  <rect x="466" y="334" width="410" height="62" rx="7" fill="#eaf1ff" stroke="#c9dbff"/>
  <text class="pt" x="482" y="352">PW 数量 = n(n-1)/2</text>
  <text class="b" x="482" y="370">10 个 PE → 45 条；50 个 PE → 1225 条</text>
  <text class="b" x="482" y="386">站点数翻倍，PW 数翻四倍 —— 这就是扩展性硬伤</text>
</svg>
