<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">An asymmetric return path crossing a second stateful firewall that never saw the session, with five stateful elements and a diagnosis order</title>
  <desc id="d15">Topology: an internal host 10.1.1.10 sends through firewall A, which has the session, to exit A and the internet; the return path comes back through exit B and firewall B, which has no session and silently drops the traffic. The user sees ping succeed because ICMP is stateless while the application times out after thirty seconds and traceroute shows two different paths. A table lists five elements that carry state - firewall sessions, NAT bindings, strict unicast reverse path forwarding, stateful load balancers and IPsec or tunnel security associations - with the symptom when they are bypassed. A three-step diagnosis is given: capture both directions to see whether one five-tuple used different devices, check the return device's session or translation table, then temporarily force symmetry to prove the conclusion. The repair order is to reduce state first and synchronise it second.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="424" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Asymmetric routing is not a routing problem. It is a state problem.</text>  <text class="s" x="24" y="45">When the return path crosses a different stateful device than the forward path, the session never existed as far as that device is concerned.</text>  <text class="k" x="24" y="76">THE SAME SESSION, TWO PATHS, ONE MISSING STATE</text>  <rect x="40" y="96" width="120" height="44" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="52" y="113">内部主机</text>  <text class="c" x="52" y="125">10.1.1.10</text>  <rect x="220" y="82" width="130" height="40" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="b" x="232" y="99">防火墙 A</text>  <text class="c" x="232" y="111">会话表：有</text>  <rect x="220" y="170" width="130" height="40" rx="3" fill="#fdf6f4" stroke="#f0d5cf" stroke-width=".8"/>  <text class="b" x="232" y="187">防火墙 B</text>  <text class="c" x="232" y="199">会话表：没有</text>  <rect x="410" y="82" width="120" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="422" y="99">出口 A</text>  <text class="c" x="422" y="111">ISP-A</text>  <rect x="410" y="170" width="120" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="422" y="187">出口 B</text>  <text class="c" x="422" y="199">ISP-B</text>  <rect x="600" y="126" width="120" height="44" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="612" y="143">对端服务器</text>  <text class="c" x="612" y="155">TCP 443</text>  <line x1="160" y1="112" x2="220" y2="104" stroke="#29a08f" stroke-width="1.2" marker-end="url(#at)"/>  <line x1="350" y1="102" x2="410" y2="102" stroke="#29a08f" stroke-width="1.2" marker-end="url(#at)"/>  <line x1="470" y1="122" x2="660" y2="138" stroke="#29a08f" stroke-width="1.2" marker-end="url(#at)"/>  <text class="w" x="480" y="116">去程</text>  <line x1="660" y1="158" x2="470" y2="192" stroke="#d0564a" stroke-width="1.2" marker-end="url(#ar)"/>  <line x1="410" y1="190" x2="350" y2="190" stroke="#d0564a" stroke-width="1.2" marker-end="url(#ar)"/>  <line x1="220" y1="196" x2="160" y2="140" stroke="#d0564a" stroke-width="1.2" marker-end="url(#ar)"/>  <text class="x" x="470" y="210">回程</text>  <text class="x" x="220" y="226">状态设备看不到这条会话 → 静默丢弃</text>  <text class="w" x="40" y="158">TCP 建不起来，或握手成功但数据不通</text>  <text class="w" x="40" y="252">用户侧现象：ping 通（ICMP 无状态）</text>  <text class="w" x="40" y="266">应用 30 秒超时；traceroute 两向不同</text>  <rect x="508" y="74" width="368" height="210" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="520" y="92">FIVE THINGS THAT CARRY STATE</text>  <rect x="520" y="102" width="344" height="20" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="528" y="115">Stateful element</text>  <text class="k" x="658.0" y="115">Symptom when bypassed</text>  <rect x="520" y="122" width="344" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="528" y="146">防火墙会话</text>  <text class="c" x="658.0" y="146">无会话即丢；超时前不放行</text>  <line x1="520" y1="154" x2="864" y2="154" stroke="#eef2f8" stroke-width=".7"/>  <rect x="520" y="154" width="344" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="528" y="178">NAT 绑定</text>  <text class="c" x="658.0" y="178">回程落在别的池 → 无映射</text>  <line x1="520" y1="186" x2="864" y2="186" stroke="#eef2f8" stroke-width=".7"/>  <rect x="520" y="186" width="344" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="528" y="210">uRPF 严格模式</text>  <text class="c" x="658.0" y="210">回程接口 ≠ 入接口 → 丢</text>  <line x1="520" y1="218" x2="864" y2="218" stroke="#eef2f8" stroke-width=".7"/>  <rect x="520" y="218" width="344" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="528" y="242">有状态负载均衡</text>  <text class="c" x="658.0" y="242">只在建立连接的一侧有表</text>  <line x1="520" y1="250" x2="864" y2="250" stroke="#eef2f8" stroke-width=".7"/>  <rect x="520" y="250" width="344" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="528" y="274">IPsec / 隧道</text>  <text class="c" x="658.0" y="274">只有一侧有 SA，包被丢</text>  <line x1="520" y1="282" x2="864" y2="282" stroke="#eef2f8" stroke-width=".7"/>  <text class="b" x="520" y="280">修复顺序：先减少状态，再同步状态</text>  <text class="w" x="520" y="296">- 出口成对 + 每出口独立 NAT 池（减少跨设备）</text>  <text class="w" x="520" y="310">- 会话同步 / 非对称探测（同步）</text>  <text class="k" x="24" y="300">THREE-STEP DIAGNOSIS</text>  <text class="w" x="24" y="316">1. 两向抓包：同一五元组是否走了不同设备</text>  <text class="w" x="24" y="330">2. 看回程设备的会话/映射表是否有这条流</text>  <text class="w" x="24" y="344">3. 临时改成对称（关一条出口）验证结论</text>  <line x1="24" y1="364" x2="876" y2="364" stroke="#dfe6f1" stroke-width=".8"/>  <text class="x" x="24" y="384">The trap: teams chase BGP attributes for weeks while the actual cause is a firewall that never saw the SYN.</text>  <text class="w" x="24" y="406">Ask first: does the return path cross a device that keeps state? If yes, the routing is only half the design - the state path has to be designed too.</text>
</svg>
