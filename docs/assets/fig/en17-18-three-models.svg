<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">L2 MPLS VPN, L3 MPLS VPN and Internet plus overlay compared over ten dimensions</title>
  <desc id="d15">Ten dimensions are compared across the three transport models. L2 has the highest topology freedom including Layer 2 adjacency, committed per-class SLA, encryption you add yourself, multicast you control, but hub detours for cloud and weeks to months for turn-up at high per-megabit cost. L3 gives committed SLA and optional group encryption with mVPN, but is product-constrained in topology, also detours cloud traffic and is priced by distance. Internet plus overlay has the highest any-to-any freedom, local breakout for SaaS, days to turn up and low cost, but best effort quality, probe-only failure visibility and awkward multicast. The panel notes that most real designs are mixed - A-tier sites on L3 VPN, B-tier on Internet plus overlay, C-tier on broadband with probes - provided one policy model spans all three, because the failure to avoid is a different operating model per transport.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Three transport models, ten dimensions, and no winner outside a requirement</text>  <text class="s" x="24" y="45">L2, L3 and Internet plus overlay differ on cost, control, visibility and speed of change - in opposite directions</text>
  <rect x="24" y="68" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="83">DIMENSION</text>  <text class="k" x="208.0" y="83">L2 MPLS VPN</text>  <text class="k" x="432.0" y="83">L3 MPLS VPN</text>  <text class="k" x="656.0" y="83">INTERNET + OVERLAY</text>  <rect x="24" y="90" width="852" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="105">Topology freedom</text>  <text class="g" x="208.0" y="105">highest, incl. L2</text>  <text class="c" x="432.0" y="105">product-constrained</text>  <text class="g" x="656.0" y="105">highest, any-to-any</text>  <line x1="24" y1="113" x2="876" y2="113" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="113" width="852" height="23" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="128">Quality / SLA</text>  <text class="g" x="208.0" y="128">committed per class</text>  <text class="g" x="432.0" y="128">committed per class</text>  <text class="x" x="656.0" y="128">best effort</text>  <line x1="24" y1="136" x2="876" y2="136" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="136" width="852" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="151">Encryption</text>  <text class="c" x="208.0" y="151">yours to add</text>  <text class="c" x="432.0" y="151">optional (GET VPN)</text>  <text class="c" x="656.0" y="151">mandatory</text>  <line x1="24" y1="159" x2="876" y2="159" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="159" width="852" height="23" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="174">Multicast</text>  <text class="c" x="208.0" y="174">yours</text>  <text class="c" x="432.0" y="174">mVPN</text>  <text class="x" x="656.0" y="174">GRE/DMVPN</text>  <line x1="24" y1="182" x2="876" y2="182" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="182" width="852" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="197">Cloud / SaaS access</text>  <text class="x" x="208.0" y="197">hub detour</text>  <text class="x" x="432.0" y="197">hub detour</text>  <text class="g" x="656.0" y="197">local breakout</text>  <line x1="24" y1="205" x2="876" y2="205" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="205" width="852" height="23" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="220">Turn-up speed</text>  <text class="x" x="208.0" y="220">weeks to months</text>  <text class="x" x="432.0" y="220">weeks to months</text>  <text class="g" x="656.0" y="220">days</text>  <line x1="24" y1="228" x2="876" y2="228" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="228" width="852" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="243">Cost per Mbps</text>  <text class="x" x="208.0" y="243">high, distance-priced</text>  <text class="x" x="432.0" y="243">high, distance-priced</text>  <text class="g" x="656.0" y="243">low</text>  <line x1="24" y1="251" x2="876" y2="251" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="251" width="852" height="23" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="266">Failure visibility</text>  <text class="g" x="208.0" y="266">carrier alarms</text>  <text class="g" x="432.0" y="266">carrier alarms</text>  <text class="x" x="656.0" y="266">your probes only</text>  <line x1="24" y1="274" x2="876" y2="274" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="274" width="852" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="289">Ops skill needed</text>  <text class="c" x="208.0" y="289">routing + STP</text>  <text class="c" x="432.0" y="289">routing policy</text>  <text class="c" x="656.0" y="289">crypto + probes</text>  <line x1="24" y1="297" x2="876" y2="297" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="297" width="852" height="23" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="312">Best fit</text>  <text class="c" x="208.0" y="312">L2 adjacency, merger</text>  <text class="c" x="432.0" y="312">stable core, compliance</text>  <text class="g" x="656.0" y="312">cloud-first, many sites</text>  <line x1="24" y1="320" x2="876" y2="320" stroke="#eef2f8" stroke-width=".7"/>
  <rect x="24" y="322" width="852" height="58" rx="3" fill="#f4f8ff" stroke="#c9dcfb" stroke-width=".8"/>
  <text class="k" x="36" y="340">MOST REAL DESIGNS ARE MIXED, AND THAT IS THE POINT</text>
  <text class="b" x="36" y="358">A-tier sites on L3 VPN for the core, B-tier on Internet plus overlay, C-tier on broadband with probes - one policy model across all three.</text>
  <text class="c" x="36" y="372">The failure to avoid is a different operating model per transport: three ways to add a site, three ways to troubleshoot one.</text>
  <line x1="24" y1="392" x2="876" y2="392" stroke="#dfe6f1" stroke-width=".8"/>
  <text class="b" x="24" y="410">Pick per site class, then unify routing policy, address plan and monitoring - the transport is a cost decision, the operating model is not</text>
  <text class="x" x="24" y="426">Do not compare only circuit prices: the hidden line is the skill and tooling needed to run each transport.</text>
</svg>
