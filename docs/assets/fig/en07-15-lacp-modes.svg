<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="100%" role="img" aria-labelledby="t715 d715">

  <title id="t715">The three LACP modes compared by negotiation, mismatch detection, risk and use, beside the five attributes both ends must share</title>
  <desc id="d715">Three cards. Static mode on negotiates nothing, detects no mismatch, and risks a bundle on one side and independent links on the other, producing duplicate frames and spanning tree confusion. Active mode negotiates, detects mismatches, and is the default recommendation. Passive mode negotiates only when the other end starts, useful when the peer is not under your control. A box beside them lists the attributes both ends must share: speed and duplex, MTU, VLAN configuration, member limits, and ideally the same card and optics batch. A note explains the classic half-configured bundle.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .lab{font:700 6.5px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.4px}
    .m{font:7.5px "Consolas",monospace;fill:#1a2233}
  </style>

  <rect x="0" y="0" width="900" height="442" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Three modes, one recommendation: negotiate, always, on both ends</text>
  <text class="s" x="24" y="45">A bundle that exists on one side only is worse than no bundle at all</text>

  <rect x="24" y="76" width="148" height="176" rx="3" fill="#fff8f7" stroke="#e8c4c0" stroke-width=".7"/>
  <rect x="24" y="76" width="148" height="3" fill="#c0392b"/>
  <text class="b" x="38" y="98" fill="#c0392b">mode on</text>
  <text class="w" x="38" y="110">static, no protocol</text>
  <text class="lab" x="38" y="132">NEGOTIATION</text>
  <text class="c" x="38" y="144">none at all</text>
  <text class="lab" x="38" y="162">MISMATCH</text>
  <text class="c" x="38" y="174">never detected</text>
  <text class="lab" x="38" y="192">RISK</text>
  <text class="c" x="38" y="204">bundle on one side,</text>
  <text class="c" x="38" y="216">independent links on</text>
  <text class="c" x="38" y="228">the other</text>
  <text class="w" x="38" y="246" fill="#c0392b">do not use</text>

  <rect x="180" y="76" width="148" height="176" rx="3" fill="#f5fdfa" stroke="#bfe3de" stroke-width=".7"/>
  <rect x="180" y="76" width="148" height="3" fill="#0f7f73"/>
  <text class="b" x="194" y="98" fill="#0f7f73">mode active</text>
  <text class="w" x="194" y="110">the default answer</text>
  <text class="lab" x="194" y="132">NEGOTIATION</text>
  <text class="c" x="194" y="144">starts it</text>
  <text class="lab" x="194" y="162">MISMATCH</text>
  <text class="c" x="194" y="174">detected, bundle</text>
  <text class="c" x="194" y="186">refuses to form</text>
  <text class="lab" x="194" y="204">RISK</text>
  <text class="c" x="194" y="216">a silent bundle is</text>
  <text class="c" x="194" y="228">impossible</text>
  <text class="w" x="194" y="246" fill="#0f7f73">use everywhere</text>

  <rect x="336" y="76" width="148" height="176" rx="3" fill="#fdfcf5" stroke="#e2d6b0" stroke-width=".7"/>
  <rect x="336" y="76" width="148" height="3" fill="#b8862b"/>
  <text class="b" x="350" y="98" fill="#b8862b">mode passive</text>
  <text class="w" x="350" y="110">waits to be asked</text>
  <text class="lab" x="350" y="132">NEGOTIATION</text>
  <text class="c" x="350" y="144">only as an answer</text>
  <text class="lab" x="350" y="162">MISMATCH</text>
  <text class="c" x="350" y="174">detected, but only</text>
  <text class="c" x="350" y="186">if the peer speaks</text>
  <text class="lab" x="350" y="204">RISK</text>
  <text class="c" x="350" y="216">two passive ends</text>
  <text class="c" x="350" y="228">never form a bundle</text>
  <text class="w" x="350" y="246" fill="#b8862b">peer not under your control</text>

  <rect x="500" y="76" width="376" height="176" rx="3" fill="#f4f8fe" stroke="#c3d5f2" stroke-width=".7"/>
  <text class="k" x="514" y="92">WHAT BOTH ENDS MUST SHARE</text>
  <text class="c" x="514" y="112"><tspan style="font-weight:700">1.</tspan> speed and duplex &#8212; a mixed bundle is refused or degraded</text>
  <text class="c" x="514" y="134"><tspan style="font-weight:700">2.</tspan> MTU &#8212; members with different MTU break large frames</text>
  <text class="c" x="514" y="156"><tspan style="font-weight:700">3.</tspan> VLAN configuration &#8212; trunk, access and native must agree</text>
  <text class="c" x="514" y="178"><tspan style="font-weight:700">4.</tspan> member limits &#8212; the platform maximum is per device, not per design</text>
  <text class="c" x="514" y="200"><tspan style="font-weight:700">5.</tspan> card and optics generation &#8212; not enforced, still worth matching</text>
  <text class="w" x="514" y="222">A bundle is a negotiated contract; every clause is verified at bring-up,</text>
  <text class="w" x="514" y="234">which is exactly what the protocol is for.</text>

  <text class="k" x="24" y="278">THE HALF-CONFIGURED BUNDLE, IN THREE FRAMES</text>
  <text class="b" x="24" y="298">One end is</text>
  <text class="m" x="86" y="298">mode on</text>
  <text class="c" x="24" y="314">so it bundles all four links and hashes across them, unconditionally.</text>
  <text class="b" x="24" y="334">The other end is</text>
  <text class="m" x="122" y="334">mode active</text>
  <text class="c" x="24" y="350">so it receives no LACPDUs, refuses to bundle, and keeps four independent links.</text>
  <text class="c" x="24" y="370" fill="#c0392b">The result: duplicate frames, out-of-order delivery, and STP seeing three loops that nobody configured.</text>
  <text class="c" x="24" y="386" fill="#c0392b">Nothing logs an error on the end that is wrong, because from its point of view nothing is.</text>

  <rect x="24" y="398" width="852" height="30" rx="3" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <text class="c" x="40" y="418" fill="#c0392b">Rule for the standard: active on both ends, verified by <tspan style="font-family:Consolas,monospace">show etherchannel summary</tspan> showing all members bundled with flags of P and in use.</text>
</svg>
