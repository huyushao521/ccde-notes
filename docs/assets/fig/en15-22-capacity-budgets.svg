<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Four capacity budgets: PoE watts, bandwidth oversubscription, table ceilings and convergence time</title>
  <desc id="d15">Power over Ethernet: the budget formula is the sum of port maximum multiplied by draw probability, times 1.2 headroom, with class figures of 15.4 watts for 802.3af, 30 watts for 802.3at and 60 or 90 watts for 802.3bt, worked through as twenty 30 watt access points plus twenty 7 watt phones equal 740 watts, and 888 watts with headroom. Bandwidth oversubscription: 20 to 1 up to 48 to 1 from access to distribution, 2 to 1 up to 4 to 1 from distribution to core, and the exit designed to contracted bandwidth, with a note that a wireless access point is the hidden 2.4 to 1 when a 1 gigabit uplink carries two radios. Table budgets per gateway and per design: 8,000 ARP entries, a campus RIB in the low thousands, 200 VLANs and a 7 hop spanning tree diameter. Convergence budget measured rather than assumed: three to eighteen seconds for multitier STP, under a second for routed access with BFD, under one and a half seconds for a cluster and zero to three hundred seconds for the host tail.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="404" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Turning the architecture into numbers: four budgets that get skipped</text>  <text class="s" x="24" y="45">PoE watts, bandwidth oversubscription, table ceilings and convergence - each one has a worked formula, and each one fails quietly.</text>  <rect x="24" y="86" width="414" height="176" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="36" y="104">POWER OVER ETHERNET</text>  <text class="b" x="36" y="122">budget = sum(port max x draw probability) x 1.2</text>  <text class="c" x="40" y="136">802.3af</text>  <text class="c" x="100" y="136">15.4 W</text>  <text class="w" x="150" y="136">phones, basic APs</text>  <text class="c" x="40" y="158">802.3at</text>  <text class="c" x="100" y="158">30 W</text>  <text class="w" x="150" y="158">Wi-Fi 6 APs</text>  <text class="c" x="40" y="180">802.3bt</text>  <text class="c" x="100" y="180">60/90 W</text>  <text class="w" x="150" y="180">Wi-Fi 6E/7, high-power IoT</text>  <rect x="36" y="206" width="390" height="44" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="m" x="46" y="222">20 x 30 W (AP) + 20 x 7 W (phone) = 740 W</text>  <text class="m" x="46" y="238">740 W x 1.2 headroom = 888 W required</text>  <rect x="462" y="86" width="414" height="176" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="474" y="104">BANDWIDTH OVERSUBSCRIPTION</text>  <text class="b" x="474" y="122">campus peaks do not coincide, exits do</text>  <text class="c" x="478" y="140">access to dist</text>  <rect x="600" y="129" width="76" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="638.0" y="140" text-anchor="middle">20:1 - 48:1</text>  <text class="w" x="690" y="140">1G access / 10G uplink</text>  <text class="c" x="478" y="170">dist to core</text>  <rect x="600" y="159" width="76" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="638.0" y="170" text-anchor="middle">2:1 - 4:1</text>  <text class="w" x="690" y="170">leave east-west headroom</text>  <text class="c" x="478" y="200">core to exit</text>  <rect x="600" y="189" width="76" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="638.0" y="200" text-anchor="middle">contracted</text>  <text class="w" x="690" y="200">the only WAN-shaped point</text>  <text class="w" x="474" y="232">the wireless AP is the hidden 2.4:1 - 1G uplink carrying two radios</text>  <rect x="474" y="240" width="390" height="10" rx="3" fill="#fdf6f4" stroke="none"/>  <line x1="24" y1="278" x2="876" y2="278" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="296">Table and time budgets</text>  <text class="k" x="24" y="314">PER BOX / PER DESIGN</text>  <text class="c" x="40" y="330">ARP / ND per gateway  &lt;= 8,000</text>  <text class="c" x="250" y="330">campus RIB  low thousands</text>  <text class="c" x="40" y="348">VLANs per campus  &lt;= 200</text>  <text class="c" x="250" y="348">STP diameter  &lt;= 7 hops</text>  <text class="k" x="474" y="314">CONVERGENCE BUDGET, MEASURED NOT ASSUMED</text>  <text class="c" x="478" y="330">multitier STP  3-18 s</text>  <text class="c" x="688" y="330">routed access + BFD  &lt; 1 s</text>  <text class="c" x="478" y="348">cluster  &lt; 1.5 s</text>  <text class="c" x="688" y="348">host / session tail  0-300 s</text>  <text class="x" x="24" y="372">The classic incident: PoE designed against 802.3af at 15.4 W while the APs negotiate 802.3at at 30 W - the supply is oversubscribed and</text>  <text class="x" x="24" y="386">the symptom is APs rebooting at lunchtime, not a link-down alarm.</text>
</svg>
