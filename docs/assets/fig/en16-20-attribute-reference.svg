<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">A BGP attribute reference table across outbound and inbound directions with scope and precedence, plus one outbound and one inbound example</title>
  <desc id="d15">A seven-row table lists local preference as outbound, inside the local autonomous system, higher wins, used for primary and backup between your own exits; AS-path prepending as inbound across autonomous systems where shorter wins, used to make the other side prefer you less; MED as inbound inside one neighbour AS where lower wins, used for two links into the same provider; communities as inbound by agreement where the other side's policy decides and only a contract makes it work; weight and static routes as outbound per device; aggregation with summary-only inside the local AS to reduce the number of announcements; and maximum-prefix or filtering at the boundary to prevent prefix leaks. On the right, an outbound example sets local preference 200 and 100 on two neighbours, taking effect immediately in your own table, and an inbound example prepends and sets MED, with the warning to ask which attribute the other side actually selects on before tuning anything.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="428" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">BGP attribute quick reference: first decide outbound or inbound, then choose the knob</text>  <text class="s" x="24" y="45">Seven attributes, two directions, two scopes. Choosing the knob before the direction is how a two-month tuning project starts.</text>  <rect x="24" y="76" width="560" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="91">属性 / 机制</text>  <text class="k" x="164.0" y="91">方向</text>  <text class="k" x="220.0" y="91">作用域</text>  <text class="k" x="316.0" y="91">优先规则</text>  <text class="k" x="424.0" y="91">典型用途</text>  <rect x="24" y="98" width="560" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="122">local-preference</text>  <text class="g" x="164.0" y="122">出向</text>  <text class="c" x="220.0" y="122">本 AS 内</text>  <text class="c" x="316.0" y="122">越高越优先</text>  <text class="g" x="424.0" y="122">自建出口主备</text>  <line x1="24" y1="130" x2="584" y2="130" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="130" width="560" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="154">AS-path prepend</text>  <text class="r" x="164.0" y="154">入向</text>  <text class="c" x="220.0" y="154">跨 AS</text>  <text class="c" x="316.0" y="154">路径越短越优先</text>  <text class="x" x="424.0" y="154">让对方少选你</text>  <line x1="24" y1="162" x2="584" y2="162" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="162" width="560" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="186">MED</text>  <text class="r" x="164.0" y="186">入向</text>  <text class="c" x="220.0" y="186">同一邻居 AS</text>  <text class="c" x="316.0" y="186">越低越优先</text>  <text class="g" x="424.0" y="186">同 ISP 双链路</text>  <line x1="24" y1="194" x2="584" y2="194" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="194" width="560" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="218">community</text>  <text class="r" x="164.0" y="218">入向</text>  <text class="c" x="220.0" y="218">按对方约定</text>  <text class="c" x="316.0" y="218">对方策略决定</text>  <text class="x" x="424.0" y="218">有合同才有效</text>  <line x1="24" y1="226" x2="584" y2="226" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="226" width="560" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="250">weight / 静态</text>  <text class="g" x="164.0" y="250">出向</text>  <text class="c" x="220.0" y="250">本设备</text>  <text class="c" x="316.0" y="250">越高越优先</text>  <text class="g" x="424.0" y="250">单机强制出口</text>  <line x1="24" y1="258" x2="584" y2="258" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="258" width="560" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="282">aggregate + summary-only</text>  <text class="r" x="164.0" y="282">入向</text>  <text class="c" x="220.0" y="282">本 AS 内</text>  <text class="c" x="316.0" y="282">掩码更短</text>  <text class="g" x="424.0" y="282">减少宣告条数</text>  <line x1="24" y1="290" x2="584" y2="290" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="290" width="560" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="314">最大前缀 / 过滤</text>  <text class="c" x="164.0" y="314">双向</text>  <text class="c" x="220.0" y="314">边界</text>  <text class="c" x="316.0" y="314">超限即断</text>  <text class="g" x="424.0" y="314">防前缀泄漏</text>  <line x1="24" y1="322" x2="584" y2="322" stroke="#eef2f8" stroke-width=".7"/>  <rect x="600" y="76" width="276" height="132" rx="3" fill="#fbfcfe" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="610" y="94">OUTBOUND: ONE LINE DECIDES</text>  <text class="m" x="610" y="112">neighbor 198.51.100.1 route-map A in</text>  <text class="m" x="610" y="124"> set local-preference 200</text>  <text class="m" x="610" y="140">neighbor 203.0.113.1 route-map B in</text>  <text class="m" x="610" y="152"> set local-preference 100</text>  <text class="c" x="610" y="172">改自己的表，立即生效</text>  <text class="w" x="610" y="190">代价：需先测每出口质量</text>  <rect x="600" y="216" width="276" height="132" rx="3" fill="#fbfcfe" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="610" y="234">INBOUND: ASK FIRST</text>  <text class="m" x="610" y="252">set as-path prepend 65001 65001</text>  <text class="m" x="610" y="268">set metric 100   ! MED</text>  <text class="c" x="610" y="284">改别人的表，分钟到小时</text>  <text class="x" x="610" y="302">先问：对方按哪个属性选路？</text>  <text class="w" x="610" y="320">答不出来就别调，改成主备宣告</text>  <text class="b" x="24" y="356">The two questions to ask in this order</text>  <text class="w" x="24" y="374">1. 这条流量是我发出去的（出向），还是别人发进来的（入向）？出向改 LP/静态即可；入向只能影响，必须有主备兜底。</text>  <text class="w" x="24" y="388">2. 我改的这个属性，跨不跨 AS？LP/weight 不出本 AS，MED 不出邻居 AS，prepend 与 community 才跨 AS。</text>  <text class="x" x="24" y="410">反例：为入向问题配 LP。改了三天，流量一点没动，最后发现改的是自己的表。</text>
</svg>
