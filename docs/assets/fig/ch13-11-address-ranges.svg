<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" width="100%" role="img" aria-labelledby="c13f11t c13f11d">
  <title id="c13f11t">IPv4 组播地址空间的分块与各自的设计含义</title>
  <desc id="c13f11d">地址条带从左到右依次为 224.0.0.0/24 链路本地（TTL=1 不转发）、224.0.1.0 至 231.255.255.255 全球 ASM、232.0.0.0/8 SSM、233.0.0.0/8 GLOP、239.0.0.0/8 管理范围私有地址。下方给出各块用途与设计提示，右下列出必须记住的知名协议地址。</desc>
  <style>
    .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .seg{font:600 9.5px "Segoe UI",sans-serif;fill:#1a2233}
    .k{font:600 9px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .b{font:8.5px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .n{font:9px "Segoe UI",sans-serif;fill:#1a2233}
    .g{font:8.5px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .c{font:8.5px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .r{font:8.5px "Microsoft YaHei",sans-serif;fill:#a32020}
    .rt{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
  </style>
  <rect x="0" y="0" width="960" height="486" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">组播地址是"土地证"：先看清哪块地能用，再谈规划</text>
  <text class="s" x="24" y="48">D 类 224.0.0.0/4 共 2²⁸ 个地址，但真正能给你业务用的只是其中几段</text>

  <text class="b" x="40" y="84">224.0.0.0/4（D 类组播）</text>
  <rect x="40" y="96" width="120" height="46" fill="#fdeaea" stroke="#a32020"/>
  <text class="seg" x="100" y="116" text-anchor="middle">224.0.0.0/24</text>
  <text class="g" x="100" y="132" text-anchor="middle">链路本地</text>
  <rect x="160" y="96" width="200" height="46" fill="#eef3ff" stroke="#2f6fed"/>
  <text class="seg" x="260" y="116" text-anchor="middle">224.0.1.0 – 231.255.255.255</text>
  <text class="g" x="260" y="132" text-anchor="middle">全球 ASM 范围</text>
  <rect x="360" y="96" width="160" height="46" fill="#e9f6f4" stroke="#0f7f73"/>
  <text class="seg" x="440" y="116" text-anchor="middle">232.0.0.0/8</text>
  <text class="g" x="440" y="132" text-anchor="middle">SSM 专用</text>
  <rect x="520" y="96" width="120" height="46" fill="#f3effb" stroke="#6b4fbb"/>
  <text class="seg" x="580" y="116" text-anchor="middle">233.0.0.0/8</text>
  <text class="g" x="580" y="132" text-anchor="middle">GLOP</text>
  <rect x="640" y="96" width="280" height="46" fill="#eaf1ff" stroke="#2f6fed" stroke-width="1.6"/>
  <text class="seg" x="780" y="116" text-anchor="middle">239.0.0.0/8</text>
  <text class="g" x="780" y="132" text-anchor="middle">管理范围（私有）</text>

  <rect x="40" y="150" width="116" height="122" rx="5" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="50" y="168">协议自用</text>
  <text class="r" x="50" y="188">TTL=1，路由器</text>
  <text class="r" x="50" y="202">永不转发</text>
  <text class="b" x="50" y="222">PIM/OSPF/</text>
  <text class="b" x="50" y="236">IGMP/HSRP</text>
  <text class="r" x="50" y="258">绝不能分配给业务</text>

  <rect x="164" y="150" width="192" height="122" rx="5" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="174" y="168">传统 ASM 全球范围</text>
  <text class="b" x="174" y="188">需要 IANA/运营商分配，</text>
  <text class="b" x="174" y="202">跨域才有意义</text>
  <text class="c" x="174" y="222">企业内部一般不用：</text>
  <text class="c" x="174" y="236">既无收益，又要对外协调</text>
  <text class="g" x="174" y="258">（GLOP 233/8 按 AS 号分配：233.&lt;AS高&gt;.&lt;AS低&gt;.x）</text>

  <rect x="364" y="150" width="152" height="122" rx="5" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="374" y="168">SSM（源特定）</text>
  <text class="c" x="374" y="188">现代企业首选：</text>
  <text class="c" x="374" y="202">无 RP、无 Register</text>
  <text class="b" x="374" y="222">前提：IGMPv3 + (S,G)</text>
  <text class="b" x="374" y="236">加入；应用需知道源</text>
  <text class="r" x="374" y="258">老终端不支持 v3 就进不来</text>

  <rect x="524" y="150" width="112" height="122" rx="5" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="534" y="168">GLOP</text>
  <text class="b" x="534" y="188">按 AS 号自动</text>
  <text class="b" x="534" y="202">生成的全球块</text>
  <text class="g" x="534" y="224">每 AS 一个 /24</text>
  <text class="g" x="534" y="238">只在跨域运营时</text>
  <text class="g" x="534" y="252">才需要</text>

  <rect x="644" y="150" width="276" height="122" rx="5" fill="#fff" stroke="#3a6fe0"/>
  <text class="k" x="654" y="168">239.0.0.0/8：企业主用地段</text>
  <text class="b" x="654" y="188">等价于组播里的 RFC1918，域内可路由、</text>
  <text class="b" x="654" y="202">不会被公网使用</text>
  <text class="c" x="654" y="222">239.255.0.0/16 常保留给"单跳/测试"</text>
  <text class="b" x="654" y="242">规划方式见下图：站点 /16、业务 /24</text>
  <text class="r" x="654" y="262">设计评审必查：业务组地址是否落在 239/8 或 232/8</text>

  <rect x="40" y="284" width="880" height="148" rx="6" fill="#fff" stroke="#d7e0ec"/>
  <text class="rt" x="56" y="304" style="fill:#b06a00">必须记住的知名地址（排障时天天见）</text>
  <text class="n" x="56" y="326">224.0.0.1</text><text class="b" x="140" y="326">All Hosts：本网段所有主机</text>
  <text class="n" x="56" y="346">224.0.0.2</text><text class="b" x="140" y="346">All Routers：本网段所有路由器</text>
  <text class="n" x="56" y="366">224.0.0.5 / .6</text><text class="b" x="140" y="366">OSPF AllSPFRouters / AllDRouters</text>
  <text class="n" x="56" y="386">224.0.0.13</text><text class="b" x="140" y="386">PIMv2 All-PIM-Routers（BSR 消息也发到这里）</text>
  <text class="n" x="56" y="406">224.0.0.22</text><text class="b" x="140" y="406">IGMPv3 报告</text>

  <text class="n" x="520" y="326">224.0.0.9</text><text class="b" x="604" y="326">RIPv2</text>
  <text class="n" x="520" y="346">224.0.1.39</text><text class="b" x="604" y="346">Auto-RP Announce（C-RP 发出）</text>
  <text class="n" x="520" y="366">224.0.1.40</text><text class="b" x="604" y="366">Auto-RP Discovery（Mapping Agent 发出）</text>
  <text class="n" x="520" y="386">233.252.0.0/24</text><text class="b" x="620" y="386">MCAST-TEST-NET（文档与实验）</text>
  <text class="n" x="520" y="406">239.255.255.250</text><text class="b" x="640" y="406">SSDP（终端发现，常被安全策略拦）</text>

  <text class="r" x="24" y="456">设计含义：这三段决定一切——224.0.0.0/24 只给协议；232/8 给 SSM 业务；239/8 给 ASM/BiDir 业务。混用会同时踩"协议报文被业务淹没"与"业务被安全策略误拦"。</text>
  <text class="g" x="24" y="474">注意：224.0.0.0/24 段内的流量虽然 TTL=1，但仍是链路上真实存在的组播流量，抓包与 ACL 都需要显式放行/拒绝。</text>
</svg>
