<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" role="img" aria-labelledby="t710 d710">

  <title id="t710">End-to-end VLAN against local VLAN on the same campus, compared across six measurements that decide the argument</title>
  <desc id="d710">Two diagrams of the same campus. On the left one blue band labelled VLAN 10 spans forty access switches, giving a single spanning tree domain and many idle alternate ports. On the right each access switch terminates its own VLAN with a Layer 3 boundary toward the core, giving one tree domain per switch and no blocked ports. A six row table compares spanning tree domain size, alternate ports, convergence after a change, blast radius, addressing while users move, and what breaks first. A note at the bottom says the argument is settled by measurements rather than preference, and lists the exceptions that justify stretching Layer 2: live migration, cluster heartbeats and licence binding.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .sw{font:600 7.5px "Segoe UI",sans-serif;fill:#1a2233}
  </style>

  <rect x="0" y="0" width="900" height="480" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">The same campus, two designs: one VLAN everywhere, or one VLAN per wiring closet</text>
  <text class="s" x="24" y="45">Everything else in this section is a consequence of this single choice</text>

  <text class="b" x="24" y="68" fill="#c0392b">End-to-end VLAN</text>
  <text class="w" x="24" y="80">the address follows the user</text>

  <rect x="60" y="92" width="90" height="22" rx="2" fill="#eef3fb" stroke="#1f4fc0" stroke-width=".7"/>
  <text class="sw" x="105" y="107" text-anchor="middle">CORE</text>
  <rect x="36" y="150" width="86" height="20" rx="2" fill="#f6f9fe" stroke="#b9c3d2" stroke-width=".6"/>
  <text class="sw" x="79" y="164" text-anchor="middle">ASW-1</text>
  <rect x="136" y="150" width="86" height="20" rx="2" fill="#f6f9fe" stroke="#b9c3d2" stroke-width=".6"/>
  <text class="sw" x="179" y="164" text-anchor="middle">ASW-2</text>
  <rect x="236" y="150" width="86" height="20" rx="2" fill="#f6f9fe" stroke="#b9c3d2" stroke-width=".6"/>
  <text class="sw" x="279" y="164" text-anchor="middle">ASW-3</text>
  <text class="w" x="330" y="164">... 40 in total</text>
  <line x1="105" y1="114" x2="79" y2="150" stroke="#b9c3d2" stroke-width=".8"/>
  <line x1="105" y1="114" x2="179" y2="150" stroke="#b9c3d2" stroke-width=".8"/>
  <line x1="105" y1="114" x2="279" y2="150" stroke="#b9c3d2" stroke-width=".8"/>
  <rect x="30" y="142" width="298" height="36" rx="3" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="5 3"/>
  <text class="c" x="34" y="196" fill="#c0392b">VLAN 10 spans all forty switches: one broadcast domain, one tree, one blast radius</text>
  <text class="w" x="34" y="210">every triangle keeps a port in ALTN, and every change reconverges the estate</text>

  <line x1="440" y1="64" x2="440" y2="216" stroke="#eef1f6" stroke-width=".6"/>

  <text class="b" x="470" y="68" fill="#0f7f73">Local VLAN</text>
  <text class="w" x="470" y="80">the network follows the cable</text>

  <rect x="506" y="92" width="90" height="22" rx="2" fill="#eef3fb" stroke="#1f4fc0" stroke-width=".7"/>
  <text class="sw" x="551" y="107" text-anchor="middle">CORE</text>
  <rect x="482" y="158" width="86" height="20" rx="2" fill="#f6f9fe" stroke="#b9c3d2" stroke-width=".6"/>
  <text class="sw" x="525" y="172" text-anchor="middle">ASW-1</text>
  <rect x="582" y="158" width="86" height="20" rx="2" fill="#f6f9fe" stroke="#b9c3d2" stroke-width=".6"/>
  <text class="sw" x="625" y="172" text-anchor="middle">ASW-2</text>
  <rect x="682" y="158" width="86" height="20" rx="2" fill="#f6f9fe" stroke="#b9c3d2" stroke-width=".6"/>
  <text class="sw" x="725" y="172" text-anchor="middle">ASW-3</text>
  <line x1="551" y1="114" x2="525" y2="158" stroke="#0f7f73" stroke-width="1"/>
  <line x1="551" y1="114" x2="625" y2="158" stroke="#0f7f73" stroke-width="1"/>
  <line x1="551" y1="114" x2="725" y2="158" stroke="#0f7f73" stroke-width="1"/>
  <line x1="482" y1="150" x2="770" y2="150" stroke="#0f7f73" stroke-width=".7" stroke-dasharray="5 3"/>
  <text class="w" x="476" y="144" fill="#0f7f73">Layer 3 boundary here: one tree domain per switch</text>
  <rect x="484" y="182" width="82" height="16" rx="2" fill="#e6f5f2" stroke="#0f7f73" stroke-width=".5"/>
  <text class="sw" x="525" y="194" text-anchor="middle">VLAN 11</text>
  <rect x="584" y="182" width="82" height="16" rx="2" fill="#e6f5f2" stroke="#0f7f73" stroke-width=".5"/>
  <text class="sw" x="625" y="194" text-anchor="middle">VLAN 12</text>
  <rect x="684" y="182" width="82" height="16" rx="2" fill="#e6f5f2" stroke="#0f7f73" stroke-width=".5"/>
  <text class="sw" x="725" y="194" text-anchor="middle">VLAN 13</text>
  <text class="w" x="476" y="212" fill="#0f7f73">a loop affects one closet; a change reconverges one switch</text>

  <line x1="24" y1="226" x2="876" y2="226" stroke="#e6ebf3" stroke-width=".7"/>

  <text class="k" x="38" y="244">MEASUREMENT</text>
  <text class="k" x="220" y="244">END-TO-END VLAN</text>
  <text class="k" x="540" y="244">LOCAL VLAN</text>

  <text class="b" x="38" y="266">Spanning tree domain</text>
  <text class="c" x="220" y="266">forty switches</text>
  <text class="c" x="540" y="266">one switch</text>
  <line x1="24" y1="274" x2="876" y2="274" stroke="#f2f5fa" stroke-width=".6"/>

  <text class="b" x="38" y="292">Alternate ports</text>
  <text class="c" x="220" y="292">dozens, one per VLAN per triangle</text>
  <text class="c" x="540" y="292">none, if the access uplink is a loop-free U</text>
  <line x1="24" y1="300" x2="876" y2="300" stroke="#f2f5fa" stroke-width=".6"/>

  <text class="b" x="38" y="318">Convergence after a change</text>
  <text class="c" x="220" y="318">the whole estate reconverges</text>
  <text class="c" x="540" y="318">one switch, one uplink</text>
  <line x1="24" y1="326" x2="876" y2="326" stroke="#f2f5fa" stroke-width=".6"/>

  <text class="b" x="38" y="344">Blast radius</text>
  <text class="c" x="220" y="344">a loop anywhere affects everyone</text>
  <text class="c" x="540" y="344">one floor, and visibly</text>
  <line x1="24" y1="352" x2="876" y2="352" stroke="#f2f5fa" stroke-width=".6"/>

  <text class="b" x="38" y="370">Addressing while moving</text>
  <text class="c" x="220" y="370">address unchanged &#8212; that is the whole point</text>
  <text class="c" x="540" y="370">DHCP, or a planned move</text>
  <line x1="24" y1="378" x2="876" y2="378" stroke="#f2f5fa" stroke-width=".6"/>

  <text class="b" x="38" y="396">What breaks first</text>
  <text class="c" x="220" y="396">the largest VLAN, not the weakest link</text>
  <text class="c" x="540" y="396">the uplink, and it is obvious where</text>

  <rect x="24" y="414" width="852" height="56" rx="3" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <rect x="24" y="414" width="4" height="56" fill="#c0392b"/>
  <text class="c" x="40" y="432" fill="#c0392b"><tspan style="font-weight:700">The argument is settled by measurement, not preference:</tspan> ask for the size of the spanning tree domain you are willing to reconverge, and the design follows.</text>
  <text class="c" x="40" y="448" fill="#c0392b">Stretch Layer 2 only for the three exceptions that need it &#8212; live migration, cluster heartbeats and licence binding &#8212; and stretch it as narrowly as the exception allows.</text>
  <text class="c" x="40" y="464" fill="#c0392b">Each exception is a written decision with a name against it, not a default that arrives with the next wiring job.</text>
</svg>
