<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" role="img" aria-labelledby="t3 d3">

  <title id="t3">直接云接入、通过网关接入与混合方法三种云连接模型</title>
  <desc id="d3">上图：分支通过本地 Internet 出口直接访问 SaaS，其余流量仍回区域中心。中图：分支无本地出口，全部流量经隧道送到网关站点后统一出 Internet。下图：混合方式，按应用逐个判断走本地出口还是回网关。</desc>
  <defs>
    <marker id="a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/>
    </marker>
    <marker id="a3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6"/>
    </marker>
    <marker id="a3t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#12a594"/>
    </marker>
  </defs>
  <style>
    .rt{font:600 13px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2233}
    .rs{font:10.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#8a97a8}
    .bn{font:600 11.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2233}
    .bs{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .el{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#5b6b82}
    .note{font:11px "Segoe UI","Microsoft YaHei",sans-serif;fill:#7c8b9f}
  </style>

  <rect x="0" y="0" width="900" height="480" fill="#fbfcfe"/>

  <!-- ================= 行 1：DCA ================= -->
  <text class="rt" x="24" y="42" fill="#2f6fed">① 直接云接入 DCA / DIA</text>
  <text class="rs" x="24" y="60">分支自己有 Internet 出口，SaaS 走本地，其余回中心</text>

  <rect x="40" y="74" width="112" height="56" rx="7" fill="#eaf1ff" stroke="#2f6fed" stroke-width="1.2"/>
  <text class="bn" x="96" y="98" text-anchor="middle">分支 A</text>
  <text class="bs" x="96" y="114" text-anchor="middle">边缘路由器选路</text>

  <rect x="210" y="74" width="126" height="56" rx="7" fill="#f1f3f7" stroke="#9fb0c6" stroke-width="1.1"/>
  <text class="bn" x="273" y="98" text-anchor="middle">区域中心 / DC</text>
  <text class="bs" x="273" y="114" text-anchor="middle">安全栈 + 集中出口</text>

  <ellipse cx="452" cy="102" rx="58" ry="30" fill="#fff" stroke="#9fb0c6" stroke-width="1.2"/>
  <text class="bn" x="452" y="106" text-anchor="middle">Internet</text>

  <rect x="600" y="74" width="140" height="56" rx="28" fill="#e8f7f4" stroke="#12a594" stroke-width="1.2"/>
  <text class="bn" x="670" y="98" text-anchor="middle" fill="#0f7f73">SaaS</text>
  <text class="bs" x="670" y="114" text-anchor="middle">O365 / CRM</text>

  <line x1="154" y1="86" x2="392" y2="86" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#a3b)"/>
  <text class="el" x="200" y="80" fill="#1f4fc0">本地直出（最优路径）</text>
  <line x1="512" y1="102" x2="592" y2="102" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#a3b)"/>

  <path d="M152 118 H210" fill="none" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#a3g)"/>
  <path d="M338 118 H380 Q392 118 392 110 V108" fill="none" stroke="#9fb0c6" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#a3g)"/>
  <text class="el" x="196" y="134">其余 Internet 流量仍回中心</text>

  <text class="note" x="600" y="146">代价：分支需自有公网链路与本地安全能力</text>

  <line x1="24" y1="164" x2="876" y2="164" stroke="#e6ecf4" stroke-width="1"/>

  <!-- ================= 行 2：网关 ================= -->
  <text class="rt" x="24" y="192" fill="#12a594">② 通过网关接入</text>
  <text class="rs" x="24" y="210">分支没有本地出口，全部流量隧道到网关站点统一出网</text>

  <rect x="40" y="224" width="112" height="56" rx="7" fill="#e8f7f4" stroke="#12a594" stroke-width="1.2"/>
  <text class="bn" x="96" y="248" text-anchor="middle" fill="#0f7f73">分支 B</text>
  <text class="bs" x="96" y="264" text-anchor="middle">客户端站点</text>

  <rect x="210" y="224" width="126" height="56" rx="7" fill="#fff4e0" stroke="#d98600" stroke-width="1.3"/>
  <text class="bn" x="273" y="248" text-anchor="middle" fill="#a86400">网关站点</text>
  <text class="bs" x="273" y="264" text-anchor="middle">流量在此转 Internet</text>

  <ellipse cx="452" cy="252" rx="58" ry="30" fill="#fff" stroke="#9fb0c6" stroke-width="1.2"/>
  <text class="bn" x="452" y="256" text-anchor="middle">Internet</text>

  <rect x="600" y="224" width="140" height="56" rx="28" fill="#e8f7f4" stroke="#12a594" stroke-width="1.2"/>
  <text class="bn" x="670" y="248" text-anchor="middle" fill="#0f7f73">SaaS</text>
  <text class="bs" x="670" y="264" text-anchor="middle">同一条 SaaS 应用</text>

  <line x1="154" y1="252" x2="204" y2="252" stroke="#12a594" stroke-width="2" marker-end="url(#a3t)"/>
  <text class="el" x="154" y="242" fill="#0f7f73">GRE / IPsec</text>
  <line x1="338" y1="244" x2="392" y2="248" stroke="#12a594" stroke-width="1.6" marker-end="url(#a3t)"/>
  <line x1="512" y1="252" x2="592" y2="252" stroke="#12a594" stroke-width="1.6" marker-end="url(#a3t)"/>

  <line x1="120" y1="284" x2="120" y2="292" stroke="#d64545" stroke-width="1.4"/>
  <path d="M96 288 L144 306 M144 288 L96 306" stroke="#d64545" stroke-width="1.6"/>
  <text class="el" x="152" y="302" fill="#a32020">没有本地 Internet 出口</text>

  <text class="note" x="600" y="296">代价：时延叠加一段回程，网关成为容量与故障单点</text>

  <line x1="24" y1="316" x2="876" y2="316" stroke="#e6ecf4" stroke-width="1"/>

  <!-- ================= 行 3：混合 ================= -->
  <text class="rt" x="24" y="344" fill="#d98600">③ 混合方法 Hybrid</text>
  <text class="rs" x="24" y="362">同一个分支，按应用逐个判断：哪条路径绩效好用哪条</text>

  <rect x="40" y="376" width="112" height="56" rx="7" fill="#fdf6e8" stroke="#d98600" stroke-width="1.3"/>
  <text class="bn" x="96" y="400" text-anchor="middle" fill="#a86400">分支 C</text>
  <text class="bs" x="96" y="416" text-anchor="middle">按应用选路策略</text>

  <rect x="210" y="376" width="126" height="56" rx="7" fill="#fff4e0" stroke="#d98600" stroke-width="1.3"/>
  <text class="bn" x="273" y="400" text-anchor="middle" fill="#a86400">网关站点</text>
  <text class="bs" x="273" y="416" text-anchor="middle">兜底路径</text>

  <ellipse cx="452" cy="404" rx="58" ry="30" fill="#fff" stroke="#9fb0c6" stroke-width="1.2"/>
  <text class="bn" x="452" y="408" text-anchor="middle">Internet</text>

  <rect x="600" y="376" width="140" height="56" rx="28" fill="#e8f7f4" stroke="#12a594" stroke-width="1.2"/>
  <text class="bn" x="670" y="400" text-anchor="middle" fill="#0f7f73">多个 SaaS</text>
  <text class="bs" x="670" y="416" text-anchor="middle">应用 A 走本地，B 回网关</text>

  <line x1="154" y1="388" x2="392" y2="390" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#a3b)"/>
  <text class="el" x="200" y="382" fill="#1f4fc0">应用 A：DIA</text>
  <path d="M154 424 H210" fill="none" stroke="#12a594" stroke-width="1.8" marker-end="url(#a3t)"/>
  <text class="el" x="158" y="440" fill="#0f7f73">应用 B：回网关</text>
  <path d="M338 424 H380 Q392 424 392 418 V416" fill="none" stroke="#12a594" stroke-width="1.4" marker-end="url(#a3t)"/>
  <line x1="512" y1="404" x2="592" y2="404" stroke="#8494a8" stroke-width="1.4" marker-end="url(#a3g)"/>

  <text class="note" x="600" y="448">关键：需要能测量每条路径的质量，并按应用切换</text>

  <text class="note" x="24" y="466">选型依据不是"哪个先进"，而是：分支有没有本地公网链路、策略与安全能否下沉、能否承担按应用选路的运维成本。</text>
</svg>
