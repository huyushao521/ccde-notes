<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="100%" role="img" aria-labelledby="c13f10t c13f10d">
  <title id="c13f10t">组播设计七步法：每步的产出物与过不去的坎</title>
  <desc id="c13f10d">七行分别列出：业务与接收者清单、流量画像、地址与命名规划、二层设计、三层与模式选择、边界与安全、验证与运维。每行给出关键动作、必须的产出物，以及这一步最常见、也最容易把项目拖死的卡点。</desc>
  <style>
    .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .th{font:600 9px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
    .b{font:9px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .n{font:9px "Segoe UI",sans-serif;fill:#1a2233}
    .g{font:8.5px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .k{font:600 9px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .c{font:9px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .r{font:9px "Microsoft YaHei",sans-serif;fill:#a32020}
  </style>
  <rect x="0" y="0" width="960" height="476" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">七步法：前两步问需求，中间三步做设计，后两步做证明</text>
  <text class="s" x="24" y="48">顺序不能颠倒。跳过前三步直接配 PIM，最后一定会回到第一格重做</text>

  <rect x="24" y="62" width="912" height="26" rx="4" fill="#eef3ff"/>
  <text class="th" x="38" y="80">步骤</text>
  <text class="th" x="180" y="80">关键动作</text>
  <text class="th" x="520" y="80">必须留下的产出物</text>
  <text class="th" x="712" y="80">过不去的坎</text>

  <rect x="24" y="90" width="912" height="44" rx="4" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="38" y="117">① 业务与接收者清单</text>
  <text class="b" x="180" y="111">谁看什么频道、多少人、可接受多长中断、</text>
  <text class="b" x="180" y="127">是否需要双路（Live-Live）</text>
  <text class="b" x="520" y="117">接收者矩阵（站点×业务×人数）</text>
  <text class="r" x="712" y="117">"说不清谁在看"，后面全都无法验证</text>

  <rect x="24" y="136" width="912" height="44" rx="4" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="38" y="163">② 流量画像</text>
  <text class="b" x="180" y="157">每频道码率、并发组数、突发、</text>
  <text class="b" x="180" y="173">是否恒定码率（CBR）</text>
  <text class="b" x="520" y="163">带宽估算 + (S,G) 峰值估算</text>
  <text class="r" x="712" y="163">只给平均码率、不给突发与峰值</text>

  <rect x="24" y="182" width="912" height="44" rx="4" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="38" y="209">③ 地址与命名规划</text>
  <text class="b" x="180" y="203">239/8 与 232/8 分段、每站点/业务切块、</text>
  <text class="b" x="180" y="219">组播地址到 MAC 的冲突检查</text>
  <text class="b" x="520" y="209">地址分配表（入 IPAM）+ CI 校验脚本</text>
  <text class="r" x="712" y="209">"随手取地址"，三年后无法审计</text>

  <rect x="24" y="228" width="912" height="44" rx="4" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="38" y="255">④ 二层设计</text>
  <text class="b" x="180" y="249">VLAN 规划、Snooping/Querier/mrouter、</text>
  <text class="b" x="180" y="265">MVR、汇聚层 PIM Snooping</text>
  <text class="b" x="520" y="255">二层配置基线（模板化）</text>
  <text class="r" x="712" y="255">纯二层 VLAN 没有 Querier → 周期性断流</text>

  <rect x="24" y="274" width="912" height="44" rx="4" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="38" y="301">⑤ 三层与模式选择</text>
  <text class="b" x="180" y="295">SM / SSM / BiDir 选型、RP 位置与冗余、</text>
  <text class="b" x="180" y="311">SPT 策略、RPF 路径核对</text>
  <text class="b" x="520" y="301">模式决策记录 + RP 方案（含切换预算）</text>
  <text class="r" x="712" y="301">"多对多"却用 SM 单 RP —— 状态爆炸</text>

  <rect x="24" y="320" width="912" height="44" rx="4" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="38" y="347">⑥ 边界与安全</text>
  <text class="b" x="180" y="341">域间（MSDP/MBGP）、防火墙组播策略、</text>
  <text class="b" x="180" y="357">源侧限速、BSR/Auto-RP 与 SA 过滤</text>
  <text class="b" x="520" y="347">边界策略表 + 限速参数</text>
  <text class="r" x="712" y="347">默认信任内部与对端，边界无 ACL（案例十六）</text>

  <rect x="24" y="366" width="912" height="44" rx="4" fill="#fff" stroke="#eceff4"/>
  <text class="k" x="38" y="393">⑦ 验证与运维</text>
  <text class="b" x="180" y="387">验收用例、监控四项基线、mtrace/Runbook、</text>
  <text class="b" x="180" y="403">故障演练（RP 挂、源切、链路断）</text>
  <text class="b" x="520" y="393">测试报告 + 告警阈值 + Runbook</text>
  <text class="r" x="712" y="393">只测"有画面"，没测"树对不对"</text>

  <text class="r" x="24" y="432">最常见的失败模式：客户只想要"能看"，于是 ④⑤ 两步被压成"照抄模板"，而真正决定成败的是 ②③ 的估算与 ⑦ 的证明。</text>
  <text class="g" x="24" y="450">每步的"坎"都值得写进设计评审清单：能当场回答，方案才具备可交付性；答不上来的那一步，就是项目延期的地方。</text>
  <text class="g" x="24" y="468">顺序建议：① ② 先出数字，③ 定地址，④ ⑤ 定技术，⑥ 定边界，⑦ 用数字回头验证 ① ②。</text>
</svg>
