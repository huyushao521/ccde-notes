<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The nine deliverable tables of a campus design, with key columns and the audience for each</title>
  <desc id="d15">Nine numbered cards in a three by three grid. One, functional blocks: name, endpoints, bandwidth, availability class and exit, for design review. Two, tier selection: two-tier or three-tier with a business justification. Three, access model: model, convergence, failure behaviour and limitation. Four, L2/L3 boundary: which closet is layer 2, which is layer 3, and where the gateway sits, for implementation. Five, routing design: IGP, areas or queries, summary points and FHRP or BFD, for implementation and operations. Six, addressing: subnets, VLAN IDs, gateways, pools and summary boundaries, for IPAM. Seven, virtualisation: VRF or VN, route targets and distinguishers, isolation technique and fusion point, for security. Eight, capacity and convergence: ports, bandwidth, PoE, RIB and convergence budget, for acceptance. Nine, acceptance cases: fault scenario, expected behaviour and measured value. A footer warns that a missing table means an unmade decision, and that an untested high-availability design does not exist.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="502" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">The nine tables that turn a campus design into something reviewable</text>  <text class="s" x="24" y="45">A design that is only a topology diagram cannot be reviewed, bought, implemented or accepted.</text>  <rect x="24" y="88" width="272" height="112" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="88" width="272" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="34" y="105" font-size="11">1</text>  <text class="b" x="50" y="105">Functional blocks</text>  <text class="k" x="36" y="132">KEY COLUMNS</text>  <text class="w" x="36" y="146">name, endpoints, bandwidth, availability</text>  <text class="w" x="36" y="158">class, exit</text>  <text class="k" x="36" y="188">USED BY</text>  <text class="c" x="84" y="188">design review</text>  <rect x="312" y="88" width="272" height="112" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="312" y="88" width="272" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="322" y="105" font-size="11">2</text>  <text class="b" x="338" y="105">Tier selection</text>  <text class="k" x="324" y="132">KEY COLUMNS</text>  <text class="w" x="324" y="146">two-tier or three-tier, justification in</text>  <text class="w" x="324" y="158">business terms</text>  <text class="k" x="324" y="188">USED BY</text>  <text class="c" x="372" y="188">business + design</text>  <rect x="600" y="88" width="272" height="112" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="600" y="88" width="272" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="610" y="105" font-size="11">3</text>  <text class="b" x="626" y="105">Access model</text>  <text class="k" x="612" y="132">KEY COLUMNS</text>  <text class="w" x="612" y="146">model, convergence, failure behaviour,</text>  <text class="w" x="612" y="158">limitation</text>  <text class="k" x="612" y="188">USED BY</text>  <text class="c" x="660" y="188">design review</text>  <rect x="24" y="212" width="272" height="112" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="212" width="272" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="34" y="229" font-size="11">4</text>  <text class="b" x="50" y="229">L2/L3 boundary</text>  <text class="k" x="36" y="256">KEY COLUMNS</text>  <text class="w" x="36" y="270">which closet is L2, which is L3, where the</text>  <text class="w" x="36" y="282">gateway is</text>  <text class="k" x="36" y="312">USED BY</text>  <text class="c" x="84" y="312">implementation</text>  <rect x="312" y="212" width="272" height="112" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="312" y="212" width="272" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="322" y="229" font-size="11">5</text>  <text class="b" x="338" y="229">Routing design</text>  <text class="k" x="324" y="256">KEY COLUMNS</text>  <text class="w" x="324" y="270">IGP, areas or queries, summary points,</text>  <text class="w" x="324" y="282">FHRP/BFD</text>  <text class="k" x="324" y="312">USED BY</text>  <text class="c" x="372" y="312">implementation + ops</text>  <rect x="600" y="212" width="272" height="112" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="600" y="212" width="272" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="610" y="229" font-size="11">6</text>  <text class="b" x="626" y="229">Addressing</text>  <text class="k" x="612" y="256">KEY COLUMNS</text>  <text class="w" x="612" y="270">subnets, VLAN IDs, gateways, pools, summary</text>  <text class="w" x="612" y="282">boundaries</text>  <text class="k" x="612" y="312">USED BY</text>  <text class="c" x="660" y="312">implementation + IPAM</text>  <rect x="24" y="336" width="272" height="112" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="336" width="272" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="34" y="353" font-size="11">7</text>  <text class="b" x="50" y="353">Virtualisation</text>  <text class="k" x="36" y="380">KEY COLUMNS</text>  <text class="w" x="36" y="394">VRF/VN, RT/RD, isolation technique, fusion</text>  <text class="w" x="36" y="406">point</text>  <text class="k" x="36" y="436">USED BY</text>  <text class="c" x="84" y="436">security + ops</text>  <rect x="312" y="336" width="272" height="112" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="312" y="336" width="272" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="322" y="353" font-size="11">8</text>  <text class="b" x="338" y="353">Capacity + convergence</text>  <text class="k" x="324" y="380">KEY COLUMNS</text>  <text class="w" x="324" y="394">ports, bandwidth, PoE, RIB, convergence</text>  <text class="w" x="324" y="406">budget</text>  <text class="k" x="324" y="436">USED BY</text>  <text class="c" x="372" y="436">acceptance + ops</text>  <rect x="600" y="336" width="272" height="112" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="600" y="336" width="272" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="610" y="353" font-size="11">9</text>  <text class="b" x="626" y="353">Acceptance cases</text>  <text class="k" x="612" y="380">KEY COLUMNS</text>  <text class="w" x="612" y="394">fault scenario, expected behaviour,</text>  <text class="w" x="612" y="406">measured value</text>  <text class="k" x="612" y="436">USED BY</text>  <text class="c" x="660" y="436">acceptance + ops</text>  <line x1="24" y1="464" x2="876" y2="464" stroke="#dfe6f1" stroke-width=".8"/>  <text class="x" x="24" y="484">A missing table means a design decision was never made - and table 9 is the one that saves you: an untested high-availability design does not exist.</text>
</svg>
