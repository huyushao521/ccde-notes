<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Three homing scenarios - single-homed, multihomed on one router and multihomed on two routers - and the redundancy each one actually buys</title>
  <desc id="d15">Scenario one, single-homed: one interior segment, one firewall, one edge router and one ISP link, so every component is a single point and any failure means no connectivity. Scenario two, multihomed on one router: two ISP links with their own provider-aggregatable blocks and independent NAT pools, giving link and provider redundancy with local preference, while the router and firewall remain single points. Scenario three, multihomed on two routers: core, edge distribution with first hop redundancy, two edge routers in iBGP across the firewall and provider-independent /24 prefixes announced to both providers, giving link, provider and device redundancy at the cost of asymmetry, a neighbour crossing the firewall and state synchronisation. A comparison table scores links, devices, providers, addresses and state risk across the three scenarios, with a footer noting that each step up buys one more survivor and one more state problem.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="504" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Three homing scenarios: what each one actually buys</text>  <text class="s" x="24" y="45">Single-homed, multihomed on one router, multihomed on two routers with BGP across the firewall - three different sets of survivors.</text>  <text class="k" x="24" y="74">SCENARIO 1 · SINGLE-HOMED</text>  <rect x="24" y="84" width="274" height="168" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="48" y="96" width="100" height="40" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="b" x="60" y="113">内网</text>  <text class="c" x="60" y="125">core</text>  <rect x="168" y="96" width="106" height="40" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="b" x="180" y="113">FW</text>  <text class="c" x="180" y="125">single</text>  <rect x="48" y="158" width="100" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="60" y="175">edge router</text>  <text class="c" x="60" y="187">1 台</text>  <rect x="168" y="158" width="106" height="40" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="180" y="175">ISP-A</text>  <text class="c" x="180" y="187">1 链路</text>  <line x1="98" y1="136" x2="98" y2="158" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="148" y1="116" x2="168" y2="116" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="114" y1="158" x2="148" y2="178" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <text class="x" x="40" y="218">任何单点 = 断网：无冗余</text>  <text class="w" x="40" y="234">适合：小站点、可接受停机</text>  <text class="k" x="312" y="74">SCENARIO 2 · MULTIHOMED, ONE ROUTER</text>  <rect x="312" y="84" width="274" height="168" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="336" y="96" width="100" height="40" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="b" x="348" y="113">内网</text>  <text class="c" x="348" y="125">core</text>  <rect x="456" y="96" width="106" height="40" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="b" x="468" y="113">FW</text>  <text class="c" x="468" y="125">single</text>  <rect x="336" y="158" width="100" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="348" y="175">edge router</text>  <text class="c" x="348" y="187">1 台 + 2 池</text>  <rect x="456" y="150" width="106" height="30" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="468" y="167">ISP-A</text>  <text class="c" x="468" y="179">PA-A</text>  <rect x="456" y="186" width="106" height="30" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="468" y="203">ISP-B</text>  <text class="c" x="468" y="215">PA-B</text>  <line x1="386" y1="136" x2="386" y2="158" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="436" y1="116" x2="456" y2="116" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="436" y1="168" x2="400" y2="178" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="436" y1="200" x2="400" y2="188" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <text class="g" x="328" y="218">链路 + 运营商冗余；设备仍是单点</text>  <text class="w" x="328" y="234">需 LP 与每 ISP 独立 NAT 池</text>  <text class="k" x="600" y="74">SCENARIO 3 · MULTIHOMED, MULTI-ROUTER</text>  <rect x="600" y="84" width="276" height="168" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="624" y="96" width="96" height="34" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="b" x="636" y="113">核心</text>  <text class="c" x="636" y="125">IGP</text>  <rect x="744" y="96" width="116" height="34" rx="3" fill="#f2f6fd" stroke="#c9dcfb" stroke-width=".8"/>  <text class="b" x="756" y="113">边缘分布</text>  <text class="c" x="756" y="125">FHRP</text>  <rect x="624" y="150" width="96" height="34" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="636" y="167">router A</text>  <text class="c" x="636" y="179">iBGP</text>  <rect x="744" y="150" width="116" height="34" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="756" y="167">router B</text>  <text class="c" x="756" y="179">iBGP</text>  <rect x="624" y="200" width="96" height="30" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="636" y="217">ISP-A</text>  <text class="c" x="636" y="229">PI /24</text>  <rect x="744" y="200" width="116" height="30" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="756" y="217">ISP-B</text>  <text class="c" x="756" y="229">PI /24</text>  <line x1="672" y1="130" x2="672" y2="150" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="802" y1="130" x2="802" y2="150" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="720" y1="167" x2="744" y2="167" stroke="#9fb3d1" stroke-width="1"/>  <text class="w" x="724" y="164">跨 FW</text>  <line x1="672" y1="184" x2="660" y2="200" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="802" y1="184" x2="814" y2="200" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <text class="g" x="616" y="244">链路 + 运营商 + 设备冗余</text>  <text class="x" x="616" y="258">代价：非对称、跨 FW 邻居、状态同步</text>  <rect x="24" y="288" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="303">维度</text>  <text class="k" x="232.0" y="303">场景一 单宿主</text>  <text class="k" x="442.0" y="303">场景二 单路由器多宿</text>  <text class="k" x="652.0" y="303">场景三 多路由器多宿</text>  <rect x="24" y="310" width="852" height="26" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="328">链路</text>  <text class="x" x="232.0" y="328">—</text>  <text class="g" x="442.0" y="328">2</text>  <text class="g" x="652.0" y="328">2 x 2</text>  <line x1="24" y1="336" x2="876" y2="336" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="336" width="852" height="26" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="354">设备</text>  <text class="x" x="232.0" y="354">—</text>  <text class="x" x="442.0" y="354">1 台（单点）</text>  <text class="g" x="652.0" y="354">2 台</text>  <line x1="24" y1="362" x2="876" y2="362" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="362" width="852" height="26" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="380">运营商</text>  <text class="x" x="232.0" y="380">1</text>  <text class="g" x="442.0" y="380">2</text>  <text class="g" x="652.0" y="380">2</text>  <line x1="24" y1="388" x2="876" y2="388" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="388" width="852" height="26" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="406">地址</text>  <text class="c" x="232.0" y="406">PA</text>  <text class="c" x="442.0" y="406">每 ISP PA</text>  <text class="c" x="652.0" y="406">PI /24</text>  <line x1="24" y1="414" x2="876" y2="414" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="414" width="852" height="26" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="432">状态风险</text>  <text class="g" x="232.0" y="432">无</text>  <text class="x" x="442.0" y="432">池切换丢会话</text>  <text class="x" x="652.0" y="432">非对称 + 会话同步</text>  <line x1="24" y1="440" x2="876" y2="440" stroke="#eef2f8" stroke-width=".7"/>  <line x1="24" y1="452" x2="876" y2="452" stroke="#dfe6f1" stroke-width=".8"/>  <text class="w" x="24" y="472">Each step up buys one more survivor and one more state problem. Scenario three is not “more redundant”, it is “redundant but asymmetric” -</text>  <text class="w" x="24" y="486">the design must include iBGP across the firewall, an independent NAT pool per exit, and a documented rule for what happens to live sessions.</text>
</svg>
