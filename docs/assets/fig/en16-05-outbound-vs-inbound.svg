<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Outbound load sharing decided in your own RIB set against inbound traffic engineering that only influences someone else's RIB</title>
  <desc id="d15">Left panel, outbound: internal prefixes and two exits, 600 megabits per second at ISP A and 400 at ISP B, are steered by local preference of 200 and 100, which is decided in your own routing table and takes effect in seconds with a rollback path; the cost is pushing traffic onto the worse exit, so measurement must come first. Right panel, inbound: your AS announces a /24 to two providers who pass it into the rest of the internet, and the decision is made in tables you do not operate, taking minutes to hours; five influence mechanisms are ranked from weakest to strongest - MED, AS-path prepending, communities, a /24 with provider-independent space, and active-standby announcement. A footer lists the condition that makes each mechanism work and advises using verifiable strong mechanisms rather than weak ones that depend on the other side's cooperation.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="452" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Outbound is your routing table. Inbound is someone else's.</text>  <text class="s" x="24" y="45">You can weight, prepend and tag your own announcements - but the decision is made in a router you do not operate.</text>  <rect x="24" y="74" width="414" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="36" y="92">OUTBOUND: YOU DECIDE</text>  <text class="b" x="36" y="110">在自己的 RIB 里选，立即生效</text>  <rect x="40" y="124" width="150" height="54" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="b" x="52" y="141">内网前缀</text>  <text class="c" x="52" y="153">10.1.0.0/16</text>  <text class="c" x="52" y="165">静态 / IGP</text>  <rect x="40" y="196" width="150" height="54" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="52" y="213">两条出口</text>  <text class="c" x="52" y="225">ISP-A 600 Mbps</text>  <text class="c" x="52" y="237">ISP-B 400 Mbps</text>  <rect x="232" y="158" width="190" height="60" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="244" y="175">local-preference</text>  <text class="c" x="244" y="187">A = 200, B = 100</text>  <text class="c" x="244" y="199">比的是“更适合”</text>  <line x1="190" y1="151" x2="232" y2="178" stroke="#29a08f" stroke-width="1" marker-end="url(#at)"/>  <line x1="190" y1="223" x2="232" y2="200" stroke="#29a08f" stroke-width="1" marker-end="url(#at)"/>  <text class="w" x="40" y="268">出向可控点：LP、静态路由权重、策略路由、出口带宽比例</text>  <text class="g" x="40" y="284">只需改自己，秒级生效，可回滚</text>  <text class="w" x="40" y="306">代价：可能把流量压到更差的出口 - 所以要先有测量</text>  <rect x="462" y="74" width="414" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="474" y="92">INBOUND: YOU INFLUENCE</text>  <text class="b" x="474" y="110">在别人的 RIB 里被选，分钟到小时</text>  <rect x="478" y="124" width="120" height="44" rx="3" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <text class="b" x="490" y="141">你的 AS</text>  <text class="c" x="490" y="153">宣告 /24</text>  <rect x="626" y="124" width="120" height="44" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="638" y="141">ISP-A</text>  <text class="c" x="638" y="153">AS 64500</text>  <rect x="626" y="176" width="120" height="44" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="638" y="193">ISP-B</text>  <text class="c" x="638" y="205">AS 64501</text>  <rect x="770" y="124" width="92" height="96" rx="3" fill="#fbfcfe" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="782" y="141">其余
互联网</text>  <text class="c" x="782" y="153">别人的 RIB</text>  <line x1="598" y1="146" x2="626" y2="146" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <line x1="598" y1="156" x2="626" y2="190" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <line x1="746" y1="146" x2="770" y2="160" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <line x1="746" y1="198" x2="770" y2="184" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <text class="w" x="478" y="240">你说“请走 A”，A 听不听取决于它对等体策略与商业关系</text>  <text class="k" x="478" y="262">INFLUENCE STRENGTH, WEAKEST TO STRONGEST</text>  <rect x="478" y="268" width="54" height="16" rx="8.0" fill="#fdf6f4" stroke="#f0d5cf" stroke-width=".7"/>  <text class="x" x="505.0" y="279" text-anchor="middle">MED</text>  <rect x="538" y="268" width="66" height="16" rx="8.0" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".7"/>  <text class="x" x="571.0" y="279" text-anchor="middle">prepend</text>  <rect x="610" y="268" width="76" height="16" rx="8.0" fill="#f2f6fd" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="648.0" y="279" text-anchor="middle">community</text>  <rect x="692" y="268" width="74" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="729.0" y="279" text-anchor="middle">/24 + PA</text>  <rect x="772" y="268" width="90" height="16" rx="8.0" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".7"/>  <text class="g" x="817.0" y="279" text-anchor="middle">active/standby</text>  <text class="b" x="24" y="344">Six inbound mechanisms, and the single condition that decides whether each one works</text>  <text class="w" x="24" y="362">AS-path prepend 只在对方比较长度时有效；MED 只在同一邻居 AS 内部比较；community 需要对方愿意按约定执行；</text>  <text class="w" x="24" y="376">更长掩码（/24 vs /25）几乎总赢；主备靠“主动不宣告”而非“宣告了但选不上”；上游清洗需要合同与路由策略配合。</text>  <text class="g" x="24" y="400">设计原则：入向用“可验证的强手段”（主备宣告、PI /24），不要用“需要对方配合的弱手段”作为唯一手段。</text>  <line x1="24" y1="414" x2="876" y2="414" stroke="#dfe6f1" stroke-width=".8"/>  <text class="x" x="24" y="434">The recurring failure: engineers tune LP for outbound, then expect the same knob to fix inbound congestion. They are different tables.</text>
</svg>
