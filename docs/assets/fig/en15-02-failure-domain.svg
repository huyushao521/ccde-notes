<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The failure-domain ladder from one port to the whole campus, and the tool that shrinks each step</title>
  <desc id="d15">Five bands of growing blast radius with the containment tool on the right. One port affects one host and is contained by port-fast, BPDU guard, storm control and a PoE budget. One VLAN affects every host in the broadcast domain and is contained by one subnet per closet with a 250 host ceiling. One IDF affects every access switch on the same distribution pair and is contained by routed access or a dedicated first-hop pair. One functional block is contained by separate blocks, VRFs and summarisation at the block edge. The whole campus is contained by IGP areas, BGP at the edge and a redundant core whose failover has been tested. A footer notes that clustering and vPC deliberately merge two devices' failures into one event.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="472" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Every campus design action adjusts one number: the blast radius</text>  <text class="s" x="24" y="45">The first question is never which protocol, it is how far the damage travels before something stops it.</text>  <rect x="24" y="92" width="852" height="58" rx="3" fill="#f4f8ff" stroke="#eef2f8" stroke-width=".8"/>  <text class="b" x="36" y="114">One port</text>  <text class="w" x="36" y="130">blast radius</text>  <rect x="148" y="105" width="74" height="32" rx="2" fill="#4a7ee0" stroke="none" opacity=".16"/>  <rect x="148" y="105" width="2.4" height="32" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="c" x="158" y="126">one host, one cable, one PoE port</text>  <text class="c" x="700" y="119">port-fast, BPDU guard, storm control,</text>  <text class="c" x="700" y="132">PoE budget per port</text>  <rect x="24" y="158" width="852" height="58" rx="3" fill="#f4fbf9" stroke="#eef2f8" stroke-width=".8"/>  <text class="b" x="36" y="180">One VLAN / subnet</text>  <text class="w" x="36" y="196">blast radius</text>  <rect x="148" y="171" width="168" height="32" rx="2" fill="#29a08f" stroke="none" opacity=".16"/>  <rect x="148" y="171" width="2.4" height="32" rx="1" fill="#29a08f" stroke="none"/>  <text class="c" x="158" y="192">every host in the broadcast domain: ARP, flooding and the gateway share th</text>  <text class="c" x="700" y="185">one subnet per closet, &lt;= 250 hosts,</text>  <text class="c" x="700" y="198">DHCP scope +20%</text>  <rect x="24" y="224" width="852" height="58" rx="3" fill="#fdf8ee" stroke="#eef2f8" stroke-width=".8"/>  <text class="b" x="36" y="246">One IDF / closet</text>  <text class="w" x="36" y="262">blast radius</text>  <rect x="148" y="237" width="262" height="32" rx="2" fill="#d99b2b" stroke="none" opacity=".16"/>  <rect x="148" y="237" width="2.4" height="32" rx="1" fill="#d99b2b" stroke="none"/>  <text class="c" x="158" y="258">all access switches on the same distribution pair</text>  <text class="c" x="700" y="251">routed access, or a dedicated</text>  <text class="c" x="700" y="264">first-hop pair per block</text>  <rect x="24" y="290" width="852" height="58" rx="3" fill="#f8f5fe" stroke="#eef2f8" stroke-width=".8"/>  <text class="b" x="36" y="312">One functional block</text>  <text class="w" x="36" y="328">blast radius</text>  <rect x="148" y="303" width="366" height="32" rx="2" fill="#8b6bd0" stroke="none" opacity=".16"/>  <rect x="148" y="303" width="2.4" height="32" rx="1" fill="#8b6bd0" stroke="none"/>  <text class="c" x="158" y="324">user, voice, wireless and OT share one policy boundary</text>  <text class="c" x="700" y="317">separate blocks + VRFs,</text>  <text class="c" x="700" y="330">summarise at the block edge</text>  <rect x="24" y="356" width="852" height="58" rx="3" fill="#fdf0ee" stroke="#eef2f8" stroke-width=".8"/>  <text class="b" x="36" y="378">The whole campus</text>  <text class="w" x="36" y="394">blast radius</text>  <rect x="148" y="369" width="470" height="32" rx="2" fill="#d0564a" stroke="none" opacity=".16"/>  <rect x="148" y="369" width="2.4" height="32" rx="1" fill="#d0564a" stroke="none"/>  <text class="c" x="158" y="390">one STP domain, one IGP area, one core failure reaches everyone</text>  <text class="c" x="700" y="383">IGP areas, BGP at the edge,</text>  <text class="c" x="700" y="396">redundant core, tested failover</text>  <text class="w" x="24" y="442">Design actions move the boundary: splitting blocks, summarising routes, redrawing the L2/L3 edge, FHRP, clustering.</text>  <text class="x" x="24" y="456">Clustering and vPC move it the wrong way on purpose: two devices' failures become one event.</text>
</svg>
