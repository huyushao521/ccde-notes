<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Four site tiers with their standard kits, the redundancy each covers and the effect of tiering on operations</title>
  <desc id="d15">Four tier columns each carry a standard kit. L1 is a single circuit with a static or default route, a single CPE and optional cellular backup, appropriate for small non-critical branches and covering no redundancy at all. L2 is dual link on a single CPE with static plus IP SLA or eBGP and tunnels, which covers a link failure but not the box. L3 is dual link with dual CPE, two carriers or two transports, eBGP with an interior protocol and DMVPN or SD-WAN, covering the box but not the duct. L4 is a regional WAN core with multiple transports, hierarchical BGP, N minus one capacity and cloud on-ramps. A table contrasts per-site design with a tiered kit: four templates instead of eighty designs, four written acceptance tests, one spare per tier, and a defined trigger for moving up a tier such as relocation, merger or doubled bandwidth. The caveat is that a tier is a promise about what the site survives, and that sentence should be written for each tier.</desc>
