<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Every layer 2 trap and the layer 3 twin it becomes when the boundary moves to the access layer</title>
  <desc id="d15">A three column table of eight rows. Layer 2 traps: flooding and broadcast storms become unknown unicast to the default gateway, answered by one subnet per closet and storm control. ARP storms and full ARP tables become ND or ARP exhaustion on the gateway SVI, answered by ARP limits and a 250 host ceiling. A full MAC table becomes FIB, TCAM and adjacency scale, answered by summarisation and a RIB budget. A blocked STP link becomes an asymmetric path and a suboptimal prefix, answered by metric intent, ECMP and area design. STP convergence becomes IGP query scope or area convergence, answered by EIGRP stub, summarisation and BFD. FHRP timer tuning becomes BFD failover, so BFD is what must be tuned and tested. The seven hop STP diameter becomes hop count and summarisation depth. VLAN sprawl becomes VRF and subnet sprawl with route leaking. A footer gives the test: pull a link and watch the same business flow that broke last time.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="424" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Routed access does not remove the traps, it changes their wardrobe</text>  <text class="s" x="24" y="45">Every layer 2 failure mode has a layer 3 twin. Migrating without designing the twin just relocates the outage.</text>  <rect x="24" y="86" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="101">Layer 2 trap</text>  <text class="k" x="275.42857142857144" y="101">Its layer 3 twin</text>  <text class="k" x="579.7142857142858" y="101">What to design instead</text>  <rect x="24" y="108" width="852" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="132">Flooding / broadcast storm</text>  <text class="c" x="275.42857142857144" y="132">unknown unicast to the default gateway</text>  <text class="g" x="579.7142857142858" y="132">one subnet per closet, storm control</text>  <line x1="24" y1="140" x2="876" y2="140" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="140" width="852" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="164">ARP storm, ARP table full</text>  <text class="c" x="275.42857142857144" y="164">ND/ARP exhaustion on the gateway SVI</text>  <text class="g" x="579.7142857142858" y="164">ARP limits, &lt;= 250 hosts per VLAN</text>  <line x1="24" y1="172" x2="876" y2="172" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="172" width="852" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="196">MAC table exhausted</text>  <text class="c" x="275.42857142857144" y="196">FIB / TCAM and adjacency scale</text>  <text class="g" x="579.7142857142858" y="196">summarise, budget the RIB</text>  <line x1="24" y1="204" x2="876" y2="204" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="204" width="852" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="228">Blocked STP link</text>  <text class="c" x="275.42857142857144" y="228">asymmetric path, suboptimal prefix</text>  <text class="g" x="579.7142857142858" y="228">metric intent, ECMP, area design</text>  <line x1="24" y1="236" x2="876" y2="236" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="236" width="852" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="260">STP convergence</text>  <text class="c" x="275.42857142857144" y="260">IGP query scope or area convergence</text>  <text class="g" x="579.7142857142858" y="260">EIGRP stub, summarisation, BFD</text>  <line x1="24" y1="268" x2="876" y2="268" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="268" width="852" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="292">FHRP timer tuning</text>  <text class="c" x="275.42857142857144" y="292">BFD failover, no gateway switchover left</text>  <text class="g" x="579.7142857142858" y="292">tune BFD, test the failover</text>  <line x1="24" y1="300" x2="876" y2="300" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="300" width="852" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="324">STP diameter &lt;= 7 hops</text>  <text class="c" x="275.42857142857144" y="324">hop count and summarisation depth</text>  <text class="g" x="579.7142857142858" y="324">hierarchy, area boundaries</text>  <line x1="24" y1="332" x2="876" y2="332" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="332" width="852" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="356">VLAN sprawl</text>  <text class="c" x="275.42857142857144" y="356">VRF and subnet sprawl, route leaking</text>  <text class="g" x="579.7142857142858" y="356">design the boundary, not the box</text>  <line x1="24" y1="364" x2="876" y2="364" stroke="#eef2f8" stroke-width=".7"/>  <text class="b" x="24" y="372">The test that tells you whether the migration is real</text>  <text class="w" x="24" y="390">Pull a link and watch the same business flow that broke last time. If the old symptom is gone but a new one appeared</text>  <text class="w" x="24" y="404">one second later, you moved the boundary instead of removing it - the interfaces, not the protocols, are what users meet.</text>
</svg>
