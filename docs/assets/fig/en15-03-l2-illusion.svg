<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Nine lines of layer 2 configuration and the eight pieces of state they create, each failing on its own schedule</title>
  <desc id="d15">A dark configuration panel on the left lists nine typical commands: rapid PVST, three VLANs, access ports, a port-channel, an SVI with an address and an HSRP group. An arrow labelled nine lines creates seven states points at eight white cards: the MAC table with sixteen thousand entries and 300 second aging, the ARP or ND table with eight thousand entries, flooding scope inside the whole VLAN, one STP topology per VLAN, FHRP active and standby state with three second hellos, trunk pruning whose mismatch becomes a silent black hole, storm behaviour with no ceiling, and the alignment between the STP root and the FHRP active. A red band explains that one design change touches all eight, and that a mismatch between root and active sends every client's traffic across the inter-switch link in both directions.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="412" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">"Simple to configure" and "simple to operate" are different claims</text>  <text class="s" x="24" y="45">The switch accepts nine lines. Those nine lines create seven pieces of state that fail independently.</text>  <rect x="24" y="92" width="318" height="246" rx="3" fill="#0f1726" stroke="#0f1726" stroke-width=".8"/>  <text class="k" x="36" y="110" fill="#7f93b5">WHAT YOU TYPED</text>  <text class="m" x="36" y="132" fill="#9fe3c8">spanning-tree mode rapid-pvst</text>  <text class="m" x="36" y="149" fill="#9fe3c8">vlan 10,20,30</text>  <text class="m" x="36" y="166" fill="#9fe3c8">interface range Gi1/0/1-24</text>  <text class="m" x="36" y="183" fill="#9fe3c8">  switchport mode access</text>  <text class="m" x="36" y="200" fill="#9fe3c8">  switchport access vlan 10</text>  <text class="m" x="36" y="217" fill="#9fe3c8">channel-group 1 mode active</text>  <text class="m" x="36" y="234" fill="#9fe3c8">interface Vlan10</text>  <text class="m" x="36" y="251" fill="#9fe3c8">  ip address 10.1.10.1/24</text>  <text class="m" x="36" y="268" fill="#9fe3c8">  standby 10 ip 10.1.10.254</text>  <text class="w" x="36" y="320" fill="#7f93b5">9 lines / 1 config file / 1 change ticket</text>  <line x1="348" y1="215" x2="404" y2="215" stroke="#4a7ee0" stroke-width="1.4" marker-end="url(#ab)"/>  <text class="w" x="350" y="200">creates</text>  <text class="w" x="350" y="238">7 states</text>  <rect x="416" y="92" width="224" height="60" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="428" y="111">MAC table</text>  <rect x="566" y="99" width="64" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="598.0" y="110" text-anchor="middle">16K entries</text>  <text class="w" x="428" y="128">aging 300 s, per-VLAN learning</text>  <text class="w" x="428" y="142">fails on its own schedule</text>  <rect x="648" y="92" width="224" height="60" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="660" y="111">ARP / ND table</text>  <rect x="798" y="99" width="64" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="830.0" y="110" text-anchor="middle">8K entries</text>  <text class="w" x="660" y="128">the real gateway resource</text>  <text class="w" x="660" y="142">fails on its own schedule</text>  <rect x="416" y="160" width="224" height="60" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="428" y="179">Flooding scope</text>  <rect x="566" y="167" width="64" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="598.0" y="178" text-anchor="middle">whole VLAN</text>  <text class="w" x="428" y="196">broadcast + unknown unicast</text>  <text class="w" x="428" y="210">fails on its own schedule</text>  <rect x="648" y="160" width="224" height="60" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="660" y="179">STP topology</text>  <rect x="798" y="167" width="64" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="830.0" y="178" text-anchor="middle">1 per VLAN</text>  <text class="w" x="660" y="196">root, port roles, timers</text>  <text class="w" x="660" y="210">fails on its own schedule</text>  <rect x="416" y="228" width="224" height="60" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="428" y="247">FHRP state</text>  <rect x="566" y="235" width="64" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="598.0" y="246" text-anchor="middle">active/standby</text>  <text class="w" x="428" y="264">hello 3 s, hold 10 s</text>  <text class="w" x="428" y="278">fails on its own schedule</text>  <rect x="648" y="228" width="224" height="60" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="660" y="247">Trunk pruning</text>  <rect x="798" y="235" width="64" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="830.0" y="246" text-anchor="middle">allowed list</text>  <text class="w" x="660" y="264">mismatch = silent black hole</text>  <text class="w" x="660" y="278">fails on its own schedule</text>  <rect x="416" y="296" width="224" height="60" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="428" y="315">Storm behaviour</text>  <rect x="566" y="303" width="64" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="598.0" y="314" text-anchor="middle">no ceiling</text>  <text class="w" x="428" y="332">one loop eats the closet</text>  <text class="w" x="428" y="346">fails on its own schedule</text>  <rect x="648" y="296" width="224" height="60" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="660" y="315">Alignment</text>  <rect x="798" y="303" width="64" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="830.0" y="314" text-anchor="middle">root vs active</text>  <text class="w" x="660" y="332">the two must be the same box</text>  <text class="w" x="660" y="346">fails on its own schedule</text>  <rect x="24" y="352" width="852" height="44" rx="3" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".8"/>  <text class="b" x="36" y="370">One design change touches all eight - that is the coupling nobody puts in the change record</text>  <text class="w" x="36" y="386">And if the FHRP active and the STP root are not the same switch, the inter-switch link carries every client's traffic both ways.</text>
</svg>
