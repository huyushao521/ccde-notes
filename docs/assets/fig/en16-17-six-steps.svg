    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="506" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">The six-step internet edge method: business and trust before equipment</text>  <text class="s" x="24" y="45">1 exit services, 2 trust levels, 3 homing model, 4 announcements, 5 state devices, 6 resilience - each step fixes the next step's input.</text>  <rect x="34" y="86" width="132" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="34" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="44" y="103" font-size="11">1</text>  <text class="b" x="60" y="103">EXIT SERVICES</text>  <text class="k" x="44" y="128">INPUT</text>  <text class="w" x="44" y="142">application inventory,</text>  <text class="w" x="44" y="153">SaaS usage, published</text>  <text class="w" x="44" y="164">services, remote ratio</text>  <text class="k" x="44" y="190">OUTPUT</text>  <text class="w" x="44" y="204">exit bandwidth, inbound</text>  <text class="w" x="44" y="215">prefixes, remote-access</text>  <text class="w" x="44" y="226">concurrency</text>  <rect x="42" y="246" width="116" height="82" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="48" y="260">THE HURDLE</text>  <text class="c" x="48" y="274">which services must break o</text>  <text class="c" x="48" y="286">ut locally</text>  <text class="c" x="48" y="298"></text>  <line x1="167" y1="200" x2="175" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="176" y="86" width="132" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="176" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="186" y="103" font-size="11">2</text>  <text class="b" x="202" y="103">TRUST LEVELS</text>  <text class="k" x="186" y="128">INPUT</text>  <text class="w" x="186" y="142">data classification,</text>  <text class="w" x="186" y="153">compliance, audit</text>  <text class="w" x="186" y="164">requirements</text>  <text class="k" x="186" y="190">OUTPUT</text>  <text class="w" x="186" y="204">trust zones + policy</text>  <text class="w" x="186" y="215">matrix with allow / deny</text>  <text class="w" x="186" y="226">/ log per boundary</text>  <rect x="184" y="246" width="116" height="82" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="190" y="260">THE HURDLE</text>  <text class="c" x="190" y="274">what the DMZ can reach insi</text>  <text class="c" x="190" y="286">de</text>  <text class="c" x="190" y="298"></text>  <line x1="309" y1="200" x2="317" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="318" y="86" width="132" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="318" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="328" y="103" font-size="11">3</text>  <text class="b" x="344" y="103">HOMING MODEL</text>  <text class="k" x="328" y="128">INPUT</text>  <text class="w" x="328" y="142">availability target,</text>  <text class="w" x="328" y="153">budget, address assets</text>  <text class="w" x="328" y="164">owned</text>  <text class="k" x="328" y="190">OUTPUT</text>  <text class="w" x="328" y="204">single or multihomed +</text>  <text class="w" x="328" y="215">ISP count + PA/PI +</text>  <text class="w" x="328" y="226">AS number plan</text>  <rect x="326" y="246" width="116" height="82" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="332" y="260">THE HURDLE</text>  <text class="c" x="332" y="274">are the physical paths real</text>  <text class="c" x="332" y="286">ly separate</text>  <text class="c" x="332" y="298"></text>  <line x1="451" y1="200" x2="459" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="460" y="86" width="132" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="460" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="470" y="103" font-size="11">4</text>  <text class="b" x="486" y="103">ANNOUNCEMENTS</text>  <text class="k" x="470" y="128">INPUT</text>  <text class="w" x="470" y="142">prefix list, provider</text>  <text class="w" x="470" y="153">policies, SLAs</text>  <text class="k" x="470" y="190">OUTPUT</text>  <text class="w" x="470" y="204">BGP baseline + attribute</text>  <text class="w" x="470" y="215">policy + filtering</text>  <text class="w" x="470" y="226">and RPKI</text>  <rect x="468" y="246" width="116" height="82" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="474" y="260">THE HURDLE</text>  <text class="c" x="474" y="274">inbound can only be influen</text>  <text class="c" x="474" y="286">ced - is fallback enough</text>  <text class="c" x="474" y="298"></text>  <line x1="593" y1="200" x2="601" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="602" y="86" width="132" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="602" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="612" y="103" font-size="11">5</text>  <text class="b" x="628" y="103">STATE DEVICES</text>  <text class="k" x="612" y="128">INPUT</text>  <text class="w" x="612" y="142">session scale, NAT</text>  <text class="w" x="612" y="153">port demand, VPN</text>  <text class="w" x="612" y="164">concurrency</text>  <text class="k" x="612" y="190">OUTPUT</text>  <text class="w" x="612" y="204">form factor + state sync</text>  <text class="w" x="612" y="215">plan + session rebuild</text>  <text class="w" x="612" y="226">policy</text>  <rect x="610" y="246" width="116" height="82" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="616" y="260">THE HURDLE</text>  <text class="c" x="616" y="274">how sessions survive a fail</text>  <text class="c" x="616" y="286">ure</text>  <text class="c" x="616" y="298"></text>  <line x1="735" y1="200" x2="743" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="744" y="86" width="132" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="744" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="754" y="103" font-size="11">6</text>  <text class="b" x="770" y="103">RESILIENCE</text>  <text class="k" x="754" y="128">INPUT</text>  <text class="w" x="754" y="142">failure models,</text>  <text class="w" x="754" y="153">attack models</text>  <text class="k" x="754" y="190">OUTPUT</text>  <text class="w" x="754" y="204">detection + switchover +</text>  <text class="w" x="754" y="215">diversion plan +</text>  <text class="w" x="754" y="226">acceptance cases</text>  <rect x="752" y="246" width="116" height="82" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="758" y="260">THE HURDLE</text>  <text class="c" x="758" y="274">how link-up-path-broken get</text>  <text class="c" x="758" y="286">s detected</text>  <text class="c" x="758" y="298"></text>  <text class="b" x="24" y="360">The short-cuts and where they land (usually in the first real incident)</text>  <rect x="24" y="370" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="385">Short-cut</text>  <text class="k" x="352.0" y="385">Consequence</text>  <rect x="24" y="392" width="852" height="24" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="408">Buy two firewalls, then think about homing</text>  <text class="c" x="352.0" y="408">two stacks of equipment, one single-homed exit</text>  <line x1="24" y1="416" x2="876" y2="416" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="416" width="852" height="24" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="432">Pick BGP before knowing which services break out</text>  <text class="c" x="352.0" y="432">every exit carries everything, no local breakout</text>  <line x1="24" y1="440" x2="876" y2="440" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="440" width="852" height="24" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="456">Publish services before the DMZ reach-list exists</text>  <text class="c" x="352.0" y="456">one compromise reaches the server farm</text>  <line x1="24" y1="464" x2="876" y2="464" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="464" width="852" height="24" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="480">Skip step 6, go live</text>  <text class="c" x="352.0" y="480">no detection, no diversion, N-1 never measured</text>  <line x1="24" y1="488" x2="876" y2="488" stroke="#eef2f8" stroke-width=".7"/>  <text class="x" x="24" y="488">The order cannot be reversed: business and trust boundaries determine the form; the form determines the equipment.</text>
</svg>
