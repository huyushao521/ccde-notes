<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The six-step internet edge design method with the input, deliverable and unresolved hurdle of every step</title>
  <desc id="d15">Six numbered columns. Exit services: input is the application inventory, SaaS usage, published services and remote-work ratio; output is exit bandwidth, inbound prefixes and remote-access concurrency; the hurdle is deciding which services must break out locally, which decides local internet breakout against a centralised exit. Trust levels: output is trust zones and a policy matrix with allow, deny and log per boundary; the hurdle is what the DMZ can reach inside. Homing model: output is single or multihomed, ISP count, provider-independent or aggregatable addresses and an AS number plan; the hurdle is whether the physical paths are really separate. Announcements: output is the BGP baseline, attribute policy, filtering and RPKI; the hurdle is that inbound can only be influenced, so fallback capacity must be enough. State devices: output is the form factor, state synchronisation plan and session rebuild policy; the hurdle is how NAT and firewall sessions survive a failure. Resilience: output is detection, switchover, diversion and acceptance cases; the hurdle is how a link that is up but a path that is broken gets detected. A table lists four short-cuts and their consequences.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
