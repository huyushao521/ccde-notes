<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Four DDoS defence layers ordered by distance from the attack, the remote-triggered black hole flow and attack types mapped to where they stop</title>
  <desc id="d15">Four layers ordered from the attack outward: upstream or provider scrubbing, remote-triggered black hole and traffic scrubbing as the only place that can absorb large volumes; the edge with ACLs, rate limiting, connection limits and unicast reverse path forwarding for known signatures and reflection; stateful devices with session ceilings, per-IP concurrency and half-open limits to stop state exhaustion, which usually arrives before bandwidth exhaustion; and the application and architecture with CDN, elastic scaling and degradation switches so the attack becomes a cost problem. A five-step remote-triggered black hole flow runs from detection through injection to a Null0 host route, announcement with community 65535:666, upstream discard and a documented withdrawal with timeout, noting that it needs an upstream that has configured the community and a rehearsed trigger. A table maps volumetric, protocol, application-layer and state-exhaustion attacks to the layer that actually stops them.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="490" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">DDoS defence is layered by position, and the first layer is not in your building</text>  <text class="s" x="24" y="45">A 40 Gbps attack makes every local control irrelevant: the link is full before the firewall sees the first packet.</text>  <text class="k" x="24" y="76">FOUR LAYERS, ORDERED BY DISTANCE FROM THE ATTACK</text>  <rect x="24" y="88" width="200" height="106" rx="3" fill="#f8f5fe" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="88" width="200" height="2.6" rx="3" fill="#8b6bd0" stroke="none"/>  <text class="b" x="36" y="108">L1 上游 / 运营商</text>  <text class="c" x="36" y="126">清洗中心、RTBH、流量 scrubbing</text>  <text class="c" x="36" y="140"></text>  <text class="k" x="36" y="162">WHY HERE</text>  <text class="w" x="36" y="174">唯一能吸收大流量的位置</text>  <text class="w" x="36" y="186"></text>  <rect x="240" y="88" width="200" height="106" rx="3" fill="#fdf8ee" stroke="#eef2f8" stroke-width=".8"/>  <rect x="240" y="88" width="200" height="2.6" rx="3" fill="#d99b2b" stroke="none"/>  <text class="b" x="252" y="108">L2 边缘</text>  <text class="c" x="252" y="126">ACL、限速、连接数限制、uRPF</text>  <text class="c" x="252" y="140"></text>  <text class="k" x="252" y="162">WHY HERE</text>  <text class="w" x="252" y="174">挡住已知特征与反射放大</text>  <text class="w" x="252" y="186"></text>  <rect x="456" y="88" width="200" height="106" rx="3" fill="#f4f8ff" stroke="#eef2f8" stroke-width=".8"/>  <rect x="456" y="88" width="200" height="2.6" rx="3" fill="#4a7ee0" stroke="none"/>  <text class="b" x="468" y="108">L3 状态设备</text>  <text class="c" x="468" y="126">会话上限、每 IP 并发、半开连接</text>  <text class="c" x="468" y="140"></text>  <text class="k" x="468" y="162">WHY HERE</text>  <text class="w" x="468" y="174">防止状态耗尽（往往先于带宽耗尽）</text>  <text class="w" x="468" y="186"></text>  <rect x="672" y="88" width="200" height="106" rx="3" fill="#f3fbf9" stroke="#eef2f8" stroke-width=".8"/>  <rect x="672" y="88" width="200" height="2.6" rx="3" fill="#29a08f" stroke="none"/>  <text class="b" x="684" y="108">L4 应用与架构</text>  <text class="c" x="684" y="126">CDN、弹性伸缩、降级开关</text>  <text class="c" x="684" y="140"></text>  <text class="k" x="684" y="162">WHY HERE</text>  <text class="w" x="684" y="174">让攻击变成成本问题而非可用性问题</text>  <text class="w" x="684" y="186"></text>  <text class="k" x="24" y="214">THE ONLY LOCAL TOOL THAT SCALES: REMOTE-TRIGGERED BLACK HOLE</text>  <rect x="24" y="228" width="158" height="44" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="34" y="246">检测</text>  <text class="w" x="34" y="262">NetFlow / 阈值 / 探针</text>  <line x1="183" y1="250" x2="195" y2="250" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <rect x="196" y="228" width="158" height="44" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="206" y="246">注入</text>  <text class="w" x="206" y="262">host route → Null0</text>  <line x1="355" y1="250" x2="367" y2="250" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <rect x="368" y="228" width="158" height="44" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="378" y="246">通告</text>  <text class="w" x="378" y="262">community 65535:666</text>  <line x1="527" y1="250" x2="539" y2="250" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <rect x="540" y="228" width="158" height="44" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="550" y="246">上游</text>  <text class="w" x="550" y="262">丢弃该 /32 流量</text>  <line x1="699" y1="250" x2="711" y2="250" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <rect x="712" y="228" width="158" height="44" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="722" y="246">撤销</text>  <text class="w" x="722" y="262">预案 + 超时</text>  <text class="x" x="24" y="292">前提：上游愿意配置该 community 且你有权触发；不做演练的 RTBH 等于没有</text>  <text class="k" x="24" y="316">ATTACK TYPE → WHERE IT IS ACTUALLY STOPPED</text>  <rect x="24" y="326" width="852" height="20" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="339">攻击类型</text>  <text class="k" x="292.0" y="339">有效位置</text>  <text class="k" x="542.0" y="339">常见误判</text>  <rect x="24" y="346" width="852" height="24" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="362">带宽型 / 放大反射</text>  <text class="g" x="292.0" y="362">上游清洗或 RTBH</text>  <text class="x" x="542.0" y="362">本地设备无能为力</text>  <line x1="24" y1="370" x2="876" y2="370" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="370" width="852" height="24" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="386">协议型（SYN / 分片 / 畸形）</text>  <text class="g" x="292.0" y="386">边缘 ACL + 限速</text>  <text class="x" x="542.0" y="386">需要设备性能支撑</text>  <line x1="24" y1="394" x2="876" y2="394" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="394" width="852" height="24" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="410">应用层（CC / 慢速）</text>  <text class="g" x="292.0" y="410">WAF + 行为与速率策略</text>  <text class="x" x="542.0" y="410">边缘 ACL 看不见</text>  <line x1="24" y1="418" x2="876" y2="418" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="418" width="852" height="24" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="434">状态耗尽（连接表）</text>  <text class="g" x="292.0" y="434">会话上限 + 每 IP 配额</text>  <text class="x" x="542.0" y="434">要提前测出真实上限</text>  <line x1="24" y1="442" x2="876" y2="442" stroke="#eef2f8" stroke-width=".7"/>  <line x1="24" y1="452" x2="876" y2="452" stroke="#dfe6f1" stroke-width=".8"/>  <text class="w" x="24" y="472">Every layer needs a written threshold, an owner and a test. A DDoS plan that has never been triggered is a document, not a control.</text>
</svg>
