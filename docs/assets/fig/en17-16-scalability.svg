<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The five artefacts that change per site, four delivery models and the change-count formula behind WAN operating cost</title>
  <desc id="d15">Five artefacts change with every new site: device configuration, hub configuration, routing policy, QoS policy and monitoring. Multiplying them by sites and by changes per year turns into the debt formula - eighty sites, twelve changes a year and five artefacts is four thousand eight hundred manual actions, which is a team rather than a process. A table compares four delivery models: hand-built costs five changes per site with error rates that grow with headcount and one to two weeks to turn up; template plus zero-touch provisioning reduces it to one template and one site profile in hours but drifts without audit; a controller or SD-WAN reduces it to one policy reference and minutes, at the cost of a controller single point; zero-touch with GitOps gives one reviewed commit with minutes and auditability but must be tested like software. The test for design review is to add a site on paper and list every file touched: more than two means the design is not scalable.</desc>
