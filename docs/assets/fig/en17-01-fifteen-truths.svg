<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Fifteen claims about WAN design grouped into five families of failure</title>
  <desc id="d15">A three-by-five grid of fifteen numbered claims, colour-coded by family. Promise: the SLA covers PE to PE while the business feels end to end, and L2 versus L3 is decided by who owns routing. Failure model: the Internet has no queue and no alarm, overlay choice trades tunnel count against control-plane cost, DMVPN phase two plus summarisation kills direct spoke paths, and every tunnel pays MTU first and encrypted throughput second. Concentration: the hub is sized by N minus one and by encrypted throughput, floating static misses carrier-side faults for thirty to one hundred eighty minutes, and multicast across the WAN needs mVPN, tunnels or application distribution. Enforcement: Multi-VRF CE segments routes without encrypting, encryption pushed WAN optimisation to the edge, QoS must match the class the carrier sold, and dual carrier without physical diversity is a single point. Reach and scale: cloud moves the exit point to the application, and scalability counts how many places must change to add one site.</desc>
