<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Three acquired companies with different exit, address and service states, and the six-phase migration order with downtime per phase</title>
  <desc id="d15">A table describes three acquired companies: A has dual ISPs and its own AS with a provider-independent /24 and a website and mail in a DMZ, but ageing equipment and no BGP filtering; B has a single ISP and a private AS with provider-aggregatable /28 space and no public services, having changed carrier three times with five stale addresses left in DNS; C has a single ISP, no BGP, provider-aggregatable /29 space and no public services, with everyone working remotely through one old VPN box. A six-phase plan follows: month one surveys prefixes, AS numbers, DNS records, certificates, allow lists, VPN clients and monitoring with no downtime; months two to three take over DNS by moving domains to the group DNS with TTL pre-lowered to sixty seconds; months three to six build the new edge with dual ISPs, dual edge routers and HA firewalls reusing A's provider-independent /24; months six to eight cut over A with both old and new prefixes announced in parallel; months eight to eleven migrate B by retiring its private AS and BGP and letting the group edge do NAT; and from month eleven migrate C's remote access to the group service and retire the old VPN box.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="554" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Acquiring three companies: migration is an address and DNS problem before it is a routing problem</text>  <text class="s" x="24" y="45">Different states, three different answers. The order of the phases matters more than the target architecture.</text>  <rect x="24" y="76" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="91">公司</text>  <text class="k" x="92.0" y="91">出口</text>  <text class="k" x="272.0" y="91">地址</text>  <text class="k" x="382.0" y="91">对外服务</text>  <text class="k" x="592.0" y="91">现状问题</text>  <rect x="24" y="98" width="852" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="122">A</text>  <text class="c" x="92.0" y="122">双 ISP + 自有 AS</text>  <text class="g" x="272.0" y="122">PI /24</text>  <text class="c" x="382.0" y="122">官网 + 邮件（DMZ）</text>  <text class="x" x="592.0" y="122">设备老化，BGP 无过滤</text>  <line x1="24" y1="130" x2="876" y2="130" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="130" width="852" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="154">B</text>  <text class="c" x="92.0" y="154">单 ISP + 私有 AS</text>  <text class="c" x="272.0" y="154">PA /28</text>  <text class="c" x="382.0" y="154">无</text>  <text class="x" x="592.0" y="154">换过 3 次运营商，DNS 留 5 个历史地址</text>  <line x1="24" y1="162" x2="876" y2="162" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="162" width="852" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="186">C</text>  <text class="c" x="92.0" y="186">单 ISP，无 BGP</text>  <text class="c" x="272.0" y="186">PA /29</text>  <text class="c" x="382.0" y="186">无</text>  <text class="x" x="592.0" y="186">全员远程依赖一台老 VPN 盒</text>  <line x1="24" y1="194" x2="876" y2="194" stroke="#eef2f8" stroke-width=".7"/>  <text class="k" x="24" y="216">THE PHASE ORDER THAT ACTUALLY WORKS</text>  <rect x="24" y="226" width="852" height="36" rx="3" fill="#f7f9fc" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="226" width="3" height="36" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="34" y="241" font-size="11">0</text>  <text class="b" x="56" y="241">Survey</text>  <text class="w" x="56" y="255">M1</text>  <text class="c" x="126" y="248">清点前缀、AS、DNS 记录、证书、白名单、VPN 客户端、监控</text>  <text class="g" x="800" y="248">停机 0</text>  <rect x="24" y="266" width="852" height="36" rx="3" fill="#ffffff" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="266" width="3" height="36" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="34" y="281" font-size="11">1</text>  <text class="b" x="56" y="281">Take over DNS</text>  <text class="w" x="56" y="295">M2-3</text>  <text class="c" x="126" y="288">域名迁到集团 DNS，TTL 提前降到 60 s</text>  <text class="g" x="800" y="288">停机 0</text>  <rect x="24" y="306" width="852" height="36" rx="3" fill="#f7f9fc" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="306" width="3" height="36" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="34" y="321" font-size="11">2</text>  <text class="b" x="56" y="321">Build new edge</text>  <text class="w" x="56" y="335">M3-6</text>  <text class="c" x="126" y="328">集团侧双 ISP + 双边缘 + HA 防火墙，复用 A 的 PI /24</text>  <text class="g" x="800" y="328">停机 0</text>  <rect x="24" y="346" width="852" height="36" rx="3" fill="#ffffff" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="346" width="3" height="36" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="34" y="361" font-size="11">3</text>  <text class="b" x="56" y="361">Cut over A</text>  <text class="w" x="56" y="375">M6-8</text>  <text class="c" x="126" y="368">新旧前缀并行宣告，观察后再撤旧地址</text>  <text class="x" x="800" y="368">停机 分钟级</text>  <rect x="24" y="386" width="852" height="36" rx="3" fill="#f7f9fc" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="386" width="3" height="36" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="34" y="401" font-size="11">4</text>  <text class="b" x="56" y="401">Migrate B</text>  <text class="w" x="56" y="415">M8-11</text>  <text class="c" x="126" y="408">B 退掉私有 AS 与 BGP，NAT 交给集团边缘，清历史 DNS</text>  <text class="x" x="800" y="408">停机 分钟级</text>  <rect x="24" y="426" width="852" height="36" rx="3" fill="#ffffff" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="426" width="3" height="36" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="34" y="441" font-size="11">5</text>  <text class="b" x="56" y="441">C remote access</text>  <text class="w" x="56" y="455">M11-</text>  <text class="c" x="126" y="448">全员远程切到集团远程接入，下线老 VPN 盒</text>  <text class="g" x="800" y="448">停机 窗口内</text>  <line x1="24" y1="470" x2="876" y2="470" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="490">Three rules that make the order non-negotiable</text>  <text class="w" x="24" y="508">1. DNS 先接管。TTL 没降下来之前，任何地址变更都是几分钟到几小时的不可控停服（含证书重新签发的时间）。</text>  <text class="w" x="24" y="522">2. 新边缘先建好再切，且新旧前缀并行一段时间 - 因为入向是别人的路由表，撤得快等于自断回程。</text>  <text class="w" x="24" y="536">3. 私有 AS 与 PA 地址的站点最后动：它们不需要“迁移”，只需要退掉旧机制，让集团的边缘与 NAT 接手。</text>
</svg>
