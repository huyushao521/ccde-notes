<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="100%" role="img" aria-labelledby="t68 d68">

  <title id="t68">Why VPLS needs a full mesh of pseudowires, how many that is, and the split horizon rule that keeps it loop free</title>
  <desc id="d68">Left: four PEs connected by all six possible pseudowires, labelled as one virtual switch spread over geography. Right: the count formula n times n minus one over two, followed by the numbers for four, ten, twenty five and fifty PEs, and a box explaining split horizon, the rule that a PE never forwards a frame received from one pseudowire out another. A note at the bottom explains that a missing pseudowire between two PEs forces traffic through a third and creates a loop, which is why the mesh is mandatory or an explicit loop protection scheme is needed.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .ce{font:600 7px "Segoe UI",sans-serif;fill:#1f4fc0}
    .big{font:700 13px "Segoe UI",sans-serif;fill:#1f4fc0}
  </style>

  <rect x="0" y="0" width="900" height="392" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">VPLS is one switch spread over geography, so every PE must reach every other PE directly</text>
  <text class="s" x="24" y="45">The mesh is not a design preference &#8212; it is the only thing that makes one bridge domain work</text>

  <rect x="24" y="64" width="438" height="236" rx="3" fill="#f7fafd" stroke="#c3d5f2" stroke-width=".7"/>
  <text class="k" x="38" y="84">FOUR PEs &#183; ONE VSI EACH</text>
  <line x1="132" y1="150" x2="354" y2="150" stroke="#1f4fc0" stroke-width=".8"/>
  <line x1="132" y1="236" x2="354" y2="236" stroke="#1f4fc0" stroke-width=".8"/>
  <line x1="112" y1="170" x2="112" y2="216" stroke="#1f4fc0" stroke-width=".8"/>
  <line x1="374" y1="170" x2="374" y2="216" stroke="#1f4fc0" stroke-width=".8"/>
  <line x1="128" y1="164" x2="358" y2="222" stroke="#1f4fc0" stroke-width=".8"/>
  <line x1="358" y1="164" x2="128" y2="222" stroke="#1f4fc0" stroke-width=".8"/>
  <circle cx="112" cy="150" r="20" fill="#ffffff" stroke="#1f4fc0" stroke-width=".9"/>
  <text class="ce" x="112" y="153" text-anchor="middle">PE1</text>
  <circle cx="374" cy="150" r="20" fill="#ffffff" stroke="#1f4fc0" stroke-width=".9"/>
  <text class="ce" x="374" y="153" text-anchor="middle">PE2</text>
  <circle cx="112" cy="236" r="20" fill="#ffffff" stroke="#1f4fc0" stroke-width=".9"/>
  <text class="ce" x="112" y="239" text-anchor="middle">PE3</text>
  <circle cx="374" cy="236" r="20" fill="#ffffff" stroke="#1f4fc0" stroke-width=".9"/>
  <text class="ce" x="374" y="239" text-anchor="middle">PE4</text>
  <text class="k" x="243" y="128" text-anchor="middle">6 PSEUDOWIRES</text>
  <text class="k" x="243" y="258" text-anchor="middle">6 PSEUDOWIRES</text>
  <text class="c" x="38" y="282">Every PE runs the same MAC table, learns from every site,</text>
  <text class="c" x="38" y="294">and floods unknown traffic to all the others.</text>

  <rect x="478" y="64" width="398" height="52" rx="3" fill="#f4f8fe" stroke="#c3d5f2" stroke-width=".7"/>
  <text class="big" x="492" y="95">n (n &#8722; 1) / 2</text>
  <text class="c" x="620" y="84">pseudowires for</text>
  <text class="c" x="620" y="97">n participating PEs</text>
  <text class="w" x="620" y="110">quadratic, not linear</text>

  <text class="k" x="492" y="132">PES</text>
  <text class="k" x="600" y="132">PSEUDOWIRES</text>
  <text class="k" x="720" y="132">WHAT IT MEANS</text>
  <text class="c" x="492" y="150">4</text>
  <text class="c" x="600" y="150">6</text>
  <text class="w" x="720" y="150">a metro ring, fine</text>
  <text class="c" x="492" y="166">10</text>
  <text class="c" x="600" y="166">45</text>
  <text class="w" x="720" y="166">still manageable</text>
  <text class="c" x="492" y="182">25</text>
  <text class="c" x="600" y="182">300</text>
  <text class="w" x="720" y="182">configuration becomes work</text>
  <text class="c" x="492" y="198" fill="#c0392b">50</text>
  <text class="c" x="600" y="198" fill="#c0392b">1 225</text>
  <text class="w" x="720" y="198" fill="#c0392b">the structural ceiling</text>

  <rect x="478" y="214" width="398" height="86" rx="3" fill="#f5fdfa" stroke="#bfe3de" stroke-width=".7"/>
  <text class="b" x="492" y="234" fill="#0f7f73">Split horizon &#8212; the only loop protection there is</text>
  <text class="c" x="492" y="252">A PE never forwards a frame that arrived on one pseudowire</text>
  <text class="c" x="492" y="265">out of another pseudowire. Customer ports are the only</text>
  <text class="c" x="492" y="278">places where a frame may enter or leave the mesh.</text>
  <text class="w" x="492" y="293" fill="#c0392b">add an intermediate tier and this rule is no longer enough</text>

  <rect x="24" y="316" width="852" height="58" rx="3" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <rect x="24" y="316" width="4" height="58" fill="#c0392b"/>
  <text class="c" x="40" y="336" fill="#c0392b"><tspan style="font-weight:700">Remove one pseudowire and the design breaks.</tspan> With PE1&#8211;PE2 and PE2&#8211;PE3 but no PE1&#8211;PE3, a frame from CE1 to CE3 arrives at PE1 over the PE2 pseudowire.</text>
  <text class="c" x="40" y="352">Forwarding it onward to PE3 would create a loop; dropping it breaks the service. Split horizon is what allows the mesh to be loop free at all.</text>
  <text class="c" x="40" y="368">This is why H-VPLS must add hierarchy consciously &#8212; and why EVPN replaces the mesh with a control plane instead of more links.</text>
</svg>
