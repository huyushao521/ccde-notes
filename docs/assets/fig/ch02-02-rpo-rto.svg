<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" role="img" aria-labelledby="t2 d2">

  <title id="t2">RPO 与 RTO 在同一条时间轴上的位置</title>
  <desc id="d2">时间轴自左向右为上次备份点、故障发生、服务恢复、业务恢复。上次备份到故障之间为 RPO（可丢失数据量），故障到服务恢复之间为 RTO（可停机时长）。下方用同一个设计（RPO 15 分钟、RTO 20 分钟）对比 10 分钟中断与 120 分钟中断的判定结果。</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c3cfe0"/>
    </marker>
  </defs>
  <style>
    .ax{stroke:#c3cfe0;stroke-width:2;fill:none}
    .tk{stroke:#c3cfe0;stroke-width:1.4}
    .bl{font:600 13px "Segoe UI","Microsoft YaHei",sans-serif}
    .bs{font:11px "Segoe UI","Microsoft YaHei",sans-serif;fill:#6f8098}
    .sm{font:11px "Segoe UI","Microsoft YaHei",sans-serif;fill:#8a97a8}
    .brk{fill:none;stroke-width:1.6}
    .eb{font:700 11.5px "Segoe UI","Microsoft YaHei",sans-serif}
  </style>

  <rect x="0" y="0" width="900" height="470" fill="#fbfcfe"/>

  <!-- ============ 上：时间轴 ============ -->
  <rect x="20" y="20" width="860" height="272" rx="10" fill="#fff" stroke="#dbe4f0" stroke-width="1.2"/>

  <!-- 事件竖线 -->
  <line x1="180" y1="150" x2="180" y2="238" stroke="#12a594" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="340" y1="130" x2="340" y2="238" stroke="#d64545" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="660" y1="130" x2="660" y2="238" stroke="#2f6fed" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="820" y1="130" x2="820" y2="238" stroke="#8a97a8" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- 事件标签 -->
  <circle cx="180" cy="238" r="5" fill="#12a594" stroke="#fff" stroke-width="1.5"/>
  <text class="bl" x="186" y="146" fill="#0f7f73">上次备份点</text>
  <text class="bs" x="186" y="162">数据到这里为止是完整的</text>

  <circle cx="340" cy="238" r="5.5" fill="#d64545" stroke="#fff" stroke-width="1.5"/>
  <text class="bl" x="348" y="112" fill="#a32020">故障发生 T0</text>
  <text class="bs" x="348" y="128">这一刻起业务开始受影响</text>

  <circle cx="660" cy="238" r="5.5" fill="#2f6fed" stroke="#fff" stroke-width="1.5"/>
  <text class="bl" x="668" y="112" fill="#1f4fc0">服务恢复</text>
  <text class="bs" x="668" y="128">用户可重新访问应用</text>

  <circle cx="820" cy="238" r="5" fill="#8a97a8" stroke="#fff" stroke-width="1.5"/>
  <text class="bl" x="814" y="112" fill="#5b6b82" text-anchor="end">业务恢复至目标水平</text>
  <text class="bs" x="814" y="128" text-anchor="end">缓存重建、队列消化完毕</text>

  <!-- 时间轴 -->
  <line x1="60" y1="238" x2="846" y2="238" class="ax" marker-end="url(#a2)"/>
  <text class="sm" x="60" y="130">时间 →</text>

  <!-- RPO 括号 -->
  <path d="M180 196 V176 H340 V196" class="brk" stroke="#d98600"/>
  <text class="eb" x="260" y="170" text-anchor="middle" fill="#a86400">RPO　可丢多少数据</text>
  <text class="sm" x="260" y="262" text-anchor="middle">这段写入永久丢失（需回溯到备份点）</text>

  <!-- RTO 括号 -->
  <path d="M340 214 V194 H660 V214" class="brk" stroke="#2f6fed"/>
  <text class="eb" x="500" y="188" text-anchor="middle" fill="#1f4fc0">RTO　可停多久</text>
  <text class="sm" x="500" y="262" text-anchor="middle">这段时间业务不可用，收入按分钟流失</text>

  <!-- 说明 -->
  <text class="bs" x="40" y="40">RPO 往回看（数据损失），RTO 往前看（服务中断）；两者的起点都是故障发生的那一刻。</text>
  <text class="bs" x="40" y="282">RPO 由备份与复制策略决定，RTO 由冗余、收敛速度、演练水平决定——缩短 RTO 通常比缩短 RPO 贵得多。</text>

  <!-- ============ 下：判定对比 ============ -->
  <rect x="20" y="308" width="860" height="132" rx="10" fill="#fff" stroke="#dbe4f0" stroke-width="1.2"/>
  <text class="bl" x="40" y="332" fill="#4a5a72">同一个设计：RPO 15 分钟 / RTO 20 分钟，两种中断的判定</text>
  <text class="sm" x="860" y="332" text-anchor="end">横轴标尺 0–60 分钟</text>

  <!-- 轨道刻度线：20 min 目标 -->
  <g>
    <!-- 行 1 -->
    <text class="bs" x="40" y="368">中断 10 分钟</text>
    <rect x="150" y="356" width="180" height="16" rx="3" fill="#eef1f6" stroke="#dbe4f0" stroke-width="1"/>
    <rect x="150" y="356" width="30" height="16" rx="3" fill="#12a594"/>
    <line x1="210" y1="350" x2="210" y2="378" stroke="#d98600" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text class="sm" x="214" y="352" fill="#a86400">20 min 上限</text>
    <text class="eb" x="348" y="369" fill="#0f7f73">在指标内 ✓　损失 10 分钟数据，停机 10 分钟</text>
  </g>

  <g>
    <!-- 行 2 -->
    <text class="bs" x="40" y="412">中断 120 分钟</text>
    <rect x="150" y="400" width="180" height="16" rx="3" fill="#eef1f6" stroke="#dbe4f0" stroke-width="1"/>
    <rect x="150" y="400" width="180" height="16" rx="3" fill="#f3b8b8"/>
    <path d="M330 400 l14 8 l-14 8 z" fill="#d64545"/>
    <line x1="210" y1="394" x2="210" y2="422" stroke="#d98600" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text class="eb" x="348" y="413" fill="#a32020">超出指标 ✗　超过 100 分钟无覆盖，属于事故而非降级</text>
  </g>
</svg>
