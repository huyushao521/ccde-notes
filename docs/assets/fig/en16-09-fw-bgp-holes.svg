<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">BGP neighbours crossing a firewall pair, with the six protocol and port holes to open and how to audit them</title>
  <desc id="d15">Topology: two edge routers and an internal border router in AS 65001 exchange routes across a firewall HA pair, with the DMZ switch behind the same inspection point; notes cover eBGP multihop requiring a TTL of at least two and a fixed update source, and iBGP full mesh or a route reflector spanning both sides. The most common breakage is using loopbacks as update source without permitting BFD UDP 3784 between those loopbacks, which leaves BFD up but the neighbour down, or the neighbour up with no prefixes at all. A table lists the holes with their purpose and the usual omission: TCP 179, BFD UDP 3784 and 4784, ESP and UDP 4500, UDP 500, ICMP type 3 code 4 for path MTU discovery, and ICMP echo for probes. For every hole the design records who initiates it, why it exists, when it can be removed and what breaks if it is.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="396" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Routing neighbours across a firewall are normal - undocumented holes are not</text>  <text class="s" x="24" y="45">eBGP or iBGP has to cross the inspection point. The design work is the hole list, the TTL, and the comment that survives staff turnover.</text>  <text class="k" x="24" y="76">THE TOPOLOGY EVERYONE BUILDS AND NOBODY DOCUMENTS</text>  <rect x="40" y="96" width="116" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="52" y="113">出口路由器 A</text>  <text class="c" x="52" y="125">AS 65001</text>  <rect x="40" y="152" width="116" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="52" y="169">出口路由器 B</text>  <text class="c" x="52" y="181">AS 65001</text>  <rect x="224" y="108" width="128" height="72" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="b" x="236" y="125">防火墙对</text>  <text class="c" x="236" y="137">inspection</text>  <text class="c" x="236" y="149">HA pair</text>  <rect x="420" y="96" width="130" height="40" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="432" y="113">内部边界路由器</text>  <text class="c" x="432" y="125">AS 65001</text>  <rect x="420" y="152" width="130" height="40" rx="3" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <text class="b" x="432" y="169">DMZ 交换机</text>  <text class="c" x="432" y="181">VLAN 30</text>  <line x1="156" y1="116" x2="224" y2="128" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <line x1="156" y1="172" x2="224" y2="160" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <line x1="352" y1="128" x2="420" y2="116" stroke="#29a08f" stroke-width="1" marker-end="url(#at)"/>  <line x1="352" y1="160" x2="420" y2="172" stroke="#29a08f" stroke-width="1" marker-end="url(#at)"/>  <text class="w" x="160" y="200">eBGP 多跳：TTL 需放到 2+，源地址要固定</text>  <text class="w" x="160" y="214">iBGP 全互联或 RR 跨越两侧</text>  <text class="x" x="40" y="246">最常见的破法：更新源用 loopback 却没放行 loopback 之间的 UDP 3784</text>  <text class="w" x="40" y="260">BFD 起来了但 BGP 邻居 Down；或邻居 Up 但没有前缀 - 都是洞没开全</text>  <text class="k" x="40" y="288">FOUR THINGS TO WRITE DOWN WITH EVERY HOLE</text>  <text class="w" x="40" y="304">谁发起（源/目的 + 端口）、为什么要、什么时候能删、删了会怎样</text>  <text class="k" x="508" y="76">THE HOLE LIST, WITH THE REASON NEXT TO EACH ROW</text>  <rect x="508" y="84" width="368" height="20" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="516" y="97">协议 / 端口</text>  <text class="k" x="634.0" y="97">用途</text>  <text class="k" x="764.0" y="97">常见遗漏</text>  <rect x="508" y="104" width="368" height="26" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="516" y="122">TCP 179</text>  <text class="w" x="634.0" y="122">eBGP / iBGP 邻居</text>  <text class="w" x="764.0" y="122">源与目的都要放（双向）</text>  <line x1="508" y1="130" x2="876" y2="130" stroke="#eef2f8" stroke-width=".7"/>  <rect x="508" y="130" width="368" height="26" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="516" y="148">UDP 3784 / 4784</text>  <text class="w" x="634.0" y="148">BFD 单跳 / 多跳 + echo</text>  <text class="w" x="764.0" y="148">常被漏掉：loopback 之间</text>  <line x1="508" y1="156" x2="876" y2="156" stroke="#eef2f8" stroke-width=".7"/>  <rect x="508" y="156" width="368" height="26" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="516" y="174">ESP (50) / UDP 4500</text>  <text class="w" x="634.0" y="174">IPsec，NAT-T 场景</text>  <text class="w" x="764.0" y="174">按隧道端点开，不按网段开</text>  <line x1="508" y1="182" x2="876" y2="182" stroke="#eef2f8" stroke-width=".7"/>  <rect x="508" y="182" width="368" height="26" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="516" y="200">UDP 500</text>  <text class="w" x="634.0" y="200">IKE 协商</text>  <text class="w" x="764.0" y="200">只需在建立阶段</text>  <line x1="508" y1="208" x2="876" y2="208" stroke="#eef2f8" stroke-width=".7"/>  <rect x="508" y="208" width="368" height="26" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="516" y="226">ICMP type 3 code 4</text>  <text class="w" x="634.0" y="226">PMTUD 分片不可达</text>  <text class="w" x="764.0" y="226">不放 → 大包黑洞</text>  <line x1="508" y1="234" x2="876" y2="234" stroke="#eef2f8" stroke-width=".7"/>  <rect x="508" y="234" width="368" height="26" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="516" y="252">ICMP echo</text>  <text class="w" x="634.0" y="252">探测与 SLA</text>  <text class="w" x="764.0" y="252">与安全策略一起评审</text>  <line x1="508" y1="260" x2="876" y2="260" stroke="#eef2f8" stroke-width=".7"/>  <text class="g" x="508" y="288">审计方法：从 BGP 邻居 Down 与 PMTUD 黑洞反查，而不是从配置读</text>  <text class="w" x="508" y="304">每季度把洞表与规则库对一遍，删掉不再需要的行</text>  <line x1="24" y1="326" x2="876" y2="326" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="346">Why the firewall must still be in the path</text>  <text class="w" x="24" y="364">Bypassing it for BGP is tempting and usually wrong: the same path carries the prefixes that will be used by every user session. Inspect it,</text>  <text class="w" x="24" y="378">open the narrow holes, and keep the neighbour in the same failure domain you designed - otherwise the first asymmetric packet finds the hole.</text>
</svg>
