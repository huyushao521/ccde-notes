<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" role="img" aria-labelledby="t6 d6">

  <title id="t6">把合规条款翻译成设计输入：三问、映射与证据链</title>
  <desc id="d6">上半部分是三问：数据是什么在哪、边界在哪、怎么证明，分别产出数据分类分布图、逻辑与物理边界、证据链。中部给出合规要求到网络设计的五条典型映射，包括 PCI DSS 传输加密、访问最小化、日志留存、数据主权与第三方访问。底部是证据链的四个必备件。</desc>
  <defs>
    <marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/>
    </marker>
  </defs>
  <style>
    .h{font:600 12.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2233}
    .q{font:700 12px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1f4fc0}
    .o{font:600 11px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#4a5a72}
    .note{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .kd{font:600 11px "Segoe UI","Microsoft YaHei",sans-serif;fill:#4a5a72}
    .t1{font:600 10.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#a32020}
  </style>

  <rect x="0" y="0" width="900" height="470" fill="#fbfcfe"/>

  <text class="h" x="24" y="30">合规条款读起来是"要求"，设计要的是"约束"</text>
  <text class="note" x="24" y="48">翻译的方法是三问；三问的产出直接就是设计输入，不是法务文件</text>

  <!-- 三问 -->
  <rect x="24" y="66" width="270" height="112" rx="8" fill="#eaf1ff" stroke="#2f6fed" stroke-width="1.3"/>
  <text class="q" x="40" y="90">① 数据是什么、在哪</text>
  <text class="s" x="40" y="112">先做数据分类，再做数据分布图。</text>
  <text class="s" x="40" y="130">客户实名信息（敏感）/ 订单汇总（可</text>
  <text class="s" x="40" y="146">脱敏）/ 日志（含 IP，属个人数据）</text>
  <text class="o" x="40" y="168" fill="#1f4fc0">产出：分类清单 + 分布图</text>

  <line x1="298" y1="122" x2="310" y2="122" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="315" y="66" width="270" height="112" rx="8" fill="#eaf1ff" stroke="#2f6fed" stroke-width="1.3"/>
  <text class="q" x="331" y="90">② 边界在哪</text>
  <text class="s" x="331" y="112">只要跨过这条线，规则就会变——那它</text>
  <text class="s" x="331" y="130">就是一条设计边界，不是一个合规说辞。</text>
  <text class="s" x="331" y="146">境内/境外、生产/测试、供应商可及范围</text>
  <text class="o" x="331" y="168" fill="#1f4fc0">产出：逻辑 + 物理边界清单</text>

  <line x1="589" y1="122" x2="601" y2="122" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#ar6)"/>

  <rect x="606" y="66" width="270" height="112" rx="8" fill="#e8f7f4" stroke="#12a594" stroke-width="1.3"/>
  <text class="q" x="622" y="90" fill="#0f7f73">③ 怎么证明</text>
  <text class="s" x="622" y="112">审计员不看你配了什么，只看你能否证明</text>
  <text class="s" x="622" y="130">"在任意时刻它确实是那样"。</text>
  <text class="s" x="622" y="146">访问日志、加密状态、审批与变更记录</text>
  <text class="o" x="622" y="168" fill="#0f7f73">产出：证据链（含留存期）</text>

  <!-- 映射 -->
  <text class="kd" x="24" y="204" fill="#1a2233">合规要求 → 网络设计的典型映射</text>

  <rect x="24" y="214" width="852" height="30" rx="4" fill="#f4f7fb"/>
  <text class="t1" x="36" y="234">传输加密（PCI DSS 第 4 项）</text>
  <text class="s" x="360" y="234">跨公网链路必须 IPsec / TLS；内部链路由数据分级决定是否需要 MACsec</text>

  <rect x="24" y="248" width="852" height="30" rx="4" fill="#fafbfd"/>
  <text class="t1" x="36" y="268">访问最小化（PCI DSS 第 7 项）</text>
  <text class="s" x="360" y="268">持卡人数据环境独立分段（VLAN / VRF），跨域一律过有状态设备</text>

  <rect x="24" y="282" width="852" height="30" rx="4" fill="#f4f7fb"/>
  <text class="t1" x="36" y="302">日志留存与不可篡改（PCI DSS 第 10 项、GDPR）</text>
  <text class="s" x="360" y="302">日志服务器独立网段 + 单向外送 + NTP 统一时间源（时间不准的日志没有证据价值）</text>

  <rect x="24" y="316" width="852" height="30" rx="4" fill="#fafbfd"/>
  <text class="t1" x="36" y="336">数据驻留（数据主权）</text>
  <text class="s" x="360" y="336">境内实例 + 脱敏单向出站 + 本地存储；连监控采集点也要在境内</text>

  <rect x="24" y="350" width="852" height="30" rx="4" fill="#f4f7fb"/>
  <text class="t1" x="36" y="370">可审计的第三方访问（HIPAA、GDPR）</text>
  <text class="s" x="360" y="370">供应商接入走独立通道、按工单临时开通、全程命令审计 / 录屏</text>

  <!-- 证据链 -->
  <rect x="24" y="394" width="852" height="60" rx="8" fill="#e8f7f4" stroke="#12a594" stroke-width="1.2"/>
  <text class="kd" x="40" y="416" fill="#0f7f73">证据链四件套：缺一项，审计就通不过</text>
  <rect x="40" y="424" width="150" height="22" rx="11" fill="#fff" stroke="#a8ddd2" stroke-width="1"/>
  <text class="note" x="115" y="439" text-anchor="middle" fill="#0f7f73">日志（谁、何时、做了什么）</text>
  <rect x="204" y="424" width="150" height="22" rx="11" fill="#fff" stroke="#a8ddd2" stroke-width="1"/>
  <text class="note" x="279" y="439" text-anchor="middle" fill="#0f7f73">统一时间源 NTP（唯一）</text>
  <rect x="368" y="424" width="150" height="22" rx="11" fill="#fff" stroke="#a8ddd2" stroke-width="1"/>
  <text class="note" x="443" y="439" text-anchor="middle" fill="#0f7f73">变更记录 + 审批留痕</text>
  <rect x="532" y="424" width="150" height="22" rx="11" fill="#fff" stroke="#a8ddd2" stroke-width="1"/>
  <text class="note" x="607" y="439" text-anchor="middle" fill="#0f7f73">定期复核记录</text>
  <text class="note" x="700" y="439" fill="#0f7f73">这些要与网络方案一起交付，不是上线后补</text>
</svg>
