<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Four NAT forms with their purpose and cost, the port ceiling behind one public address, and five questions the design must answer</title>
  <desc id="d15">Four forms: NAT44 or PAT multiplexes many internal hosts onto one public address with port reuse, common for outbound and limited by ports; NAT444 or carrier-grade NAT adds another layer at the provider, useful when addresses are scarce but adding a troubleshooting hop and pushing logs to the carrier; NAT64 with DNS64 lets IPv6-only clients reach IPv4 services, with application compatibility and ALG issues; and NPTv6 translates only the prefix without touching ports, useful for changing prefixes on multiple exits while keeping internal addressing, though it destroys end-to-end testability. A side panel gives the port ceiling: one address is 64 thousand ports, 45 to 55 thousand usable, twenty to a hundred concurrent sessions per endpoint means 500 to 2,500 endpoints per address, with three overflow symptoms. Five questions cover pool ownership per exit, inbound publication, how sessions end at switchover, log retention and compliance, and pool exhaustion behaviour.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="454" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Four NAT forms and the five questions that decide which one you can live with</text>  <text class="s" x="24" y="45">NAT looks like a feature. At the edge it is runtime state with a lifetime, an owner and a compliance obligation.</text>  <rect x="24" y="76" width="560" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="91">形态</text>  <text class="k" x="164.0" y="91">做什么</text>  <text class="k" x="378.0" y="91">什么时候用</text>  <text class="k" x="508.0" y="91">代价</text>  <rect x="24" y="98" width="560" height="40" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="130">NAT44 / PAT</text>  <text class="c" x="164.0" y="130">多内网 → 1 个公网 IP + 端口复用</text>  <text class="g" x="378.0" y="130">出向为主，最常用</text>  <text class="x" x="508.0" y="130">端口成为并发上限</text>  <line x1="24" y1="138" x2="584" y2="138" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="138" width="560" height="40" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="170">NAT444 / CGNAT</text>  <text class="c" x="164.0" y="170">运营商侧再做一层，家庭/分支多一层</text>  <text class="c" x="378.0" y="170">地址不足、运营商强制</text>  <text class="x" x="508.0" y="170">排障多一跳，日志在华数</text>  <line x1="24" y1="178" x2="584" y2="178" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="178" width="560" height="40" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="210">NAT64 + DNS64</text>  <text class="c" x="164.0" y="210">IPv6 客户端访问 IPv4 服务</text>  <text class="c" x="378.0" y="210">IPv6-only 接入</text>  <text class="x" x="508.0" y="210">应用兼容与 ALG 问题</text>  <line x1="24" y1="218" x2="584" y2="218" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="218" width="560" height="40" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="250">NPTv6</text>  <text class="c" x="164.0" y="250">只做前缀翻译，不改端口</text>  <text class="c" x="378.0" y="250">多出口换前缀但保留内部编址</text>  <text class="x" x="508.0" y="250">仅限 IPv6，且破坏端到端可测</text>  <line x1="24" y1="258" x2="584" y2="258" stroke="#eef2f8" stroke-width=".7"/>  <rect x="600" y="76" width="276" height="186" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="610" y="94">THE PORT CEILING</text>  <text class="m" x="610" y="114">1 个 IP = 64k 端口</text>  <text class="m" x="610" y="128">有效 ≈ 45k-55k</text>  <text class="m" x="610" y="142">每终端 20-100 并发</text>  <text class="m" x="610" y="156">→ 500-2,500 终端 / IP</text>  <text class="b" x="610" y="178">三个溢出症状</text>  <text class="w" x="610" y="194">- 新连接失败，老连接正常</text>  <text class="w" x="610" y="208">- 日志里大量 no translation</text>  <text class="w" x="610" y="222">- 表现为“某应用偶发不通”</text>  <text class="x" x="610" y="246">先扩 IP，再谈扩容防火墙</text>  <text class="k" x="24" y="232">FIVE QUESTIONS THE DESIGN MUST ANSWER ABOUT ITS OWN NAT</text>  <text class="c" x="28" y="258">1.</text>  <text class="b" x="46" y="258">池的归属</text>  <text class="w" x="190" y="258">每个出口是否独立池？共用一个池 = 切换后全部重连</text>  <text class="c" x="28" y="288">2.</text>  <text class="b" x="46" y="288">入向发布</text>  <text class="w" x="190" y="288">对外服务固定走哪个池？DNS 里能不能只指一个地址？</text>  <text class="c" x="28" y="318">3.</text>  <text class="b" x="46" y="318">会话结束</text>  <text class="w" x="190" y="318">切换时等超时、清表重连，还是有会话同步？写进预案</text>  <text class="c" x="28" y="348">4.</text>  <text class="b" x="46" y="348">日志与合规</text>  <text class="w" x="190" y="348">留存多久、能不能按五元组反查、谁来调取</text>  <text class="c" x="28" y="378">5.</text>  <text class="b" x="46" y="378">耗尽行为</text>  <text class="w" x="190" y="378">池满时拒绝新连接，还是复用旧映射？两者都要能告警</text>  <line x1="24" y1="402" x2="876" y2="402" stroke="#dfe6f1" stroke-width=".8"/>  <text class="w" x="24" y="422">The coupling that bites: NAT is the only edge function that is simultaneously a routing decision (which exit), a security decision</text>  <text class="w" x="24" y="436">(who may publish) and a compliance decision (how long logs live). Changing the ISP changes all three, and only one of them is on the diagram.</text>
</svg>
