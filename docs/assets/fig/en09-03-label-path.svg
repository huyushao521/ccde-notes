<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" role="img" aria-labelledby="t903 d903">
  <title id="t903">The label stack across an L3VPN: what each hop pushes, swaps and pops, and the LIB and LFIB tables behind it</title>
  <desc id="d903">A five-hop path with the label stack drawn under each hop. At the ingress PE the packet leaves IP and gains a VPN label at the bottom of the stack and a transport label at the top. At each P router the transport label is swapped and the VPN label is untouched. At the egress PE the transport label is popped and the VPN label then identifies the destination VRF. A table on the right maps label type to function and to where it is pushed. A lower panel explains the two tables: the LIB is the label-to-prefix mapping produced by the control plane, and the LFIB is incoming label to outgoing label plus interface, which is what actually forwards. The troubleshooting order is given as bindings first, then forwarding table.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .r{font:600 7.5px "Segoe UI",sans-serif;fill:#1a2233}
  </style>
  <rect x="0" y="0" width="900" height="430" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">One packet, five hops, two labels &#8212; and only the edges understand it</text>
  <text class="s" x="24" y="45">The inner label is a VPN identity; the outer label is only a road. Only the edges know what the inner one means</text>

  <rect x="24" y="62" width="96" height="26" rx="2" fill="#f7f9fd" stroke="#9aa8ba" stroke-width=".7"/>
  <text class="r" x="52" y="79">CE1</text>
  <rect x="152" y="62" width="96" height="26" rx="2" fill="#f4f8fe" stroke="#1f4fc0" stroke-width=".8"/>
  <text class="r" x="180" y="79">PE1</text>
  <rect x="280" y="62" width="76" height="26" rx="2" fill="#f5fdfa" stroke="#0f7f73" stroke-width=".7"/>
  <text class="r" x="306" y="79">P1</text>
  <rect x="388" y="62" width="76" height="26" rx="2" fill="#f5fdfa" stroke="#0f7f73" stroke-width=".7"/>
  <text class="r" x="414" y="79">P2</text>
  <rect x="496" y="62" width="96" height="26" rx="2" fill="#f4f8fe" stroke="#1f4fc0" stroke-width=".8"/>
  <text class="r" x="524" y="79">PE2</text>
  <rect x="624" y="62" width="96" height="26" rx="2" fill="#f7f9fd" stroke="#9aa8ba" stroke-width=".7"/>
  <text class="r" x="652" y="79">CE2</text>
  <line x1="120" y1="75" x2="152" y2="75" stroke="#9aa8ba" stroke-width=".9"/>
  <line x1="248" y1="75" x2="280" y2="75" stroke="#9aa8ba" stroke-width=".9"/>
  <line x1="356" y1="75" x2="388" y2="75" stroke="#9aa8ba" stroke-width=".9"/>
  <line x1="464" y1="75" x2="496" y2="75" stroke="#9aa8ba" stroke-width=".9"/>
  <line x1="592" y1="75" x2="624" y2="75" stroke="#9aa8ba" stroke-width=".9"/>

  <text class="k" x="24" y="108">LABEL STACK ON THE WIRE</text>

  <rect x="118" y="116" width="34" height="22" rx="1" fill="#f7f9fd" stroke="#9aa8ba" stroke-width=".6"/>
  <text class="w" x="126" y="131">IP</text>
  <text class="c" x="122" y="156">before PE1: pure IP</text>

  <rect x="196" y="116" width="52" height="22" rx="1" fill="#fdf9f0" stroke="#c99a2e" stroke-width=".7"/>
  <text class="w" x="205" y="131" fill="#7a5b18">L=2001</text>
  <rect x="248" y="116" width="52" height="22" rx="1" fill="#f4f8fe" stroke="#1f4fc0" stroke-width=".7"/>
  <text class="w" x="258" y="131" fill="#1f4fc0">VPN=57</text>
  <text class="c" x="196" y="156">PE1 pushes transport (top) + VPN (bottom)</text>

  <rect x="318" y="116" width="52" height="22" rx="1" fill="#fdf9f0" stroke="#c99a2e" stroke-width=".7"/>
  <text class="w" x="327" y="131" fill="#7a5b18">L=3011</text>
  <rect x="370" y="116" width="52" height="22" rx="1" fill="#f4f8fe" stroke="#1f4fc0" stroke-width=".7"/>
  <text class="w" x="380" y="131" fill="#1f4fc0">VPN=57</text>
  <text class="c" x="312" y="156">P1 swaps only the transport label</text>

  <rect x="426" y="116" width="52" height="22" rx="1" fill="#fdf9f0" stroke="#c99a2e" stroke-width=".7"/>
  <text class="w" x="435" y="131" fill="#7a5b18">L=4022</text>
  <rect x="478" y="116" width="52" height="22" rx="1" fill="#f4f8fe" stroke="#1f4fc0" stroke-width=".7"/>
  <text class="w" x="488" y="131" fill="#1f4fc0">VPN=57</text>
  <text class="c" x="426" y="156">P2 does the same, one hop closer</text>

  <rect x="540" y="116" width="52" height="22" rx="1" fill="#f5fdfa" stroke="#0f7f73" stroke-width=".7"/>
  <text class="w" x="550" y="131" fill="#0f7f73">VPN=57</text>
  <text class="c" x="536" y="156">PE2 pops transport, reads VPN 57</text>
  <text class="c" x="536" y="169">&#8594; chooses the VRF, then removes it</text>

  <rect x="660" y="116" width="34" height="22" rx="1" fill="#f7f9fd" stroke="#9aa8ba" stroke-width=".6"/>
  <text class="w" x="668" y="131">IP</text>
  <text class="c" x="648" y="156">CE2: IP again, no labels</text>

  <rect x="24" y="184" width="852" height="70" rx="2" fill="#f8fbff" stroke="#d6e0ee" stroke-width=".6"/>
  <text class="b" x="36" y="202">Two label types, two jobs</text>
  <text class="c" x="36" y="220"><tspan style="font-weight:700">Transport label</tspan> (outer, top of stack): defines the LSP. Written at the ingress PE, swapped at every P, popped at the egress PE. Carries no customer meaning.</text>
  <text class="c" x="36" y="238"><tspan style="font-weight:700">VPN label</tspan> (inner, bottom of stack): identifies the destination VRF. Written once at the ingress PE and never touched until the egress PE &#8212; this is what makes the core ignorant.</text>

  <text class="k" x="24" y="276">THE TWO TABLES BEHIND THE FORWARDING</text>
  <rect x="24" y="284" width="410" height="70" rx="2" fill="#f4f8fe" stroke="#c3d5f2" stroke-width=".6"/>
  <text class="b" x="36" y="302">LIB &#8212; label information base</text>
  <text class="c" x="36" y="318">Label to prefix mapping: how the control plane chose to</text>
  <text class="c" x="36" y="331">label each prefix, and which peer offered which label.</text>
  <text class="c" x="36" y="344">Read it when a label is missing or when two peers disagree.</text>

  <rect x="446" y="284" width="430" height="70" rx="2" fill="#f5fdfa" stroke="#bfe3de" stroke-width=".6"/>
  <text class="b" x="458" y="302">LFIB &#8212; label forwarding information base</text>
  <text class="c" x="458" y="318">Incoming label to outgoing label and interface: the actual</text>
  <text class="c" x="458" y="331">forwarding decision, including label 0 and label 3 behaviour.</text>
  <text class="c" x="458" y="344">Read it when the packet is being dropped or misdirected.</text>

  <rect x="24" y="368" width="852" height="46" rx="3" fill="#fdf9f0" stroke="#e6d3a8" stroke-width=".7"/>
  <rect x="24" y="368" width="4" height="46" fill="#b8862b"/>
  <text class="c" x="40" y="386" fill="#7a5b18"><tspan style="font-weight:700">Troubleshooting order, always:</tspan> bindings first (how were labels assigned), forwarding table second (how is the packet actually handled). Skipping step one turns every label</text>
  <text class="c" x="40" y="402" fill="#7a5b18">problem into guesswork, because a correct LFIB entry built from the wrong binding forwards perfectly in the wrong direction.</text>
</svg>
