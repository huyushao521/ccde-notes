<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Switch clustering as fate sharing: what merges, what stays separate, and where it is still the right answer</title>
  <desc id="d15">Left: two chassis, one active and one standby supervisor, joined by a thick bar labelled one virtual switch with one control plane, one configuration and one upgrade window; arrows show the coupling. Right: a panel titled one event, twice the impact listing four events - a configuration error pushed to both members, a software upgrade that reloads both in the same window, a control-plane bug with no surviving control plane, and a peer-link failure causing dual active where both believe they are root - each fanning out to both members. A footer separates what merges (control plane, software version, configuration, upgrade window, bug exposure, troubleshooting domain) from what stays separate (power, supervisor hardware, line cards, physical paths), and notes where clustering is still the right answer: a small team, one rack, a hard requirement for a single management point, and a maintenance window long enough to upgrade both members together.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="424" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Clustering is the simplest to operate - and it welds two failures into one</text>  <text class="s" x="24" y="45">Fate sharing is a tool. Used in the wrong direction, it turns two independent failures into a single, larger one.</text>  <rect x="60" y="96" width="170" height="96" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="72" y="116">Chassis A</text>  <text class="w" x="72" y="132">active supervisor</text>  <rect x="72" y="142" width="60" height="6" rx="1" fill="#eef3fb" stroke="#dbe6f8" stroke-width=".8"/>  <rect x="72" y="153" width="60" height="6" rx="1" fill="#eef3fb" stroke="#dbe6f8" stroke-width=".8"/>  <rect x="72" y="164" width="60" height="6" rx="1" fill="#eef3fb" stroke="#dbe6f8" stroke-width=".8"/>  <rect x="72" y="175" width="60" height="6" rx="1" fill="#eef3fb" stroke="#dbe6f8" stroke-width=".8"/>  <rect x="60" y="226" width="170" height="96" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="72" y="246">Chassis B</text>  <text class="w" x="72" y="262">standby supervisor</text>  <rect x="72" y="272" width="60" height="6" rx="1" fill="#eef3fb" stroke="#dbe6f8" stroke-width=".8"/>  <rect x="72" y="283" width="60" height="6" rx="1" fill="#eef3fb" stroke="#dbe6f8" stroke-width=".8"/>  <rect x="72" y="294" width="60" height="6" rx="1" fill="#eef3fb" stroke="#dbe6f8" stroke-width=".8"/>  <rect x="72" y="305" width="60" height="6" rx="1" fill="#eef3fb" stroke="#dbe6f8" stroke-width=".8"/>  <rect x="250" y="96" width="8" height="226" rx="3" fill="#c9d8f6" stroke="none"/>  <text class="b" x="268" y="150">one virtual switch</text>  <text class="w" x="268" y="166">one control plane,</text>  <text class="w" x="268" y="179">one config, one</text>  <text class="w" x="268" y="192">upgrade window</text>  <line x1="258" y1="210" x2="240" y2="150" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="258" y1="210" x2="240" y2="250" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <rect x="430" y="92" width="446" height="232" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="442" y="110">ONE EVENT, TWICE THE IMPACT</text>  <rect x="442" y="126" width="250" height="38" rx="3" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".8"/>  <text class="x" x="454" y="142">config error pushed</text>  <text class="w" x="454" y="155">same CLI, both members</text>  <line x1="694" y1="145" x2="730" y2="145" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <text class="w" x="736" y="149">both members</text>  <rect x="442" y="172" width="250" height="38" rx="3" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".8"/>  <text class="x" x="454" y="188">software upgrade</text>  <text class="w" x="454" y="201">both reload in the same window</text>  <line x1="694" y1="191" x2="730" y2="191" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <text class="w" x="736" y="195">both members</text>  <rect x="442" y="218" width="250" height="38" rx="3" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".8"/>  <text class="x" x="454" y="234">control-plane bug</text>  <text class="w" x="454" y="247">one bug, no surviving control plane</text>  <line x1="694" y1="237" x2="730" y2="237" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <text class="w" x="736" y="241">both members</text>  <rect x="442" y="264" width="250" height="38" rx="3" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".8"/>  <text class="x" x="454" y="280">peer-link failure</text>  <text class="w" x="454" y="293">dual active, both believe they are root</text>  <line x1="694" y1="283" x2="730" y2="283" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <text class="w" x="736" y="287">both members</text>  <line x1="24" y1="340" x2="876" y2="340" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="358">What merges</text>  <text class="w" x="24" y="374">control plane, software version, configuration, upgrade window, bug exposure, the troubleshooting domain</text>  <text class="b" x="24" y="394">What stays separate</text>  <text class="w" x="24" y="410">power, supervisor hardware, line cards, physical paths - so the hardware redundancy is real, but it is not free</text>  <text class="b" x="430" y="358">Where clustering is the right answer</text>  <text class="w" x="430" y="374">a small team, one rack, a hard requirement for a single management point,</text>  <text class="w" x="430" y="388">and a maintenance window long enough to upgrade both members together</text>
</svg>
