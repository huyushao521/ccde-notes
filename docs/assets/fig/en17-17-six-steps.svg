  <text class="k" x="24" y="298">THE ORDER MATTERS: EACH STEP'S OUTPUT IS THE NEXT STEP'S CONSTRAINT</text>
  <rect x="24" y="306" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="321">SKIPPED</text>  <text class="k" x="162.0" y="321">WHAT IS DECIDED WITHOUT EVIDENCE</text>  <text class="k" x="562.0" y="321">COST, 3-12 MONTHS AFTER GO-LIVE</text>  <rect x="24" y="328" width="852" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="343">Skip 1</text>  <text class="c" x="162.0" y="343">hub-spoke carries heavy spoke-to-spoke traffic</text>  <text class="c" x="562.0" y="343">hub becomes the bottleneck</text>  <line x1="24" y1="351" x2="876" y2="351" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="351" width="852" height="23" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="366">Skip 3</text>  <text class="c" x="162.0" y="366">two carriers share the last mile</text>  <text class="c" x="562.0" y="366">redundancy exists on paper</text>  <line x1="24" y1="374" x2="876" y2="374" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="374" width="852" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="389">Skip 4</text>  <text class="c" x="162.0" y="389">O(n^2) tunnels, MTU untouched</text>  <text class="c" x="562.0" y="389">spoke-to-spoke fails</text>  <line x1="24" y1="397" x2="876" y2="397" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="397" width="852" height="23" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="412">Skip 5</text>  <text class="c" x="162.0" y="412">QoS only at headquarters</text>  <text class="c" x="562.0" y="412">voice dies on the first congested branch</text>  <line x1="24" y1="420" x2="876" y2="420" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="420" width="852" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="435">Skip 6</text>  <text class="c" x="162.0" y="435">hub accepted without crypto throughput test</text>  <text class="c" x="562.0" y="435">growth means new hardware</text>  <line x1="24" y1="443" x2="876" y2="443" stroke="#eef2f8" stroke-width=".7"/>
  <line x1="24" y1="452" x2="876" y2="452" stroke="#dfe6f1" stroke-width=".8"/>
  <text class="b" x="24" y="470">The hurdle column is the review: if nobody in the room can answer it, the step is not finished, whatever the slide says</text>
  <text class="c" x="24" y="486">Negotiate bandwidth before asking about encryption and you will discover the throughput halving after signature.</text>
</svg>
