  <rect x="310" y="68" width="135" height="214" rx="3" fill="#ffffff" stroke="#8b6bd0" stroke-width=".8"/>
  <rect x="310" y="68" width="135" height="3" rx="1" fill="#8b6bd0" stroke="none"/>
