  <line x1="177" y1="208" x2="292" y2="208" stroke="#eef2f8" stroke-width=".8"/>
  <text class="k" x="177" y="222">HURDLE</text>
  <text class="w" x="177" y="236">will core apps accept Internet</text>
  <text class="w" x="177" y="248">?</text>
