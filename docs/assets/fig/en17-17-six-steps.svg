<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The six-step WAN method with inputs, deliverables, per-step hurdles and the cost of each skipped step</title>
  <desc id="d15">Six columns run left to right: business map, transport model, redundancy shape, overlay and segmentation, routing and QoS, and capacity and validation. Each column lists its inputs, its deliverable and the hurdle that must be cleared immediately - whether any two sites must talk, whether core applications accept Internet quality, whether a carrier failure must trigger a switchover, whether summarisation conflicts with direct spoke paths, which egress enforces QoS, and whether the hub is sized at full-site peak after encryption. A five-row table gives the cost of skipping each step, from hub bottlenecks and paper-only redundancy to O of n squared tunnels, head-office-only QoS and a hub that cannot grow without new hardware. The method cannot be reordered because each step's output constrains the next, and negotiating bandwidth before asking about encryption ends in discovering the throughput halving after signature.</desc>
