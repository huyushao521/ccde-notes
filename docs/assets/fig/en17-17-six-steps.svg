  <text class="b" x="177" y="108">Transport model</text>
  <text class="k" x="177" y="126">INPUT</text>
  <text class="c" x="177" y="140">circuits per site</text>
  <text class="c" x="177" y="152">budget, SLA</text>
  <text class="k" x="177" y="172">OUTPUT</text>
  <text class="c" x="177" y="186">transport per tier</text>
