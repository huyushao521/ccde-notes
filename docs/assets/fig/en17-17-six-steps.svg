  <text class="b" x="320" y="108">Redundancy shape</text>
  <text class="k" x="320" y="126">INPUT</text>
  <text class="c" x="320" y="140">availability target</text>
  <text class="c" x="320" y="152">switchover budget</text>
  <text class="k" x="320" y="172">OUTPUT</text>
  <text class="c" x="320" y="186">link/CPE/carrier mix</text>
  <text class="c" x="320" y="198"></text>
  <line x1="320" y1="208" x2="435" y2="208" stroke="#eef2f8" stroke-width=".8"/>
  <text class="k" x="320" y="222">HURDLE</text>
  <text class="w" x="320" y="236">must carrier failure switch?</text>
  <text class="w" x="320" y="248"></text>
  <line x1="445" y1="175" x2="453" y2="175" stroke="#29a08f" stroke-width="1.1" marker-end="url(#at)"/>
  <rect x="453" y="68" width="135" height="214" rx="3" fill="#ffffff" stroke="#d99b2b" stroke-width=".8"/>
