<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Three service-access models: independent firewall pairs per block, shared services with a service edge, and centralised virtualised contexts</title>
  <desc id="d15">Model A gives each functional block its own firewall pair with its own policy, keeping the blast radius at one block but buying capacity twice and letting policies drift. Model B routes each block into its own VRF that meets a shared, VRF-aware service edge holding one policy set, which gives one policy and one team at the price of a shared dependency and a return path that must come back to the edge. Model C centralises into one platform with many virtual contexts, a single supervisor, a shared licence pool and VASI or virtual wire inside the box, giving the lowest capex and shared capacity but making one platform a blast radius that spans every tenant. A footer asks the separating question: if the policy device fails, whose traffic stops.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="396" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Three ways to place security services, three different blast radii</text>  <text class="s" x="24" y="45">Independent per block, shared with a service edge, or centralised and virtualised - each one moves where the return path breaks.</text>  <rect x="24" y="86" width="274" height="226" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="86" width="274" height="3" rx="3" fill="#4a7ee0" stroke="none"/>  <text class="k" x="36" y="106">A. INDEPENDENT PER DOMAIN</text>  <text class="b" x="36" y="122">each block gets its own pair</text>  <rect x="312" y="86" width="274" height="226" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="312" y="86" width="274" height="3" rx="3" fill="#29a08f" stroke="none"/>  <text class="k" x="324" y="106">B. SHARED SERVICES + SERVICE EDGE</text>  <text class="b" x="324" y="122">one pair, many VRFs, one edge</text>  <rect x="600" y="86" width="274" height="226" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="600" y="86" width="274" height="3" rx="3" fill="#8b6bd0" stroke="none"/>  <text class="k" x="612" y="106">C. CENTRALISED, VIRTUALISED</text>  <text class="b" x="612" y="122">one platform, many contexts</text>  <rect x="38" y="140" width="112" height="52" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="48" y="158">block 1</text>  <text class="w" x="48" y="172">FW pair</text>  <text class="w" x="48" y="184">own policy</text>  <rect x="164" y="140" width="112" height="52" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="174" y="158">block 2</text>  <text class="w" x="174" y="172">FW pair</text>  <text class="w" x="174" y="184">own policy</text>  <text class="g" x="38" y="216">- blast radius = one block</text>  <text class="w" x="38" y="230">- capacity bought twice, idle at night</text>  <text class="x" x="38" y="244">- policy duplicated, drifts</text>  <text class="w" x="38" y="262">- no shared services without links</text>  <text class="w" x="38" y="282">fit: 2-3 blocks, strong compliance isolation</text>  <rect x="326" y="140" width="88" height="40" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="c" x="334" y="158">block 1</text>  <text class="w" x="334" y="172">VRF-A</text>  <rect x="326" y="190" width="88" height="40" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="c" x="334" y="208">block 2</text>  <text class="w" x="334" y="222">VRF-B</text>  <rect x="452" y="152" width="116" height="66" rx="3" fill="#ffffff" stroke="#cfeae5" stroke-width=".8"/>  <text class="c" x="462" y="170">service edge</text>  <text class="w" x="462" y="184">VRF-aware</text>  <text class="c" x="462" y="198">FW / IPS</text>  <text class="w" x="462" y="212">one policy</text>  <line x1="416" y1="160" x2="450" y2="170" stroke="#29a08f" stroke-width="1" marker-end="url(#at)"/>  <line x1="416" y1="210" x2="450" y2="200" stroke="#29a08f" stroke-width="1" marker-end="url(#at)"/>  <text class="g" x="326" y="246">- one policy set, one team</text>  <text class="w" x="326" y="260">- service edge is a shared dependency</text>  <text class="x" x="326" y="274">- return path must come back to the edge</text>  <text class="w" x="326" y="292">fit: 4+ blocks, central security team</text>  <rect x="620" y="140" width="150" height="104" rx="3" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <text class="c" x="630" y="158">virtual contexts</text>  <text class="w" x="630" y="174">ctx1 ctx2 ctx3 ...</text>  <text class="w" x="630" y="190">one supervisor,</text>  <text class="w" x="630" y="204">one licence pool</text>  <text class="w" x="630" y="222">VASI / vWire</text>  <text class="w" x="630" y="236">inside the box</text>  <text class="g" x="620" y="262">- capacity shared, capex lowest</text>  <text class="x" x="620" y="276">- one platform = one blast radius</text>  <text class="x" x="620" y="290">- blast radius spans every tenant</text>  <text class="w" x="620" y="308">fit: many tenants, one ops team, tested failover</text>  <line x1="24" y1="326" x2="876" y2="326" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="346">The question that separates the three</text>  <text class="w" x="24" y="364">"If the policy device fails, whose traffic stops?" Independent per domain: one block. Shared edge: every block that uses it.</text>  <text class="w" x="24" y="378">Centralised virtualised: everyone, at once - which is why the failover test matters more than the datasheet throughput.</text>
</svg>
