<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" width="100%" role="img" aria-labelledby="t8 d8">

  <title id="t8">EVPN 五种路由类型的分工：A-D、MAC/IP、IMET、Ethernet Segment、IP Prefix</title>
  <desc id="d8">Type 1 以太网自动发现宣告 ESI，用于快速收敛与 aliasing；Type 2 通告 MAC 与 IP，是转发面基础；Type 3 建立 BUM 分发树；Type 4 做 DF 选举；Type 5 通告 IP 前缀使 EVPN 可承载三层。右列标注每种类型解决的问题。</desc>
  <style>
    .h{font:600 12.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .ty{font:700 9px "Segoe UI",sans-serif;fill:#1f4fc0}
    .nm{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .d{font:9px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .tg{font:9px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .t{font:9px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
  </style>

  <rect x="0" y="0" width="900" height="412" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">EVPN 五种路由类型：每种解决一个具体问题</text>
  <text class="s" x="24" y="48">记住"它解决什么"比记住报文格式有用得多</text>

  <text class="t" x="110" y="68">类型 · 名称 · 作用</text>
  <text class="t" x="640" y="68">它解决的问题</text>

  <rect x="24" y="76" width="852" height="50" rx="6" fill="#e8f7f4" stroke="#b6e3da"/>
  <rect x="34" y="86" width="60" height="30" rx="4" fill="#fff" stroke="#12a594"/>
  <text class="ty" x="64" y="105" text-anchor="middle" fill="#0f7f73">Type 1</text>
  <text class="nm" x="110" y="98">Ethernet A-D（自动发现）：宣告"我拥有哪个 ESI"</text>
  <text class="d" x="110" y="115">用于快速收敛、aliasing 负载分担、以及按 ESI 批量撤消</text>
  <text class="tg" x="640" y="105">→ 多归属场景的加速器</text>

  <rect x="24" y="138" width="852" height="50" rx="6" fill="#fff4e0" stroke="#f0d6a8"/>
  <rect x="34" y="148" width="60" height="30" rx="4" fill="#fff" stroke="#d98600"/>
  <text class="ty" x="64" y="167" text-anchor="middle" fill="#a86400">Type 2</text>
  <text class="nm" x="110" y="160">MAC/IP Advertisement：最核心的一条</text>
  <text class="d" x="110" y="177">通告 MAC（可含 IP）与下一跳；支撑 ARP 代理、MAC 移动性</text>
  <text class="tg" x="640" y="167" fill="#a86400">→ 转发面的基础</text>

  <rect x="24" y="200" width="852" height="50" rx="6" fill="#f4f7fb" stroke="#dbe4f0"/>
  <rect x="34" y="210" width="60" height="30" rx="4" fill="#fff" stroke="#8494a8"/>
  <text class="ty" x="64" y="229" text-anchor="middle" fill="#4a5a72">Type 3</text>
  <text class="nm" x="110" y="222">IMET（包含式组播以太网标签）：建立 BUM 分发树</text>
  <text class="d" x="110" y="239">告诉别人"我需要收泛洪流量"，从而把泛洪限制在需要的成员之间</text>
  <text class="tg" x="640" y="229">→ 泛洪范围可控</text>

  <rect x="24" y="262" width="852" height="50" rx="6" fill="#f4f7fb" stroke="#dbe4f0"/>
  <rect x="34" y="272" width="60" height="30" rx="4" fill="#fff" stroke="#8494a8"/>
  <text class="ty" x="64" y="291" text-anchor="middle" fill="#4a5a72">Type 4</text>
  <text class="nm" x="110" y="284">Ethernet Segment：DF（指定转发者）选举</text>
  <text class="d" x="110" y="301">多归属时决定由哪台 PE 向 CE 转发 BUM，避免同一份流量被多台重复发送</text>
  <text class="tg" x="640" y="291">→ 多归属去重</text>

  <rect x="24" y="324" width="852" height="50" rx="6" fill="#eaf1ff" stroke="#c9dbff"/>
  <rect x="34" y="334" width="60" height="30" rx="4" fill="#fff" stroke="#2f6fed"/>
  <text class="ty" x="64" y="353" text-anchor="middle">Type 5</text>
  <text class="nm" x="110" y="346">IP Prefix：通告 IP 前缀，让 EVPN 也能做三层</text>
  <text class="d" x="110" y="363">承载 L3VPN 功能，一张控制平面同时管 L2 与 L3（第 9 章 Overlay 的基础）</text>
  <text class="tg" x="640" y="353">→ L2/L3 统一控制面</text>

  <text class="s" x="24" y="394">记忆法：<tspan font-weight="600" fill="#1f4fc0">1 发现、2 MAC、3 泛洪、4 选举、5 前缀</tspan>；Type 5 是"EVPN 不止二层"的分界线。</text>
</svg>
