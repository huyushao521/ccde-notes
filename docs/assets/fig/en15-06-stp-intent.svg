<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Why STP has no topological intent, next to a routed design where the path can be stated</title>
  <desc id="d15">Left panel: three switches in a triangle, with one link drawn dashed red and labelled blocked because STP chose it by bridge ID, path cost and timers; the text notes that the link was paid for and sits idle, and that there is no way to say prefer the left link for voice. Right panel: the same triangle in layer 3 with ECMP, both parallel links carrying traffic in both directions and the diagonal links also used; metric, prefix lists and route policy can state the intent. A comparison table below contrasts what decides the path, what happens on link failure, and whether a human can state intent at all.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="422" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">STP computes a tree; it does not accept an intent</text>  <text class="s" x="24" y="45">The blocked link is capacity you paid for, and the shape of the tree is decided by bridge IDs, not by your design.</text>  <rect x="24" y="86" width="414" height="208" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="36" y="104">LAYER 2: THE TREE IS COMPUTED</text>  <rect x="80" y="137" width="96" height="26" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="88" y="154">SW-A root</text>  <rect x="290" y="137" width="96" height="26" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="298" y="154">SW-B</text>  <rect x="180" y="223" width="96" height="26" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="188" y="240">SW-C</text>  <line x1="216" y1="150" x2="290" y2="150" stroke="#9fb3d1" stroke-width="1.2"/>  <line x1="330" y1="163" x2="250" y2="223" stroke="#9fb3d1" stroke-width="1.2"/>  <line x1="120" y1="163" x2="200" y2="223" stroke="#d0564a" stroke-width="1.2" stroke-dasharray="4 3"/>  <text class="x" x="96" y="208">blocked</text>  <text class="w" x="60" y="222">paid for, idle</text>  <text class="w" x="36" y="268">the blocked port is chosen by bridge ID, path cost and timers</text>  <text class="w" x="36" y="282">no way to say "prefer the left link for voice"</text>  <rect x="462" y="86" width="414" height="208" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="474" y="104">LAYER 3: THE PATH IS EXPRESSED</text>  <rect x="524" y="137" width="80" height="26" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="c" x="532" y="154">R1</text>  <rect x="734" y="137" width="80" height="26" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="c" x="742" y="154">R2</text>  <rect x="624" y="223" width="80" height="26" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="c" x="632" y="240">R3</text>  <line x1="618" y1="143" x2="730" y2="143" stroke="#29a08f" stroke-width="1.2" marker-end="url(#at)" marker-start="url(#at)"/>  <line x1="614" y1="158" x2="726" y2="158" stroke="#4a7ee0" stroke-width="1.2" marker-end="url(#ab)" marker-start="url(#ab)"/>  <line x1="556" y1="164" x2="640" y2="222" stroke="#29a08f" stroke-width="1.2" marker-end="url(#at)"/>  <line x1="772" y1="164" x2="688" y2="222" stroke="#29a08f" stroke-width="1.2" marker-end="url(#at)"/>  <text class="w" x="620" y="134">both links carry traffic</text>  <text class="w" x="474" y="268">ECMP: every link is used, and metric, prefix-list,</text>  <text class="w" x="474" y="282">or route policy can state the intent explicitly</text>  <rect x="24" y="306" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="321"></text>  <text class="k" x="182.3529411764706" y="321">Multitier STP</text>  <text class="k" x="533.1764705882354" y="321">Routed / ECMP</text>  <rect x="24" y="328" width="852" height="26" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="346">What decides the path</text>  <text class="c" x="182.3529411764706" y="346">bridge ID, path cost, timers</text>  <text class="c" x="533.1764705882354" y="346">metric, prefix, policy</text>  <line x1="24" y1="354" x2="876" y2="354" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="354" width="852" height="26" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="372">On link failure</text>  <text class="c" x="182.3529411764706" y="372">recompute the tree, flush MACs</text>  <text class="c" x="533.1764705882354" y="372">reconverge the route, keep the rest</text>  <line x1="24" y1="380" x2="876" y2="380" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="380" width="852" height="26" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="398">Can a human state intent</text>  <text class="x" x="182.3529411764706" y="398">no, only tune the tie-breakers</text>  <text class="g" x="533.1764705882354" y="398">yes, in the routing protocol</text>  <line x1="24" y1="406" x2="876" y2="406" stroke="#eef2f8" stroke-width=".7"/>  <text class="w" x="24" y="404">The point is not that layer 3 is faster. It is that layer 2 has no vocabulary for what you want the network to do.</text>
</svg>
