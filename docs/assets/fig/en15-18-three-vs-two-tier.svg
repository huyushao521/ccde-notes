<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Three-tier and two-tier collapsed-core topologies with the role of each tier and the decision rule between them</title>
  <desc id="d15">Left panel: three-tier where two core switches carry summarised transit, three distribution switches hold policy, gateway and summarisation, and each block has a pair of access switches; the core exists when more than three blocks, a WAN edge, a data centre and the internet all have to meet. Right panel: two-tier collapsed core where one pair performs both distribution and core roles, which means a distribution-pair failure is also a core failure; it is the right choice for one building, three or fewer blocks and scarce fibre, with a growth path measured in blocks. A decision rule at the bottom explains how to count functional blocks and why moving from two-tier to three-tier later means re-cabling the distribution layer.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="432" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Three tiers or two: the question is whether a core tier has a job</text>  <text class="s" x="24" y="45">A collapsed core is not a smaller design, it is the same design with the distribution layer's failure domain.</text>  <rect x="24" y="86" width="414" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="36" y="104">THREE-TIER</text>  <text class="b" x="36" y="122">A core with a real job</text>  <rect x="120" y="138" width="64" height="24" rx="3" fill="#eef3fb" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="152.0" y="153.0" text-anchor="middle">core A</text>  <rect x="230" y="138" width="64" height="24" rx="3" fill="#eef3fb" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="262.0" y="153.0" text-anchor="middle">core B</text>  <rect x="90" y="186" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="122.0" y="201.0" text-anchor="middle">dist A</text>  <rect x="200" y="186" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="232.0" y="201.0" text-anchor="middle">dist B</text>  <rect x="310" y="186" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="342.0" y="201.0" text-anchor="middle">dist C</text>  <line x1="152" y1="162" x2="122" y2="186" stroke="#9fb3d1" stroke-width="1"/>  <line x1="152" y1="162" x2="232" y2="186" stroke="#9fb3d1" stroke-width="1"/>  <line x1="262" y1="162" x2="232" y2="186" stroke="#9fb3d1" stroke-width="1"/>  <line x1="262" y1="162" x2="342" y2="186" stroke="#9fb3d1" stroke-width="1"/>  <line x1="152" y1="162" x2="342" y2="186" stroke="#9fb3d1" stroke-width=".8" stroke-dasharray="3 3"/>  <rect x="60" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="92.0" y="241.0" text-anchor="middle">access</text>  <rect x="130" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="162.0" y="241.0" text-anchor="middle">access</text>  <line x1="82" y1="210" x2="92" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <line x1="114" y1="210" x2="92" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <rect x="186" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="218.0" y="241.0" text-anchor="middle">access</text>  <rect x="256" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="288.0" y="241.0" text-anchor="middle">access</text>  <line x1="208" y1="210" x2="218" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <line x1="240" y1="210" x2="218" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <rect x="312" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="344.0" y="241.0" text-anchor="middle">access</text>  <rect x="382" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="414.0" y="241.0" text-anchor="middle">access</text>  <line x1="334" y1="210" x2="344" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <line x1="366" y1="210" x2="344" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <text class="w" x="36" y="268">roles: core = fast, simple, summarised transit; dist = policy, gateway,</text>  <text class="w" x="36" y="282">summarisation; access = ports, PoE, VLAN edge</text>  <text class="g" x="36" y="302">each block keeps its own failure domain</text>  <text class="w" x="36" y="318">core exists when: &gt;3 blocks, WAN edge + DC + internet all need to meet</text>  <rect x="462" y="86" width="414" height="250" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="474" y="104">TWO-TIER (COLLAPSED CORE)</text>  <text class="b" x="474" y="122">One pair does two jobs</text>  <rect x="560" y="150" width="84" height="24" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="c" x="602.0" y="165.0" text-anchor="middle">core+dist A</text>  <rect x="676" y="150" width="84" height="24" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="c" x="718.0" y="165.0" text-anchor="middle">core+dist B</text>  <rect x="500" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="532.0" y="241.0" text-anchor="middle">access</text>  <rect x="566" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="598.0" y="241.0" text-anchor="middle">access</text>  <line x1="520" y1="174" x2="530" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <line x1="550" y1="174" x2="530" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <rect x="626" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="658.0" y="241.0" text-anchor="middle">access</text>  <rect x="692" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="724.0" y="241.0" text-anchor="middle">access</text>  <line x1="646" y1="174" x2="656" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <line x1="676" y1="174" x2="656" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <rect x="752" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="784.0" y="241.0" text-anchor="middle">access</text>  <rect x="818" y="226" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="850.0" y="241.0" text-anchor="middle">access</text>  <line x1="772" y1="174" x2="782" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <line x1="802" y1="174" x2="782" y2="226" stroke="#9fb3d1" stroke-width=".9"/>  <text class="w" x="474" y="268">roles merged: policy, gateway, summarisation and core transit on one pair</text>  <text class="x" x="474" y="288">a dist-pair failure is now also a core failure</text>  <text class="w" x="474" y="308">two-tier is right when: one building, &lt;= 3 blocks, fibre to the</text>  <text class="w" x="474" y="322">core is scarce, and the growth path is a block, not a campus</text>  <line x1="24" y1="350" x2="876" y2="350" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="368">Decision rule</text>  <text class="w" x="24" y="386">Count the functional blocks. Three or fewer, one building, one WAN edge: two-tier. More than three blocks, or a second</text>  <text class="w" x="24" y="400">building with its own fibre run, or a DC plus internet plus WAN all meeting in the middle: three-tier. Growing into the</text>  <text class="w" x="24" y="414">second case later means re-cabling the distribution layer, so buy the core tier when the block count is already two.</text>
</svg>
