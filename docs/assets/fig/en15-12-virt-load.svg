<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 422" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The operational cost of campus virtualisation: what the platform count shows, what state per platform hides, and what to count in review</title>
  <desc id="d15">Left panel: what the platform count shows - fewer devices to rack and cable, fewer management IPs and fewer licence items - against what it hides, more config objects per box, more failure modes per box and a troubleshooting path that grows from two or three hops to five or seven. Right panel: state per platform, with a red curve showing troubleshooting steps growing faster than the device count falls as VRFs go from one to five, twenty and fifty, and the note that the engineer who used to debug one box now debugs ten contexts that are not isolated from each other's bugs. A footer lists four things to count in the design review: contexts per platform and the blast radius of one software defect, who can debug it at three in the morning, what the runbook looks like when every component behaves normally but the path is broken, and whether failing one context without touching production is still possible.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="422" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Virtualisation does not remove work, it concentrates work onto fewer boxes</text>  <text class="s" x="24" y="45">Fewer devices to rack, more state per device: that is the trade, and only one side of it shows up on the quote.</text>  <rect x="24" y="86" width="430" height="196" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="36" y="104">WHAT THE PLATFORM COUNT SHOWS</text>  <text class="c" x="40" y="126">devices to rack and cable</text>  <text class="w" x="300" y="126">many</text>  <line x1="330" y1="123" x2="356" y2="123" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <text class="c" x="366" y="126">few</text>  <text class="c" x="40" y="152">management IPs</text>  <text class="w" x="300" y="152">many</text>  <line x1="330" y1="149" x2="356" y2="149" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <text class="c" x="366" y="152">few</text>  <text class="c" x="40" y="178">licence line items</text>  <text class="w" x="300" y="178">many</text>  <line x1="330" y1="175" x2="356" y2="175" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <text class="c" x="366" y="178">few</text>  <text class="c" x="40" y="214">config objects per box</text>  <text class="w" x="300" y="214">few</text>  <line x1="330" y1="211" x2="356" y2="211" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <text class="x" x="366" y="214">many</text>  <text class="c" x="40" y="238">failure modes per box</text>  <text class="w" x="300" y="238">few</text>  <line x1="330" y1="235" x2="356" y2="235" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <text class="x" x="366" y="238">many</text>  <text class="c" x="40" y="262">hops in a troubleshooting path</text>  <text class="w" x="300" y="262">2-3</text>  <line x1="330" y1="259" x2="356" y2="259" stroke="#d0564a" stroke-width="1" marker-end="url(#ar)"/>  <text class="x" x="366" y="262">5-7</text>  <rect x="462" y="86" width="414" height="196" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="474" y="104">STATE PER PLATFORM</text>  <text class="b" x="474" y="122">what one box must now hold</text>  <line x1="500" y1="268" x2="850" y2="268" stroke="#dfe6f1" stroke-width="1"/>  <line x1="500" y1="268" x2="500" y2="168" stroke="#dfe6f1" stroke-width="1"/>  <path d="M 500 262 C 620 254, 710 212, 850 168" fill="none" stroke="#d0564a" stroke-width="1.6"/>  <line x1="500" y1="268" x2="500" y2="272" stroke="#dfe6f1" stroke-width="1"/>  <text class="w" x="500" y="284" text-anchor="middle">1 VRF</text>  <line x1="620" y1="268" x2="620" y2="272" stroke="#dfe6f1" stroke-width="1"/>  <text class="w" x="620" y="284" text-anchor="middle">5</text>  <line x1="730" y1="268" x2="730" y2="272" stroke="#dfe6f1" stroke-width="1"/>  <text class="w" x="730" y="284" text-anchor="middle">20</text>  <line x1="850" y1="268" x2="850" y2="272" stroke="#dfe6f1" stroke-width="1"/>  <text class="w" x="850" y="284" text-anchor="middle">50+</text>  <text class="x" x="690" y="194">troubleshooting steps</text>  <text class="w" x="690" y="208">grow faster than the device count falls</text>  <text class="w" x="474" y="190">the same engineer who used to debug</text>  <text class="w" x="474" y="204">one box now debugs ten contexts</text>  <text class="w" x="474" y="224">and the contexts are not isolated</text>  <text class="w" x="474" y="238">from each other's bugs</text>  <line x1="24" y1="300" x2="876" y2="300" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="320">Count these in the design review, before the platform order</text>  <text class="w" x="24" y="338">1. How many contexts / VRFs / virtual devices on the platform, and what is the blast radius of one software defect?</text>  <text class="w" x="24" y="352">2. Who can debug it at 03:00 - how many people, and does that survive a resignation?</text>  <text class="w" x="24" y="366">3. What does the runbook look like when the fusion router, the service edge and the contexts all behave normally but the path is broken?</text>  <text class="w" x="24" y="380">4. Is the failure test still possible - can you fail one context without touching production in another?</text>  <text class="g" x="24" y="404">Virtue of virtualisation: one policy point, one place to insert a service, one place to look. Cost: one place to break.</text>
</svg>
