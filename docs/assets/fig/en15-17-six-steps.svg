<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The six-step campus design method with the input, deliverable and unresolved hurdle of each step</title>
  <desc id="d15">Six numbered columns. Boundaries: input is the org chart, service catalogue, compliance requirements and existing sites; output is the functional-block list with endpoints, bandwidth and availability per block; the hurdle is deciding whose traffic must reach whom. Tiers: input is the number of blocks, building layout and fibre; output is three-tier or two-tier with the core location; the hurdle is that more than three blocks on a collapsed core is debt by design. Boundary: output is the access model choice; the hurdle is whether some layer 2 must span closets. Routing: output is the IGP, area or query design, summary table and FHRP or BFD plan; the hurdle is whether stub and summarisation are really configured. Virtualisation: output is the VRF count, isolation technique and service chain; the hurdle is where the service node sits and how traffic returns. Capacity: output is the capacity table, convergence budget and acceptance cases; the hurdle is calculating the invisible wireless bandwidth and PoE. A table lists the four shortcuts and their consequences.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
