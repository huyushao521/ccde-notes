  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="504" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">The six-step campus design method: boundaries before protocols</text>  <text class="s" x="24" y="45">1 boundaries, 2 tiers, 3 L2/L3 boundary, 4 routing, 5 virtualisation, 6 capacity - each step fixes the input of the next.</text>  <rect x="34" y="86" width="132" height="246" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="34" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="44" y="103" font-size="11">1</text>  <text class="b" x="58" y="103">BOUNDARIES</text>  <text class="k" x="44" y="128">INPUT</text>  <text class="w" x="44" y="142">org chart, service</text>  <text class="w" x="44" y="153">catalogue, compliance</text>  <text class="w" x="44" y="164">requirements, sites</text>  <text class="k" x="44" y="186">OUTPUT</text>  <text class="w" x="44" y="200">functional-block list +</text>  <text class="w" x="44" y="211">endpoints, bandwidth and</text>  <text class="w" x="44" y="222">availability per block</text>  <rect x="42" y="240" width="116" height="84" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="48" y="254">THE HURDLE</text>  <text class="c" x="48" y="268">whose traffic must reach who</text>  <text class="c" x="48" y="280">m</text>  <text class="c" x="48" y="292"></text>  <line x1="167" y1="200" x2="175" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="176" y="86" width="132" height="246" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="176" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="186" y="103" font-size="11">2</text>  <text class="b" x="200" y="103">TIERS</text>  <text class="k" x="186" y="128">INPUT</text>  <text class="w" x="186" y="142">number of blocks,</text>  <text class="w" x="186" y="153">building layout,</text>  <text class="w" x="186" y="164">fibre availability</text>  <text class="k" x="186" y="186">OUTPUT</text>  <text class="w" x="186" y="200">three-tier or two-tier +</text>  <text class="w" x="186" y="211">core location and form</text>  <rect x="184" y="240" width="116" height="84" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="190" y="254">THE HURDLE</text>  <text class="c" x="190" y="268">more than 3 blocks on a coll</text>  <text class="c" x="190" y="280">apsed core</text>  <text class="c" x="190" y="292"></text>  <line x1="309" y1="200" x2="317" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="318" y="86" width="132" height="246" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="318" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="328" y="103" font-size="11">3</text>  <text class="b" x="342" y="103">L2 / L3 BOUNDARY</text>  <text class="k" x="328" y="128">INPUT</text>  <text class="w" x="328" y="142">endpoint types, wireless</text>  <text class="w" x="328" y="153">share, cross-building</text>  <text class="w" x="328" y="164">L2 requirements</text>  <text class="k" x="328" y="186">OUTPUT</text>  <text class="w" x="328" y="200">access model: STP, routed</text>  <text class="w" x="328" y="211">access, or clustering</text>  <rect x="326" y="240" width="116" height="84" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="332" y="254">THE HURDLE</text>  <text class="c" x="332" y="268">is there L2 that must span c</text>  <text class="c" x="332" y="280">losets</text>  <text class="c" x="332" y="292"></text>  <line x1="451" y1="200" x2="459" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="460" y="86" width="132" height="246" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="460" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="470" y="103" font-size="11">4</text>  <text class="b" x="484" y="103">ROUTING</text>  <text class="k" x="470" y="128">INPUT</text>  <text class="w" x="470" y="142">team skill, platform</text>  <text class="w" x="470" y="153">capability, convergence</text>  <text class="w" x="470" y="164">budget</text>  <text class="k" x="470" y="186">OUTPUT</text>  <text class="w" x="470" y="200">IGP + area/query design +</text>  <text class="w" x="470" y="211">summary table + FHRP/BFD</text>  <rect x="468" y="240" width="116" height="84" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="474" y="254">THE HURDLE</text>  <text class="c" x="474" y="268">is stub and summarisation re</text>  <text class="c" x="474" y="280">ally configured</text>  <text class="c" x="474" y="292"></text>  <line x1="593" y1="200" x2="601" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="602" y="86" width="132" height="246" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="602" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="612" y="103" font-size="11">5</text>  <text class="b" x="626" y="103">VIRTUALISATION</text>  <text class="k" x="612" y="128">INPUT</text>  <text class="w" x="612" y="142">isolation needs,</text>  <text class="w" x="612" y="153">tenants, shared</text>  <text class="w" x="612" y="164">services</text>  <text class="k" x="612" y="186">OUTPUT</text>  <text class="w" x="612" y="200">VRF/VN count + isolation</text>  <text class="w" x="612" y="211">technique + service chain</text>  <rect x="610" y="240" width="116" height="84" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="616" y="254">THE HURDLE</text>  <text class="c" x="616" y="268">where the service node sits </text>  <text class="c" x="616" y="280">and how it returns</text>  <text class="c" x="616" y="292"></text>  <line x1="735" y1="200" x2="743" y2="200" stroke="#4a7ee0" stroke-width="1" marker-end="url(#ab)"/>  <rect x="744" y="86" width="132" height="246" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="744" y="86" width="132" height="26" rx="3" fill="#f2f6fd" stroke="none"/>  <text class="B" x="754" y="103" font-size="11">6</text>  <text class="b" x="768" y="103">CAPACITY</text>  <text class="k" x="754" y="128">INPUT</text>  <text class="w" x="754" y="142">density, application</text>  <text class="w" x="754" y="153">bandwidth, PoE budget,</text>  <text class="w" x="754" y="164">addressing plan</text>  <text class="k" x="754" y="186">OUTPUT</text>  <text class="w" x="754" y="200">capacity table +</text>  <text class="w" x="754" y="211">convergence budget +</text>  <text class="w" x="754" y="222">acceptance cases</text>  <rect x="752" y="240" width="116" height="84" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="k" x="758" y="254">THE HURDLE</text>  <text class="c" x="758" y="268">calculate the invisible wire</text>  <text class="c" x="758" y="280">less and PoE</text>  <text class="c" x="758" y="292"></text>  <text class="b" x="24" y="356">The shortcuts and where they explode (usually 6-18 months later)</text>  <rect x="24" y="366" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="381">Short-cut</text>  <text class="k" x="252.0" y="381">Consequence</text>  <rect x="24" y="388" width="852" height="24" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="404">Skip 1, jump to 2</text>  <text class="c" x="252.0" y="404">blocks split by floor, so security and business boundaries never line up</text>  <line x1="24" y1="412" x2="876" y2="412" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="412" width="852" height="24" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="428">Skip 3, jump to 4</text>  <text class="c" x="252.0" y="428">OSPF chosen but layer 2 is still several STP domains; gateway and routing boundaries disagree</text>  <line x1="24" y1="436" x2="876" y2="436" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="436" width="852" height="24" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="452">Skip 5, buy hardware</text>  <text class="c" x="252.0" y="452">compliance implemented as physical separation; rack and licence cost doubles</text>  <line x1="24" y1="460" x2="876" y2="460" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="460" width="852" height="24" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="476">Skip 6, go live</text>  <text class="c" x="252.0" y="476">AP power budget too small, DHCP pools exhausted, convergence never measured</text>  <line x1="24" y1="484" x2="876" y2="484" stroke="#eef2f8" stroke-width=".7"/>  <text class="x" x="24" y="486">The order cannot be reversed: boundaries determine protocols; protocols never determine boundaries.</text>
</svg>
