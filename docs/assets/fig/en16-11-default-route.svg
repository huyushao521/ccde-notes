<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">A default route black hole where every local signal looks healthy, with four detection ladder steps and what each still misses</title>
  <desc id="d15">Topology: an edge router holds a static default route towards the ISP A edge, whose interface is up, and traffic disappears into a black hole inside the provider; all local signals are healthy because the interface is up, the next hop is reachable and the BGP session may still be established. A timeline shows failure, nobody noticing, the user complaint and a manual switch forty minutes later, because a default route has no concept of path quality, only existence, and a floating static only reacts when the interface or next hop disappears. A four-row detection ladder compares floating static with tracking, IP SLA with tracking, BFD and eBGP multihoming by what each can see, its detection time and what it still misses. A footer describes the combination that works and asks what event makes each default route disappear.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="490" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">A default route is not a design. It is a last resort with a detection problem.</text>  <text class="s" x="24" y="45">Interface up, next hop reachable, route still preferred - and every packet disappears inside the provider for forty minutes.</text>  <text class="k" x="24" y="76">THE BLACK HOLE THAT LOOKS HEALTHY</text>  <rect x="40" y="92" width="110" height="40" rx="3" fill="#ffffff" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="52" y="109">出口路由器</text>  <text class="c" x="52" y="121">static 0.0.0.0/0</text>  <rect x="196" y="92" width="120" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="208" y="109">ISP-A 边缘</text>  <text class="c" x="208" y="121">接口 up</text>  <rect x="360" y="92" width="70" height="40" rx="3" fill="#fdf6f4" stroke="#f0d5cf" stroke-width=".8"/>  <text class="b" x="372" y="109">?</text>  <text class="c" x="372" y="121">黑洞</text>  <line x1="150" y1="112" x2="196" y2="112" stroke="#4a7ee0" stroke-width="1.2" marker-end="url(#ab)"/>  <line x1="316" y1="112" x2="360" y2="112" stroke="#d0564a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>  <text class="x" x="322" y="104">丢</text>  <text class="w" x="40" y="148">接口 up、下一跳可达、BGP 会话也许还在 - 所有本地信号都正常</text>  <rect x="40" y="160" width="390" height="22" rx="2" fill="#f2f6fd" stroke="none"/>  <text class="k" x="48" y="175">时间轴</text>  <text class="w" x="90" y="175">故障发生 → 无人知道 → 用户报障 → 40 分钟后人工切换</text>  <text class="x" x="40" y="200">为什么 40 分钟：默认路由没有“路径质量”概念，只有“存在”概念</text>  <text class="w" x="40" y="216">浮动静态只在接口或下一跳消失时切换；provider 内部故障不改变这两者</text>  <text class="k" x="24" y="244">FOUR DETECTION LADDER STEPS, AND WHAT EACH ONE STILL MISSES</text>  <rect x="24" y="254" width="852" height="20" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="267">手段</text>  <text class="k" x="232.0" y="267">能看见什么</text>  <text class="k" x="482.0" y="267">检测时间</text>  <text class="k" x="602.0" y="267">仍然漏掉</text>  <rect x="24" y="274" width="852" height="26" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="292">浮动静态 + track</text>  <text class="c" x="232.0" y="292">接口 / 下一跳存活</text>  <text class="c" x="482.0" y="292">秒 - 分钟</text>  <text class="x" x="602.0" y="292">路径坏、前缀丢失</text>  <line x1="24" y1="300" x2="876" y2="300" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="300" width="852" height="26" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="318">IP SLA + track</text>  <text class="c" x="232.0" y="318">端到端探针 + 阈值</text>  <text class="c" x="482.0" y="318">1-10 s</text>  <text class="x" x="602.0" y="318">探针目标本身的偏差</text>  <line x1="24" y1="326" x2="876" y2="326" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="326" width="852" height="26" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="344">BFD + 静态/BGP</text>  <text class="c" x="232.0" y="344">亚秒级双向检测</text>  <text class="g" x="482.0" y="344">亚秒</text>  <text class="x" x="602.0" y="344">对端不支持 BFD</text>  <line x1="24" y1="352" x2="876" y2="352" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="352" width="852" height="26" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="370">eBGP 多出口</text>  <text class="c" x="232.0" y="370">前缀级可达性 + 策略</text>  <text class="c" x="482.0" y="370">秒 - 分钟</text>  <text class="x" x="602.0" y="370">上游过滤与聚合黑洞</text>  <line x1="24" y1="378" x2="876" y2="378" stroke="#eef2f8" stroke-width=".7"/>  <text class="b" x="24" y="388">The combination that actually works</text>  <text class="w" x="24" y="406">Per-exit default with IP SLA or BFD tracking, BGP as the primary mechanism where the provider supports it, an out-of-band monitor that</text>  <text class="w" x="24" y="420">probes a known-good destination through each exit, and a documented rule for who is allowed to withdraw a default route at 03:00.</text>  <line x1="24" y1="434" x2="876" y2="434" stroke="#dfe6f1" stroke-width=".8"/>  <text class="x" x="24" y="454">Ask of every default route: what event makes it disappear, and how long after the real failure does that event happen?</text>  <text class="w" x="24" y="472">If the answer is “a human notices”, the design has no detection - it has an on-call rota standing in for a timer.</text>
</svg>
