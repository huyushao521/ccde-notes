<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The three access models drawn as topologies: gateway on the distribution pair, on the access switch, or active-active across a cluster</title>
  <desc id="d15">Three panels of identical closets. Multitier STP: distribution switches hold the SVI, an HSRP gateway and the STP root, the access switches uplink to both, the inter-switch link is drawn dashed red as blocked by STP; one gateway, one tree, one blocked link, failover through FHRP and STP in three to eighteen seconds, and every VLAN must exist on both distribution switches. Routed access: distribution switches have no SVI and no FHRP, uplinks are /31 links with ECMP, each access switch holds the 10.1.10.1 gateway; both uplinks carry traffic and failover through IGP and BFD is under a second, with layer 2 stopping at the access switch. Switch clustering: an MEC bundle to both members, one management IP and one configuration, a peer link between members, an active-active gateway and failover under one and a half seconds, at the price of shared config and software fate.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">The three access models, drawn as what they actually are</text>  <text class="s" x="24" y="45">Same endpoints, same closets. What changes is where the gateway lives and what has to fail over.</text>  <rect x="24" y="86" width="274" height="268" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="36" y="104">MULTITIER STP</text>  <text class="b" x="36" y="120">gateway on the distribution pair</text>  <rect x="312" y="86" width="274" height="268" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="324" y="104">ROUTED ACCESS</text>  <text class="b" x="324" y="120">gateway on the access switch</text>  <rect x="600" y="86" width="274" height="268" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="612" y="104">SWITCH CLUSTERING</text>  <text class="b" x="612" y="120">gateway active-active on both</text>  <rect x="60" y="136" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="92.0" y="151.0" text-anchor="middle">dist A</text>  <rect x="180" y="136" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="212.0" y="151.0" text-anchor="middle">dist B</text>  <rect x="60" y="170" width="184" height="40" rx="2" fill="#eef3fb" stroke="#c9d8f6" stroke-width=".8"/>  <text class="w" x="70" y="186">SVI + HSRP 10.1.10.254</text>  <text class="w" x="70" y="200">STP root aligned with active</text>  <line x1="100" y1="176" x2="140" y2="176" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="140" y1="190" x2="100" y2="190" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="92" y1="160" x2="92" y2="170" stroke="#9fb3d1" stroke-width="1"/>  <line x1="212" y1="160" x2="212" y2="170" stroke="#9fb3d1" stroke-width="1"/>  <rect x="52" y="236" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="84.0" y="251.0" text-anchor="middle">access</text>  <rect x="186" y="236" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="218.0" y="251.0" text-anchor="middle">access</text>  <line x1="74" y1="210" x2="84" y2="236" stroke="#9fb3d1" stroke-width="1"/>  <line x1="200" y1="210" x2="210" y2="236" stroke="#9fb3d1" stroke-width="1"/>  <line x1="84" y1="248" x2="186" y2="248" stroke="#d0564a" stroke-width="1" stroke-dasharray="4 3"/>  <text class="x" x="104" y="262">blocked by STP</text>  <text class="w" x="36" y="288">- one gateway, one tree, one blocked link</text>  <text class="w" x="36" y="302">- failover = FHRP + STP, 3-18 s</text>  <text class="x" x="36" y="318">- VLANs must exist on both dist switches</text>  <text class="w" x="36" y="338">use when: legacy L2, few closets</text>  <rect x="348" y="136" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="380.0" y="151.0" text-anchor="middle">dist A</text>  <rect x="468" y="136" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="500.0" y="151.0" text-anchor="middle">dist B</text>  <rect x="348" y="170" width="184" height="40" rx="2" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="w" x="358" y="186">no SVI, no FHRP: /31 links</text>  <text class="w" x="358" y="200">ECMP over both uplinks</text>  <line x1="388" y1="176" x2="428" y2="176" stroke="#29a08f" stroke-width="1" marker-end="url(#at)"/>  <line x1="428" y1="190" x2="388" y2="190" stroke="#29a08f" stroke-width="1" marker-end="url(#at)"/>  <line x1="380" y1="160" x2="380" y2="170" stroke="#9fb3d1" stroke-width="1"/>  <line x1="500" y1="160" x2="500" y2="170" stroke="#9fb3d1" stroke-width="1"/>  <rect x="340" y="236" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="372.0" y="251.0" text-anchor="middle">access</text>  <rect x="474" y="236" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="506.0" y="251.0" text-anchor="middle">access</text>  <line x1="362" y1="210" x2="372" y2="236" stroke="#9fb3d1" stroke-width="1"/>  <line x1="488" y1="210" x2="498" y2="236" stroke="#9fb3d1" stroke-width="1"/>  <rect x="340" y="236" width="76" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="w" x="346" y="262">10.1.10.1/24 = GW</text>  <text class="w" x="324" y="288">- each closet routes; both uplinks live</text>  <text class="w" x="324" y="302">- failover = IGP + BFD, &lt; 1 s</text>  <text class="g" x="324" y="318">- L2 stops at the access switch</text>  <text class="w" x="324" y="338">use when: new build, routing skill exists</text>  <rect x="628" y="136" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="660.0" y="151.0" text-anchor="middle">dist A</text>  <rect x="748" y="136" width="64" height="24" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="c" x="780.0" y="151.0" text-anchor="middle">dist B</text>  <rect x="628" y="170" width="184" height="40" rx="2" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <text class="w" x="638" y="186">MEC / bundle to both members</text>  <text class="w" x="638" y="200">one management IP, one config</text>  <line x1="660" y1="160" x2="660" y2="170" stroke="#9fb3d1" stroke-width="1"/>  <line x1="780" y1="160" x2="780" y2="170" stroke="#9fb3d1" stroke-width="1"/>  <rect x="628" y="236" width="64" height="24" rx="3" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <text class="c" x="660.0" y="251.0" text-anchor="middle">member A</text>  <rect x="736" y="236" width="64" height="24" rx="3" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <text class="c" x="768.0" y="251.0" text-anchor="middle">member B</text>  <line x1="692" y1="248" x2="736" y2="248" stroke="#8b6bd0" stroke-width="2"/>  <text class="w" x="700" y="240">peer link</text>  <text class="x" x="660" y="276">one control plane</text>  <text class="w" x="612" y="288">- active-active gateway on both members</text>  <text class="w" x="612" y="302">- failover = bundle removal, &lt; 1.5 s</text>  <text class="x" x="612" y="318">- both members share config and software fate</text>  <text class="w" x="612" y="338">use when: small team, one rack</text>  <line x1="24" y1="366" x2="876" y2="366" stroke="#dfe6f1" stroke-width=".8"/>  <text class="w" x="24" y="384">The models are not ranked. Multitier STP keeps layer 2 and buys compatibility; routed access buys failure behaviour and</text>  <text class="w" x="24" y="398">costs routing skill; clustering buys a single management point and pays with fate sharing. Whatever you pick, write down</text>  <text class="w" x="24" y="412">what fails over, how long it takes, and what the first user-visible symptom will be.</text>
</svg>
