<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Five layers where two ISP links become one shared failure domain, with the question to ask and the action to take at each layer</title>
  <desc id="d15">A fan-in diagram where ISP A and ISP B both descend through five shared layers: the same fibre or duct, the same point of presence or exchange building, the same rack and power feed, the same firewall and NAT pool, and the same policy and operations team, ending in a single failure domain. On the right, a table gives the question to ask and the action to take for each layer: request the physical entry routes from both providers, require different buildings, provide dual power feeds and separate racks, deploy a firewall pair with independent NAT pools, give each exit its own detection and announcement, and rehearse the switch with two on-call engineers and a written runbook. A footer suggests drawing both entry routes on one plan and notes that redundancy is a property of the weakest shared layer, not of the number of circuits.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="512" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Dual ISP is not dual path: five places where redundancy is quietly eaten</text>  <text class="s" x="24" y="45">Two links from two providers still share a duct, a rack, a power feed, a firewall and a policy. Count the layers, not the links.</text>  <text class="k" x="24" y="76">WHERE THE TWO PATHS BECOME ONE</text>  <rect x="40" y="88" width="120" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="52" y="105">ISP-A</text>  <text class="c" x="52" y="117">AS 64500</text>  <rect x="190" y="88" width="120" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="202" y="105">ISP-B</text>  <text class="c" x="202" y="117">AS 64501</text>  <rect x="40" y="148" width="380" height="36" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="52" y="163">同一根光缆 / 同一条管道</text>  <text class="w" x="52" y="176">两条进线走同一井道，挖断一次全断</text>  <line x1="100" y1="128" x2="100" y2="148" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <line x1="250" y1="128" x2="250" y2="148" stroke="#9fb3d1" stroke-width="1" marker-end="url(#ag)"/>  <rect x="40" y="192" width="380" height="36" rx="3" fill="#fdf8ee" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="52" y="207">同一个 PoP / 同一个局房</text>  <text class="w" x="52" y="220">两家运营商在同一楼里租机架，火灾与断电共享</text>  <rect x="40" y="236" width="380" height="36" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="52" y="251">同一个机柜 / 同一路市电</text>  <text class="w" x="52" y="264">PDU、UPS、空调是一份，不是两份</text>  <rect x="40" y="280" width="380" height="36" rx="3" fill="#fdf8ee" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="52" y="295">同一台防火墙 / 同一个 NAT 池</text>  <text class="w" x="52" y="308">设备或池子挂了，两条链路一起失去意义</text>  <rect x="40" y="324" width="380" height="36" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="52" y="339">同一条策略 / 同一个运维</text>  <text class="w" x="52" y="352">一条默认路由、一次变更、一个人按错回车</text>  <rect x="40" y="368" width="380" height="34" rx="3" fill="#fdf6f4" stroke="#f0d5cf" stroke-width=".8"/>  <text class="x" x="52" y="382">结果：两条链路，一个故障域</text>  <text class="w" x="52" y="395">链路冗余 ≠ 设备冗余 ≠ 路径冗余 ≠ 运维冗余</text>  <text class="k" x="448" y="76">THE VERIFICATION THAT COSTS NOTHING</text>  <rect x="448" y="88" width="428" height="20" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="456" y="101">共享层</text>  <text class="k" x="566.0" y="101">要问的问题</text>  <text class="k" x="734.0" y="101">能做的动作</text>  <rect x="448" y="108" width="428" height="34" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="456" y="134">光缆/井道</text>  <text class="c" x="566.0" y="134">两家是否同一物理路径</text>  <text class="c" x="734.0" y="134">向 ISP 索要进线走向图</text>  <line x1="448" y1="142" x2="876" y2="142" stroke="#eef2f8" stroke-width=".7"/>  <rect x="448" y="142" width="428" height="34" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="456" y="168">PoP / 局房</text>  <text class="c" x="566.0" y="168">是否同楼同层</text>  <text class="c" x="734.0" y="168">要求不同局房或异地入驻</text>  <line x1="448" y1="176" x2="876" y2="176" stroke="#eef2f8" stroke-width=".7"/>  <rect x="448" y="176" width="428" height="34" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="456" y="202">机柜/供电</text>  <text class="c" x="566.0" y="202">是否同一 PDU/UPS</text>  <text class="c" x="734.0" y="202">双路供电 + 分柜</text>  <line x1="448" y1="210" x2="876" y2="210" stroke="#eef2f8" stroke-width=".7"/>  <rect x="448" y="210" width="428" height="34" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="456" y="236">设备</text>  <text class="c" x="566.0" y="236">是否同一台 FW/NAT</text>  <text class="c" x="734.0" y="236">设备对 + 独立 NAT 池</text>  <line x1="448" y1="244" x2="876" y2="244" stroke="#eef2f8" stroke-width=".7"/>  <rect x="448" y="244" width="428" height="34" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="456" y="270">策略</text>  <text class="c" x="566.0" y="270">是否同一条默认路由</text>  <text class="c" x="734.0" y="270">每出口独立检测与宣告</text>  <line x1="448" y1="278" x2="876" y2="278" stroke="#eef2f8" stroke-width=".7"/>  <rect x="448" y="278" width="428" height="34" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="456" y="304">运维</text>  <text class="c" x="566.0" y="304">是否只有一个人会切</text>  <text class="c" x="734.0" y="304">演练 + 双人值班 + 剧本</text>  <line x1="448" y1="312" x2="876" y2="312" stroke="#eef2f8" stroke-width=".7"/>  <line x1="24" y1="418" x2="876" y2="418" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="438">The test that settles the argument</text>  <text class="w" x="24" y="456">Ask each provider for the physical entry route, then draw both on one plan. If the two lines meet before your rack, you have one path</text>  <text class="w" x="24" y="470">and two bills. The same test applies downward: one firewall model, one NAT pool, one default route, one on-call engineer.</text>  <text class="g" x="24" y="492">Redundancy is a property of the weakest shared layer, not of the number of circuits.</text>
</svg>
