<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">IGP selection as three local constraints, and the EIGRP versus OSPF comparison that follows from them</title>
  <desc id="d15">Three numbered question cards: what can this team operate at three in the morning, what is the convergence budget of three seconds, one second or three hundred milliseconds, and how is the query or area scope bounded. A five row table then compares EIGRP and OSPF on scope control with stub and summarisation versus areas and ABRs, the cost of summarisation with OSPF's suboptimal paths, convergence levers, what breaks first in a big flat design with query storms versus SPF churn, and the sentence each design must be able to say in a review.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="436" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">IGP selection is not a technology contest, it is three local constraints</text>  <text class="s" x="24" y="45">Team skill, convergence budget and query or area design. The protocol follows from those, not the other way round.</text>  <rect x="24" y="88" width="272" height="92" rx="3" fill="#f4f8ff" stroke="#eef2f8" stroke-width=".8"/>  <text class="B" x="36" y="110" font-size="13">1</text>  <text class="b" x="58" y="110">What can this team operate at 03:00?</text>  <text class="w" x="58" y="126"></text>  <text class="c" x="36" y="150">not what they can configure - what they can de</text>  <text class="c" x="36" y="164">bug</text>  <line x1="298" y1="134" x2="324" y2="134" stroke="#4a7ee0" stroke-width="1.2" marker-end="url(#ab)"/>  <rect x="312" y="88" width="272" height="92" rx="3" fill="#f3fbf9" stroke="#eef2f8" stroke-width=".8"/>  <text class="B" x="324" y="110" font-size="13">2</text>  <text class="b" x="346" y="110">What is the convergence budget?</text>  <text class="w" x="346" y="126"></text>  <text class="c" x="324" y="150">3 s, 1 s or 300 ms; that decides BFD and hiera</text>  <text class="c" x="324" y="164">rchy</text>  <line x1="586" y1="134" x2="612" y2="134" stroke="#4a7ee0" stroke-width="1.2" marker-end="url(#ab)"/>  <rect x="600" y="88" width="272" height="92" rx="3" fill="#f8f5fe" stroke="#eef2f8" stroke-width=".8"/>  <text class="B" x="612" y="110" font-size="13">3</text>  <text class="b" x="634" y="110">How do you bound the query or area sco</text>  <text class="w" x="634" y="126">pe?</text>  <text class="c" x="612" y="150">stub and summarisation, or areas and ABRs</text>  <text class="c" x="612" y="164"></text>  <rect x="24" y="200" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="215">Dimension</text>  <text class="k" x="272.0" y="215">EIGRP</text>  <text class="k" x="578.0" y="215">OSPF</text>  <rect x="24" y="222" width="852" height="30" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="244">Query / area scope control</text>  <text class="g" x="272.0" y="244">EIGRP stub + summarisation, no query beyond the edge</text>  <text class="g" x="578.0" y="244">OSPF areas, ABR summarisation, stub/NSSA</text>  <line x1="24" y1="252" x2="876" y2="252" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="252" width="852" height="30" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="274">Cost of summarisation</text>  <text class="g" x="272.0" y="274">no built-in suboptimality, metric is end to end</text>  <text class="x" x="578.0" y="274">summaries hide detail, so paths become suboptimal</text>  <line x1="24" y1="282" x2="876" y2="282" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="282" width="852" height="30" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="304">Convergence levers</text>  <text class="c" x="272.0" y="304">stub, summarisation, BFD, fast hellos</text>  <text class="c" x="578.0" y="304">areas, LSA types, BFD, SPF throttling</text>  <line x1="24" y1="312" x2="876" y2="312" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="312" width="852" height="30" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="334">What breaks first in a big flat design</text>  <text class="x" x="272.0" y="334">query storm after a flapping link</text>  <text class="x" x="578.0" y="334">SPF churn and LSA flooding</text>  <line x1="24" y1="342" x2="876" y2="342" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="342" width="852" height="30" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="364">Design review sentence you must be able to say</text>  <text class="b" x="272.0" y="364">"stub everywhere except the edge"</text>  <text class="b" x="578.0" y="364">"every area has a summary and a reason"</text>  <line x1="24" y1="372" x2="876" y2="372" stroke="#eef2f8" stroke-width=".7"/>  <text class="b" x="24" y="384">Both protocols are fine. A design with no scope control is not.</text>  <text class="w" x="24" y="402">The sign that the choice was wrong is never the protocol name in the diagram - it is an incident where one flapping link</text>  <text class="w" x="24" y="416">made every router in the campus recalculate, and nobody could predict how long it would take.</text>
</svg>
