<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Control plane, forwarding plane and session state, with the four clocks that run between BGP convergence and user recovery</title>
  <desc id="d15">Three stacked lanes describe the control plane, which decides what is announceable and selectable and fails on BFD at 300 milliseconds or the BGP hold timer at 180 seconds, visible in the BGP summary; the forwarding plane, which decides which link the packet actually takes, fails immediately when the link drops but does not notice a broken path, visible in traceroute and probes; and session state, which decides whether a given TCP or UDP session still works, fails on NAT timeouts of minutes or lost firewall sessions, and is visible only as a user complaint. Below, four clocks are laid out between BGP convergence and user recovery: NAT rebinding taking thirty seconds to five minutes, firewall session loss taking effect immediately until timeout, TCP retransmission taking one to three seconds per retry, and the application or user deciding whether to retry at all. A footer explains why a converged BGP table does not mean a recovered user.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="486" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">BGP solves reachability. Three planes decide whether the user's session survives.</text>  <text class="s" x="24" y="45">Control plane, forwarding plane and session state fail on different clocks - and only two of them are visible in show commands.</text>  <rect x="24" y="74" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none"/>  <text class="k" x="34" y="89">PLANE</text>  <text class="k" x="150" y="89">WHAT IT DECIDES</text>  <text class="k" x="430" y="89">FAILS ON</text>  <text class="k" x="620" y="89">VISIBLE AS</text>  <rect x="24" y="96" width="852" height="54" rx="3" fill="#f4f8ff" stroke="#eef2f8" stroke-width=".8"/>  <text class="b" x="34" y="118">控制面</text>  <text class="w" x="34" y="134">routing</text>  <text class="c" x="150" y="118">哪条路径“可宣告、可选”</text>  <text class="x" x="430" y="118">BFD 300 ms / BGP hold 180 s</text>  <text class="m" x="620" y="118">show bgp summary</text>  <rect x="24" y="158" width="852" height="54" rx="3" fill="#f3fbf9" stroke="#eef2f8" stroke-width=".8"/>  <text class="b" x="34" y="180">转发面</text>  <text class="w" x="34" y="196">forwarding</text>  <text class="c" x="150" y="180">包实际走哪条链路</text>  <text class="x" x="430" y="180">链路 down 立刻、路径坏不感知</text>  <text class="m" x="620" y="180">traceroute / 探针</text>  <rect x="24" y="220" width="852" height="54" rx="3" fill="#f8f5fe" stroke="#eef2f8" stroke-width=".8"/>  <text class="b" x="34" y="242">会话状态</text>  <text class="w" x="34" y="258">state</text>  <text class="c" x="150" y="242">这条 TCP/UDP 会话还能不能用</text>  <text class="x" x="430" y="242">NAT 超时 分钟级、FW 会话丢失</text>  <text class="m" x="620" y="242">用户报障</text>  <text class="b" x="24" y="300">The gap that produces the incident</text>  <text class="w" x="24" y="318">BGP converged does not mean the user recovered. Between them sit four independent clocks, each of which can outlast the routing change.</text>  <rect x="24" y="330" width="200" height="62" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="330" width="200" height="2.4" rx="3" fill="#d0564a" stroke="none"/>  <text class="b" x="34" y="350">NAT 重绑定</text>  <text class="w" x="34" y="364">旧映射随池切换失效</text>  <text class="c" x="34" y="382">耗时 30 s - 5 min</text>  <text class="k" x="226" y="366">+</text>  <rect x="240" y="330" width="200" height="62" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="240" y="330" width="200" height="2.4" rx="3" fill="#d99b2b" stroke="none"/>  <text class="b" x="250" y="350">防火墙会话</text>  <text class="w" x="250" y="364">非对称或状态丢失</text>  <text class="c" x="250" y="382">耗时 立即 - 直到超时</text>  <text class="k" x="442" y="366">+</text>  <rect x="456" y="330" width="200" height="62" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="456" y="330" width="200" height="2.4" rx="3" fill="#8b6bd0" stroke="none"/>  <text class="b" x="466" y="350">TCP 重传</text>  <text class="w" x="466" y="364">应用不重建连接</text>  <text class="c" x="466" y="382">耗时 1 - 3 s × 重试</text>  <text class="k" x="658" y="366">+</text>  <rect x="672" y="330" width="200" height="62" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="672" y="330" width="200" height="2.4" rx="3" fill="#4a7ee0" stroke="none"/>  <text class="b" x="682" y="350">应用/用户</text>  <text class="w" x="682" y="364">不重试、只刷新</text>  <text class="c" x="682" y="382">耗时 人决定</text>  <line x1="24" y1="410" x2="876" y2="410" stroke="#dfe6f1" stroke-width=".8"/>  <text class="x" x="24" y="430">The classic report: “BGP 已经切了，为什么用户还在报障” - because the control plane is the only plane you can see.</text>  <text class="w" x="24" y="452">Design response: make every clock explicit - BFD for control, IP SLA or probes for forwarding, and a documented session-clearing or</text>  <text class="w" x="24" y="466">fast-ageing policy for state. Then measure the sum, not the components.</text>
</svg>
