<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">A failure-behaviour matrix for the three access models: link, detection, device, gateway, control plane, change window, skill</title>
  <desc id="d15">A seven row comparison across the multitier STP model, routed access and switch clustering. Link failure: one uplink lost in STP, one uplink shed by ECMP, or a member port removed from the bundle. Detection: BPDU ageing of one to three seconds, BFD at fifty to two hundred milliseconds, or bundle removal under a second. Device failure: FHRP switchover of one to ten seconds with STP reconvergence, an IGP reconvergence with no gateway switchover, or one supervisor promoted. Gateway role: a separate FHRP process that must be aligned with the STP root, a distributed gateway on the access switch, or active-active on both members. Control-plane event: one STP domain, one bounded area, or both members at once with dual-active risk. Change window: per VLAN risk, per closet routing changes, or a single window for both members. Team skill: easy to configure and hard to debug, routing skill required, or easy to configure and opaque to debug.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="424" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">The three access models differ in what happens when something fails</text>  <text class="s" x="24" y="45">Compare them on one column at a time: a link dies, a box dies, a control-plane event, a change window.</text>  <rect x="24" y="86" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="101">Dimension</text>  <text class="k" x="206.79484173505276" y="101">Multitier STP</text>  <text class="k" x="432.5298944900352" y="101">Routed access</text>  <text class="k" x="658.2649472450175" y="101">Switch clustering</text>  <rect x="24" y="108" width="852" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="132">Link failure</text>  <text class="w" x="206.79484173505276" y="132">one uplink lost</text>  <text class="g" x="432.5298944900352" y="132">one uplink lost, ECMP sheds it</text>  <text class="g" x="658.2649472450175" y="132">member port removed from bundle</text>  <line x1="24" y1="140" x2="876" y2="140" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="140" width="852" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="164">Detection</text>  <text class="x" x="206.79484173505276" y="164">BPDU ageing 1-3 s, or link down</text>  <text class="g" x="432.5298944900352" y="164">BFD 50-200 ms</text>  <text class="g" x="658.2649472450175" y="164">bundle removal &lt;1 s</text>  <line x1="24" y1="172" x2="876" y2="172" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="172" width="852" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="196">Device failure</text>  <text class="x" x="206.79484173505276" y="196">FHRP switchover 1-10 s; STP reconverges</text>  <text class="g" x="432.5298944900352" y="196">IGP reconverges, no gateway switchover</text>  <text class="b" x="658.2649472450175" y="196">one control plane, one supervisor to promote</text>  <line x1="24" y1="204" x2="876" y2="204" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="204" width="852" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="228">Gateway role</text>  <text class="x" x="206.79484173505276" y="228">separate FHRP process, must be aligned with the root</text>  <text class="g" x="432.5298944900352" y="228">distributed, gateway is the access switch</text>  <text class="g" x="658.2649472450175" y="228">active-active on both members</text>  <line x1="24" y1="236" x2="876" y2="236" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="236" width="852" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="260">Control-plane event</text>  <text class="x" x="206.79484173505276" y="260">one STP domain, blast radius = the VLAN</text>  <text class="b" x="432.5298944900352" y="260">one area, query scope bounded</text>  <text class="x" x="658.2649472450175" y="260">both members at once: dual active risk</text>  <line x1="24" y1="268" x2="876" y2="268" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="268" width="852" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="32" y="292">Change window</text>  <text class="x" x="206.79484173505276" y="292">per-VLAN risk, any closet can affect the tree</text>  <text class="g" x="432.5298944900352" y="292">per-closet, routing is local</text>  <text class="b" x="658.2649472450175" y="292">both members, one window, one config</text>  <line x1="24" y1="300" x2="876" y2="300" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="300" width="852" height="32" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="32" y="324">Team skill needed</text>  <text class="x" x="206.79484173505276" y="324">low to configure, high to debug</text>  <text class="b" x="432.5298944900352" y="324">routing skill, clean design required</text>  <text class="x" x="658.2649472450175" y="324">low to configure, opaque to debug</text>  <line x1="24" y1="332" x2="876" y2="332" stroke="#eef2f8" stroke-width=".7"/>  <text class="b" x="24" y="372">The question to ask in a design review</text>  <text class="w" x="24" y="390">Not which model converges fastest. Ask: when the box that holds the gateway dies at 03:00, who diagnoses it, with what</text>  <text class="w" x="24" y="404">tooling, and how long until the first user calls? The model that shortens that path is the right one.</text>
</svg>
