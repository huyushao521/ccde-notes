<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">MED compared inside one neighbour AS versus ignored across two providers, with the four rules that decide its scope</title>
  <desc id="d15">Left diagram: an enterprise AS 65001 connects twice to ISP A, which is AS 64500, with MED 50 on the first link and MED 100 on the second, so the inbound path is selected towards the first; a third link goes to ISP B, AS 64501, with MED 10, which has no effect because the comparison never crosses a neighbour AS. Notes explain that always-compare-med would compare the distance units of two different providers, which is meaningless, and that MED is not propagated into a third AS. Right panel lists the four rules: the comparison happens only inside one neighbour AS, MED is by default not compared between different ASes, it is not propagated beyond the neighbour AS, and it works only if the other side selects on MED and does not rewrite it. A footer gives a working design with MED inside a single provider plus a monitor that verifies inbound traffic actually moved.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">MED is a hint, and by default it does not even cross a neighbour AS</text>  <text class="s" x="24" y="45">Two links into the same provider can be steered with MED. Two links into two providers cannot - the comparison never happens.</text>  <rect x="24" y="74" width="470" height="268" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="36" y="92">WHAT MED CAN DO</text>  <rect x="40" y="106" width="110" height="46" rx="3" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <text class="b" x="52" y="123">你的 AS</text>  <text class="c" x="52" y="135">65001</text>  <rect x="300" y="100" width="150" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="312" y="117">ISP-A · PE1</text>  <text class="c" x="312" y="129">AS 64500</text>  <rect x="300" y="160" width="150" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="312" y="177">ISP-A · PE2</text>  <text class="c" x="312" y="189">AS 64500</text>  <rect x="300" y="236" width="150" height="40" rx="3" fill="#fdf6f4" stroke="#f0d5cf" stroke-width=".8"/>  <text class="b" x="312" y="253">ISP-B · PE3</text>  <text class="c" x="312" y="265">AS 64501</text>  <line x1="150" y1="122" x2="300" y2="120" stroke="#29a08f" stroke-width="1.2" marker-end="url(#at)"/>  <line x1="150" y1="140" x2="300" y2="176" stroke="#29a08f" stroke-width="1.2" marker-end="url(#at)"/>  <line x1="150" y1="150" x2="300" y2="250" stroke="#d0564a" stroke-width="1.2" marker-end="url(#ar)"/>  <text class="m" x="160" y="112">MED 50</text>  <text class="m" x="160" y="168">MED 100</text>  <text class="m" x="160" y="222">MED 10</text>  <text class="g" x="40" y="176">同 AS 内比较：入向走 PE1</text>  <text class="w" x="40" y="192">两条链路属于同一邻居 AS 64500，</text>  <text class="w" x="40" y="204">MED 越小越优先，比较成立</text>  <text class="x" x="40" y="232">跨 AS 不比较：MED 10 完全无效</text>  <text class="w" x="40" y="246">PE3 与 PE1 不在同一邻居 AS，</text>  <text class="w" x="40" y="258">MED 连参与比较的资格都没有</text>  <text class="w" x="40" y="286">除非开启 always-compare-med - 那等于让</text>  <text class="w" x="40" y="298">两个运营商的距离单位互相比较，结论没有意义</text>  <text class="k" x="40" y="322">MED 默认不向第三个 AS 继续传递</text>  <rect x="508" y="74" width="368" height="268" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="520" y="92">THE FOUR RULES THAT DECIDE IT</text>  <rect x="520" y="102" width="344" height="20" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="528" y="115">Rule</text>  <text class="k" x="638.0" y="115">What it means</text>  <rect x="520" y="122" width="344" height="36" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="528" y="150">比较范围</text>  <text class="c" x="638.0" y="150">仅同一邻居 AS 内</text>  <line x1="520" y1="158" x2="864" y2="158" stroke="#eef2f8" stroke-width=".7"/>  <rect x="520" y="158" width="344" height="36" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="528" y="186">默认行为</text>  <text class="c" x="638.0" y="186">不比较不同 AS 的 MED</text>  <line x1="520" y1="194" x2="864" y2="194" stroke="#eef2f8" stroke-width=".7"/>  <rect x="520" y="194" width="344" height="36" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="528" y="222">传递范围</text>  <text class="c" x="638.0" y="222">不出邻居 AS，不进第三个 AS</text>  <line x1="520" y1="230" x2="864" y2="230" stroke="#eef2f8" stroke-width=".7"/>  <rect x="520" y="230" width="344" height="36" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="528" y="258">生效前提</text>  <text class="c" x="638.0" y="258">对方按 MED 选路，且未改值</text>  <line x1="520" y1="266" x2="864" y2="266" stroke="#eef2f8" stroke-width=".7"/>  <text class="b" x="520" y="268">So what does steer inbound across providers?</text>  <text class="w" x="520" y="286">- 主备：只在一个出口宣告（最强）</text>  <text class="w" x="520" y="300">- PI /24：让长掩码与本地偏好起作用</text>  <text class="w" x="520" y="314">- community：需要对方按合同执行</text>  <text class="w" x="520" y="328">- prepend：对方比较 AS 路径长度时才有效</text>  <line x1="24" y1="356" x2="876" y2="356" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="376">A working design that uses MED correctly</text>  <text class="w" x="24" y="394">Both links terminate in the same provider: MED 50 on the primary, MED 100 on the backup, both PREPENDed equally, and a monitor that</text>  <text class="w" x="24" y="408">watches whether inbound traffic actually moved - because a provider may normalise MED at its own boundary.</text>  <text class="x" x="24" y="432">Never let MED be the only mechanism across two providers: if the secondary path is the one you need, announce it and test it.</text>
</svg>
