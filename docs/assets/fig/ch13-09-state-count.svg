<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 478" width="100%" role="img" aria-labelledby="c13f9t c13f9d">
  <title id="c13f9t">组播的瓶颈是状态数量：切 SPT 与保留共享树的状态量差两个数量级</title>
  <desc id="c13f9d">先给出状态估算式：(S,G) 条数约等于组数 × 源数 × 有接收者的 LHR 数。同一业务下对比两种设计：默认切 SPT 时 500 组 × 4 源 × 30 台 LHR 约 6 万条状态，远超常见硬件表容量；保留共享树时每台 LHR 只有 500 条 (*,G)。底部给出状态爆炸的三个信号与四种修法。</desc>
  <style>
    .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .lb{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
    .f{font:600 12px "Microsoft YaHei",sans-serif;fill:#1f4fc0}
    .b{font:9px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .n{font:9px "Segoe UI",sans-serif;fill:#1a2233}
    .g{font:8.5px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .c{font:9px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .r{font:9px "Microsoft YaHei",sans-serif;fill:#a32020}
    .rt{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
    .big{font:600 20px "Segoe UI",sans-serif;fill:#a32020}
    .bigg{font:600 20px "Segoe UI",sans-serif;fill:#0f7f73}
  </style>
  <rect x="0" y="0" width="960" height="478" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">先算状态，再算带宽：组播通常先撞"状态墙"</text>
  <text class="s" x="24" y="48">带宽是"每个瞬间"的成本，状态是"每一条 (S,G)"的长期占用；后者决定设备能不能活过业务扩张</text>

  <rect x="24" y="62" width="912" height="46" rx="8" fill="#eef3ff" stroke="#b9cffb"/>
  <text class="f" x="40" y="92">(S,G) 条数 ≈ 组数 × 源数 × 有接收者的 LHR 数　　（每条还要乘出接口数）</text>
  <text class="b" x="694" y="92">保守估算，用于选型与评审</text>

  <rect x="24" y="120" width="446" height="176" rx="8" fill="#fff" stroke="#e8c4c4"/>
  <text class="rt" x="44" y="142">设计 A：默认切 SPT（每接收者一条源树）</text>
  <text class="b" x="44" y="166">500 个频道 × 4 个源 × 30 台 LHR</text>
  <text class="big" x="44" y="204">≈ 60 000 条 (S,G)</text>
  <text class="b" x="44" y="228">再加上每条 (S,G) 的出接口条目，实际硬件表项更多</text>
  <text class="r" x="44" y="250">常见接入/汇聚平台组播表容量在 2k–8k 量级</text>
  <text class="r" x="44" y="268">→ 表满后：新组加不进来、换台 10 秒、CPU 60%</text>
  <text class="g" x="44" y="286">症状与"带宽不足"几乎一样，容易误判（案例五）</text>

  <rect x="490" y="120" width="446" height="176" rx="8" fill="#fff" stroke="#bcd6d1"/>
  <text class="lb" x="510" y="142" style="fill:#0f7f73">设计 B：保留共享树（spt-threshold infinity）</text>
  <text class="b" x="510" y="166">500 个频道 × 30 台 LHR，只有 (*,G)</text>
  <text class="bigg" x="510" y="204">≈ 15 000 条 (*,G)</text>
  <text class="b" x="510" y="228">每台 LHR 约 500 条；核心只承载星形共享树</text>
  <text class="c" x="510" y="250">状态量从"接收者×源"降为"组数"，可预测</text>
  <text class="c" x="510" y="268">代价：RP 承载全部流量，路径变长（时延升高）</text>
  <text class="g" x="510" y="286">适合：频道极多、单频道码率低、接收者海量（行情）</text>

  <rect x="24" y="308" width="446" height="112" rx="6" fill="#fff" stroke="#d7e0ec"/>
  <text class="rt" x="44" y="328" style="fill:#b06a00">状态爆炸的三个信号</text>
  <text class="b" x="44" y="350">① 核心设备 CPU 持续 50%+，且与转发量不成比例</text>
  <text class="b" x="44" y="368">② 频道切换（换台）从百毫秒级退化到数秒</text>
  <text class="b" x="44" y="386">③ show ip mroute 输出超时、表项出现"抖动/重建"</text>
  <text class="g" x="44" y="406">先看表容量与 (S,G) 数，不要先怀疑带宽</text>

  <rect x="490" y="308" width="446" height="112" rx="6" fill="#fff" stroke="#d7e0ec"/>
  <text class="lb" x="510" y="328" style="fill:#0f7f73">四种修法（按优先级）</text>
  <text class="b" x="510" y="350">① 改 SSM：去掉 RP 与共享树，按需建 (S,G)</text>
  <text class="b" x="510" y="368">② 保留共享树：对"大量小频道"关掉 SPT 切换</text>
  <text class="b" x="510" y="386">③ 分区 / 多 RP：把状态按区域切给不同设备</text>
  <text class="b" x="510" y="404">④ 换平台：把组播表容量作为选型硬指标</text>

  <text class="r" x="24" y="446">设计含义：组播设计的评审表里必须有一行"预计 (S,G) 峰值 / 平台容量"，没有这一行的方案，扩到第二年一定会撞墙。</text>
  <text class="g" x="24" y="464">取证：show ip mroute summary（条目数）· show platform ... mcast（硬件表）· show processes cpu sorted（进程占用）</text>
</svg>
