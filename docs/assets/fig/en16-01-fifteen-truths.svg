    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="490" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Chapter 16 in fifteen claims: an internet edge fails in the order you forgot to design</text>  <text class="s" x="24" y="45">Degradation, control plane, session state, trust, capacity - five families, each with its own way of failing quietly.</text>  <rect x="24" y="72" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="72" width="2.6" height="58" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="36" y="91" font-size="11" fill="#4a7ee0">01</text>  <text class="c" x="64" y="89">出口失效时业务如何降级，</text>  <text class="c" x="64" y="102">才是边缘设计的第一性问题</text>  <text class="k" x="36" y="120">降级与冗余</text>  <rect x="312" y="72" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="312" y="72" width="2.6" height="58" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="324" y="91" font-size="11" fill="#4a7ee0">02</text>  <text class="c" x="352" y="89">双 ISP 不等于双路径：</text>  <text class="c" x="352" y="102">光缆、井道、机柜、设备处处共享</text>  <text class="k" x="324" y="120">降级与冗余</text>  <rect x="600" y="72" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="600" y="72" width="2.6" height="58" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="612" y="91" font-size="11" fill="#29a08f">03</text>  <text class="c" x="640" y="89">BGP 只解决可达性与选路，</text>  <text class="c" x="640" y="102">不解决会话能否活下来</text>  <text class="k" x="612" y="120">选路与宣告</text>  <rect x="24" y="138" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="138" width="2.6" height="58" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="36" y="157" font-size="11" fill="#29a08f">04</text>  <text class="c" x="64" y="155">出向相对容易（自己的路由表），</text>  <text class="c" x="64" y="168">入向几乎做不到（别人的路由表）</text>  <text class="k" x="36" y="186">选路与宣告</text>  <rect x="312" y="138" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="312" y="138" width="2.6" height="58" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="324" y="157" font-size="11" fill="#29a08f">05</text>  <text class="c" x="352" y="155">MED 是暗示不是指令，</text>  <text class="c" x="352" y="168">默认连暗示都不跨邻居 AS</text>  <text class="k" x="324" y="186">选路与宣告</text>  <rect x="600" y="138" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="600" y="138" width="2.6" height="58" rx="1" fill="#8b6bd0" stroke="none"/>  <text class="B" x="612" y="157" font-size="11" fill="#8b6bd0">06</text>  <text class="c" x="640" y="155">非对称的根因是路径上的状态设备，</text>  <text class="c" x="640" y="168">不是路由协议选错了</text>  <text class="k" x="612" y="186">会话状态</text>  <rect x="24" y="204" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="204" width="2.6" height="58" rx="1" fill="#8b6bd0" stroke="none"/>  <text class="B" x="36" y="223" font-size="11" fill="#8b6bd0">07</text>  <text class="c" x="64" y="221">NAT 是边缘最被低估的状态，</text>  <text class="c" x="64" y="234">也是最常被忘记的断点</text>  <text class="k" x="36" y="252">会话状态</text>  <rect x="312" y="204" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="312" y="204" width="2.6" height="58" rx="1" fill="#d99b2b" stroke="none"/>  <text class="B" x="324" y="223" font-size="11" fill="#d99b2b">08</text>  <text class="c" x="352" y="221">路由邻居穿防火墙是常态，</text>  <text class="c" x="352" y="234">但洞必须显式开、显式注释</text>  <text class="k" x="324" y="252">信任与攻击</text>  <rect x="600" y="204" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="600" y="204" width="2.6" height="58" rx="1" fill="#d99b2b" stroke="none"/>  <text class="B" x="612" y="223" font-size="11" fill="#d99b2b">09</text>  <text class="c" x="640" y="221">DMZ 不是一个 VLAN，</text>  <text class="c" x="640" y="234">而是“一个信任等级 + 唯一一条路径”</text>  <text class="k" x="612" y="252">信任与攻击</text>  <rect x="24" y="270" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="270" width="2.6" height="58" rx="1" fill="#d0564a" stroke="none"/>  <text class="B" x="36" y="289" font-size="11" fill="#d0564a">10</text>  <text class="c" x="64" y="287">默认路由不是设计，是最后手段：</text>  <text class="c" x="64" y="300">链路 up 不等于路径可用</text>  <text class="k" x="36" y="318">检测与容量</text>  <rect x="312" y="270" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="312" y="270" width="2.6" height="58" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="324" y="289" font-size="11" fill="#29a08f">11</text>  <text class="c" x="352" y="287">公网前缀可聚合性（PA/PI）</text>  <text class="c" x="352" y="300">决定入向是否可运维</text>  <text class="k" x="324" y="318">选路与宣告</text>  <rect x="600" y="270" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="600" y="270" width="2.6" height="58" rx="1" fill="#d99b2b" stroke="none"/>  <text class="B" x="612" y="289" font-size="11" fill="#d99b2b">12</text>  <text class="c" x="640" y="287">DDoS 第一道防线在运营商侧，</text>  <text class="c" x="640" y="300">不在机房那台防火墙</text>  <text class="k" x="612" y="318">信任与攻击</text>  <rect x="24" y="336" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="24" y="336" width="2.6" height="58" rx="1" fill="#d99b2b" stroke="none"/>  <text class="B" x="36" y="355" font-size="11" fill="#d99b2b">13</text>  <text class="c" x="64" y="353">IPv4 用 NAT 掩盖暴露面，</text>  <text class="c" x="64" y="366">IPv6 必须显式写下默认拒绝</text>  <text class="k" x="36" y="384">信任与攻击</text>  <rect x="312" y="336" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="312" y="336" width="2.6" height="58" rx="1" fill="#d0564a" stroke="none"/>  <text class="B" x="324" y="355" font-size="11" fill="#d0564a">14</text>  <text class="c" x="352" y="353">VPN 头端是容量 + 状态问题，</text>  <text class="c" x="352" y="366">不是加密强度问题</text>  <text class="k" x="324" y="384">检测与容量</text>  <rect x="600" y="336" width="276" height="58" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <rect x="600" y="336" width="2.6" height="58" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="612" y="355" font-size="11" fill="#4a7ee0">15</text>  <text class="c" x="640" y="353">可用性 = 出口数 × 状态同步 × 检测，</text>  <text class="c" x="640" y="366">缺一项就是单点</text>  <text class="k" x="612" y="384">降级与冗余</text>  <line x1="24" y1="412" x2="876" y2="412" stroke="#dfe6f1" stroke-width=".8"/>  <text class="w" x="24" y="432">Read the chapter in this order and the incidents in section 9 stop arriving in this order: degradation first, then control plane,</text>  <text class="w" x="24" y="446">then state, then trust, then capacity - because each later family can only be designed on top of the earlier one.</text>  <text class="g" x="24" y="468">Every claim below is a design decision with a cost, not a slogan: the cost is what the following sections quantify.</text>
</svg>
