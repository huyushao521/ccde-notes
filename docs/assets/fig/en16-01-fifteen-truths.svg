<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Fifteen claims about the enterprise internet edge, grouped into five families of failure</title>
  <desc id="d15">A three-by-five grid of fifteen numbered claims, colour-coded by family. Degradation and redundancy: the first-order question is how the business degrades when an exit fails; dual ISP does not mean dual path because fibre, ducts, racks and devices are shared; availability equals exits multiplied by state synchronisation multiplied by detection. Control plane and routing: BGP solves reachability and path selection but not session survival; outbound is relatively easy because it is your own routing table while inbound is nearly impossible because it is someone else's; MED is a hint and by default does not even cross a neighbouring AS; public prefix aggregability decides whether inbound is operable at all. Session state: the root cause of asymmetry is the stateful device on the path, not the routing protocol; NAT is the most under-estimated state at the edge. Trust and attack: routing neighbours across a firewall are normal but the holes must be explicit and commented; a DMZ is a trust level with one path rather than a VLAN; the first line of DDoS defence is upstream at the provider; IPv4 hides exposure behind NAT while IPv6 requires an explicit default deny. Detection and capacity: a default route is a last resort because link up is not path usable; a VPN headend is a capacity and state problem, not an encryption strength problem.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
