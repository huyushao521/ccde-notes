<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The three-tier edge structure of edge distribution, firewall and DMZ, and edge routers, with what each layer should and should not do</title>
  <desc id="d15">Topology: an edge distribution layer aggregates the edge devices and joins the campus core while running the interior gateway protocol and first hop redundancy; below it two firewall and DMZ devices perform inspection, IPS, VPN termination, inbound publication and micro-segmentation in active standby or cluster form; below them two edge routers run eBGP, NAT and egress policing towards ISP A and ISP B. Running BGP directly to the internet on the firewall or distribution layer couples internet policy to internal routing and mixes the failure domains. A table gives each layer its job and its prohibition: the edge router does eBGP peering, prefix filtering, NAT, egress rate limiting and marking and reverse path forwarding but no application-layer policy or stateful inspection; the firewall does stateful inspection, IPS, inbound publication, VPN termination and micro-segmentation but not all the NAT if the edge already does it; the edge distribution aggregates devices and holds the interior gateway and first hop boundary but never runs BGP to the internet.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">The three edge layers, and the one thing each of them must not do</text>  <text class="s" x="24" y="45">Edge distribution decouples internet policy from internal routing; the firewall owns state; the edge router keeps its control plane simple.</text>  <rect x="24" y="74" width="430" height="254" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="36" y="92">THE BOOK'S THREE-TIER EDGE</text>  <rect x="44" y="102" width="390" height="40" rx="3" fill="#f2f6fd" stroke="#c9dcfb" stroke-width=".8"/>  <text class="b" x="56" y="120">Edge distribution</text>  <text class="w" x="56" y="134">aggregates edge devices, joins campus core, runs IGP / FHRP</text>  <line x1="120" y1="142" x2="120" y2="158" stroke="#9fb3d1" stroke-width="1"/>  <line x1="358" y1="142" x2="358" y2="158" stroke="#9fb3d1" stroke-width="1"/>  <rect x="52" y="158" width="170" height="44" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="b" x="62" y="176">Firewall / DMZ</text>  <text class="w" x="62" y="190">inspection, IPS, VPN</text>  <text class="w" x="62" y="198">publication, micro-segmentation</text>  <rect x="266" y="158" width="178" height="44" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="b" x="276" y="176">Firewall / DMZ (2nd)</text>  <text class="w" x="276" y="190">active / standby or cluster</text>  <line x1="100" y1="202" x2="100" y2="216" stroke="#9fb3d1" stroke-width="1"/>  <line x1="180" y1="202" x2="180" y2="216" stroke="#9fb3d1" stroke-width="1"/>  <line x1="300" y1="202" x2="300" y2="216" stroke="#9fb3d1" stroke-width="1"/>  <line x1="400" y1="202" x2="400" y2="216" stroke="#9fb3d1" stroke-width="1"/>  <rect x="52" y="216" width="128" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="62" y="234">Edge router A</text>  <text class="w" x="62" y="248">eBGP, NAT, police</text>  <rect x="316" y="216" width="128" height="40" rx="3" fill="#f4f8ff" stroke="#c9d8f6" stroke-width=".8"/>  <text class="b" x="326" y="234">Edge router B</text>  <text class="w" x="326" y="248">eBGP, NAT, police</text>  <text class="m" x="96" y="272">ISP-A</text>  <text class="m" x="140" y="272">ISP-B</text>  <text class="m" x="360" y="272">ISP-A</text>  <text class="m" x="404" y="272">ISP-B</text>  <line x1="116" y1="256" x2="106" y2="268" stroke="#9fb3d1" stroke-width=".9" marker-end="url(#ag)"/>  <line x1="160" y1="256" x2="152" y2="268" stroke="#9fb3d1" stroke-width=".9" marker-end="url(#ag)"/>  <line x1="380" y1="256" x2="372" y2="268" stroke="#9fb3d1" stroke-width=".9" marker-end="url(#ag)"/>  <line x1="424" y1="256" x2="416" y2="268" stroke="#9fb3d1" stroke-width=".9" marker-end="url(#ag)"/>  <text class="x" x="44" y="300">BGP 直接对互联网跑在防火墙或分布层上 →</text>  <text class="w" x="44" y="314">互联网策略与内部路由耦合，故障域混在一起</text>  <text class="k" x="500" y="92">WHAT EACH LAYER SHOULD AND SHOULD NOT DO</text>  <rect x="500" y="100" width="376" height="20" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="508" y="113">层</text>  <text class="k" x="584.0" y="113">该做</text>  <text class="k" x="760.0" y="113">不该做</text>  <rect x="500" y="120" width="376" height="48" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="508" y="160">边缘路由器</text>  <text class="c" x="584.0" y="160">eBGP 对等、前缀过滤、NAT、出口限速与标记、uRPF</text>  <text class="c" x="760.0" y="160">应用层策略、状态检测</text>  <line x1="500" y1="168" x2="876" y2="168" stroke="#eef2f8" stroke-width=".7"/>  <rect x="500" y="168" width="376" height="48" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="508" y="208">防火墙 / DMZ</text>  <text class="c" x="584.0" y="208">状态检测、IPS、入向发布、VPN 终结、微分段</text>  <text class="c" x="760.0" y="208">承担全部 NAT（若边缘已做）</text>  <line x1="500" y1="216" x2="876" y2="216" stroke="#eef2f8" stroke-width=".7"/>  <rect x="500" y="216" width="376" height="48" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="508" y="256">边缘分布层</text>  <text class="c" x="584.0" y="256">聚合边缘设备、接核心、FHRP/IGP 边界</text>  <text class="c" x="760.0" y="256">直接对互联网跑 BGP</text>  <line x1="500" y1="264" x2="876" y2="264" stroke="#eef2f8" stroke-width=".7"/>  <text class="b" x="500" y="286">One rule that resolves the arguments</text>  <text class="w" x="500" y="304">NAT 只做一处。两处 NAT = 状态双份、</text>  <text class="w" x="500" y="318">排障翻倍、日志对不上。</text>  <text class="x" x="500" y="340">“双活”只在状态能同步时才成立；</text>  <text class="w" x="500" y="354">否则只是两台都在转发、故障各丢一半</text>  <line x1="24" y1="368" x2="876" y2="368" stroke="#dfe6f1" stroke-width=".8"/>  <text class="w" x="24" y="388">The layering exists to give each failure a clean owner: internet policy lives on two routers, inspection and state live on two firewalls, and</text>  <text class="w" x="24" y="402">the internal routing domain never has to know that the internet exists. Merge any two layers and the next incident has two suspects instead of one.</text>
</svg>
