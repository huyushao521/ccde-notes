<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" width="100%" role="img" aria-labelledby="t914 d914">
  <title id="t914">How the DN bit stops a re-injection loop, and what a domain ID mismatch does instead</title>
  <desc id="d914">Upper panel shows the loop being prevented in four steps: a prefix is learned from OSPF at site A, exported into MP-BGP, imported at site B and originated into OSPF with the DN bit set; when that route tries to return to the PE it came from, the receiving PE sees the DN bit and refuses to re-export it. Lower panel shows the failure when two PEs use different domain IDs: the PE that does not recognise the domain ignores the DN bit, re-exports the route, the two copies compete, and the route flaps between the two PEs indefinitely. A right-hand panel gives the three-line check used to confirm the setting. A closing note says the domain ID is configuration, not negotiation, so nothing will reconcile a mismatch automatically.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .r{font:600 7.5px "Segoe UI",sans-serif;fill:#1a2233}
  </style>
  <rect x="0" y="0" width="900" height="386" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">One bit, set once, prevents the same prefix being re-imported in a circle</text>
  <text class="s" x="24" y="45">The DN bit is not a loop-prevention feature of OSPF; it is a marker that says &#8220;a PE already carried this&#8221;</text>

  <rect x="24" y="60" width="852" height="24" rx="2" fill="#f5fdfa" stroke="#bfe3de" stroke-width=".6"/>
  <text class="b" x="36" y="77" fill="#0f7f73">WHEN THE DOMAIN IDS MATCH &#8212; THE LOOP IS BROKEN AT STEP 4</text>

  <rect x="24" y="94" width="190" height="56" rx="2" fill="#fff" stroke="#0f7f73" stroke-width=".6"/>
  <text class="c" x="36" y="112">1. CE1 announces 10.5.0.0/16</text>
  <text class="c" x="36" y="126">into OSPF at PE1.</text>
  <text class="w" x="36" y="142">normal OSPF, no marker yet</text>

  <rect x="230" y="94" width="190" height="56" rx="2" fill="#fff" stroke="#0f7f73" stroke-width=".6"/>
  <text class="c" x="242" y="112">2. PE1 exports it into</text>
  <text class="c" x="242" y="126">MP-BGP as VPNv4.</text>
  <text class="w" x="242" y="142">RD + RT + VPN label</text>

  <rect x="436" y="94" width="190" height="56" rx="2" fill="#fff" stroke="#0f7f73" stroke-width=".6"/>
  <text class="c" x="448" y="112">3. PE2 imports it and</text>
  <text class="c" x="448" y="126">re-originates into OSPF.</text>
  <text class="c" x="448" y="142" fill="#0f7f73">the DN bit is set here</text>

  <rect x="642" y="94" width="234" height="56" rx="2" fill="#fff8f7" stroke="#c0392b" stroke-width=".8"/>
  <text class="c" x="654" y="112" fill="#c0392b">4. The route reaches PE1 again.</text>
  <text class="c" x="654" y="126" fill="#c0392b">PE1 sees DN=1, refuses to export.</text>
  <text class="c" x="654" y="142" fill="#c0392b" style="font-weight:700">Loop stops because nobody re-imports.</text>

  <rect x="24" y="164" width="852" height="24" rx="2" fill="#fdf9f0" stroke="#e6d3a8" stroke-width=".6"/>
  <text class="b" x="36" y="181" fill="#7a5b18">WHEN THE DOMAIN IDS DIFFER &#8212; THE LOOP RESTARTS EVERY FEW SECONDS</text>

  <rect x="24" y="198" width="196" height="56" rx="2" fill="#fff" stroke="#c99a2e" stroke-width=".6"/>
  <text class="c" x="36" y="216">PE1 domain ID 65000:1</text>
  <text class="c" x="36" y="230">PE2 domain ID 65000:2</text>
  <text class="w" x="36" y="246">configured, not negotiated</text>

  <rect x="236" y="198" width="196" height="56" rx="2" fill="#fff" stroke="#c99a2e" stroke-width=".6"/>
  <text class="c" x="248" y="216">A DN bit set in a domain</text>
  <text class="c" x="248" y="230">the receiver does not own</text>
  <text class="w" x="248" y="246">is not honoured as &#8220;mine&#8221;</text>

  <rect x="448" y="198" width="196" height="56" rx="2" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <text class="c" x="460" y="216" fill="#c0392b">So the route is imported again</text>
  <text class="c" x="460" y="230" fill="#c0392b">and exported again &#8212; two copies</text>
  <text class="c" x="460" y="246" fill="#c0392b">of the same prefix now compete</text>

  <rect x="660" y="198" width="216" height="56" rx="2" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <text class="c" x="672" y="216" fill="#c0392b">Result: the prefix flaps, then</text>
  <text class="c" x="672" y="230" fill="#c0392b">stabilises on the worse path</text>
  <text class="c" x="672" y="246" fill="#c0392b">after the timers exhaust themselves.</text>

  <rect x="24" y="270" width="420" height="70" rx="2" fill="#f8fbff" stroke="#d6e0ee" stroke-width=".6"/>
  <text class="b" x="36" y="288">The three-line check</text>
  <text class="c" x="36" y="306">1. Read the domain ID on every PE in the VPN.</text>
  <text class="c" x="36" y="320">2. Confirm the remote prefix shows DN=1 in the OSPF database.</text>
  <text class="c" x="36" y="334">3. Compare the two: if either is wrong, this is the fault.</text>

  <rect x="460" y="270" width="416" height="70" rx="2" fill="#f7f9fd" stroke="#c3d5f2" stroke-width=".6"/>
  <text class="b" x="472" y="288">Why this bites late</text>
  <text class="c" x="472" y="306">A single-PE-per-site design has nothing to mismatch, so the setting is copied without</text>
  <text class="c" x="472" y="320">thought. It only matters when a site becomes dual-homed and two PEs start advertising</text>
  <text class="c" x="472" y="334">the same prefix &#8212; which is exactly when the network is already in a change window.</text>

  <rect x="24" y="352" width="852" height="26" rx="3" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <rect x="24" y="352" width="4" height="26" fill="#c0392b"/>
  <text class="w" x="40" y="369" fill="#c0392b">Put the domain ID in the VRF table of the design document next to the RD and RTs. It is a per-VPN constant, and it has no default that will save you.</text>
</svg>
