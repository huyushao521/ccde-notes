<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="100%" role="img" aria-labelledby="c13f19t c13f19d">
  <title id="c13f19t">共享树到源树（SPT）切换的时序、短暂重叠与三种策略</title>
  <desc id="c13f19d">时间轴给出五个时刻：发出 (*,G) Join、首包沿共享树到达、发出 (S,G) Join、发 rpt-prune 剪断共享树、进入只剩 (S,G) 的稳态。每个时刻标注 mroute 状态变化，并说明切换过程中存在约 100 至 200 毫秒的双份包窗口。底部对比默认切换、保留共享树、按组设阈值三种策略的代价。</desc>
  <style>
    .h{font:600 13px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .k{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#1a2233}
    .b{font:9px "Microsoft YaHei",sans-serif;fill:#4a5a72}
    .n{font:8.5px "Consolas",monospace;fill:#1f4fc0}
    .g{font:8.5px "Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .c{font:9px "Microsoft YaHei",sans-serif;fill:#0f7f73}
    .r{font:9px "Microsoft YaHei",sans-serif;fill:#a32020}
    .rt{font:600 9.5px "Microsoft YaHei",sans-serif;fill:#a32020}
  </style>
  <defs>
    <marker id="a191" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="484" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">SPT 切换不是"瞬时"的：中间有一段"两份都在收"的窗口</text>
  <text class="s" x="24" y="48">PIM 必须先收到源树上的第一个包，才敢剪共享树——所以切换期必然短暂重叠，这是设计上要预留的余量</text>

  <rect x="24" y="66" width="912" height="196" rx="8" fill="#fff" stroke="#d7e0ec"/>
  <line x1="70" y1="150" x2="900" y2="150" stroke="#8494a8" stroke-width="1.4" marker-end="url(#a191)"/>
  <circle cx="110" cy="150" r="5" fill="#2f6fed"/>
  <circle cx="290" cy="150" r="5" fill="#2f6fed"/>
  <circle cx="470" cy="150" r="5" fill="#0f7f73"/>
  <circle cx="650" cy="150" r="5" fill="#b06a00"/>
  <circle cx="840" cy="150" r="5" fill="#0f7f73"/>
  <text class="g" x="110" y="170" text-anchor="middle">t0</text>
  <text class="g" x="290" y="170" text-anchor="middle">t1</text>
  <text class="g" x="470" y="170" text-anchor="middle">t2</text>
  <text class="g" x="650" y="170" text-anchor="middle">t3</text>
  <text class="g" x="840" y="170" text-anchor="middle">t4 稳态</text>

  <text class="k" x="44" y="96">t0　LHR 发出 (*,G) Join</text>
  <text class="b" x="44" y="114">沿路建共享树，RP 是根</text>
  <text class="n" x="44" y="132">(*,G) IIF=RP 方向 OIL=下游</text>

  <text class="k" x="240" y="96">t1　首包沿共享树到达</text>
  <text class="b" x="240" y="114">出现 (S,G)，带 RPT 位</text>
  <text class="n" x="240" y="132">(S,G) flag S,C, rpt</text>

  <text class="k" x="420" y="96">t2　发 (S,G) Join 至源</text>
  <text class="b" x="420" y="114">源树建好，首包从源树到</text>
  <text class="n" x="420" y="132">(S,G) IIF=朝源方向</text>

  <text class="k" x="600" y="96">t3　发 rpt-prune 给 RP</text>
  <text class="b" x="600" y="114">剪断共享树分支</text>
  <text class="n" x="600" y="132">(*,G) OIL 清空 → 删除</text>

  <text class="k" x="740" y="96">t4　只剩 (S,G)</text>
  <text class="b" x="740" y="114">RP 与共享树上不再有流量</text>
  <text class="n" x="740" y="132">(S,G) 去 rpt 位</text>

  <rect x="420" y="188" width="230" height="26" rx="4" fill="#fff4e5" stroke="#b06a00"/>
  <text class="r" x="535" y="205" text-anchor="middle" style="fill:#b06a00">t2 → t3 重叠窗口：约 100–200 ms 双份包</text>
  <text class="g" x="662" y="205">（接收端靠 RTP 序号去重，丢包敏感业务要预留）</text>

  <rect x="24" y="278" width="292" height="130" rx="6" fill="#fff" stroke="#e8c4c4"/>
  <text class="rt" x="40" y="298">策略 A：默认切换（阈值为 0）</text>
  <text class="b" x="40" y="320">每个接收者都切到源树</text>
  <text class="b" x="40" y="338">路径最短、时延最低</text>
  <text class="r" x="40" y="360">代价：状态量 = 接收者 × 源</text>
  <text class="r" x="40" y="378">适合：频道少、接收者少的场景</text>
  <text class="g" x="40" y="398">典型：企业内部十几个高清频道</text>

  <rect x="334" y="278" width="292" height="130" rx="6" fill="#fff" stroke="#bcd6d1"/>
  <text class="k" x="350" y="298" style="fill:#0f7f73">策略 B：保留共享树（infinity）</text>
  <text class="b" x="350" y="320">永不切换，全部走 RP 星形</text>
  <text class="c" x="350" y="342">状态量 = 组数，可预测、可扩容</text>
  <text class="r" x="350" y="364">代价：路径变长、RP 成为带宽与 CPU 瓶颈</text>
  <text class="r" x="350" y="382">适合：海量小频道 + 海量接收者（行情/监控）</text>

  <rect x="644" y="278" width="292" height="130" rx="6" fill="#fff" stroke="#d7e0ec"/>
  <text class="k" x="658" y="298">策略 C：按组设阈值（折中）</text>
  <text class="b" x="658" y="320">高码率组切源树、小频道留共享树</text>
  <text class="c" x="658" y="342">用 group-list 精确控制</text>
  <text class="b" x="658" y="364">代价：配置复杂、需要地址规划支撑</text>
  <text class="b" x="658" y="382">适合：混合业务（会议 + IPTV + 监控）</text>
  <text class="g" x="658" y="398">前提：地址按业务分块（否则无法按组下发）</text>

  <text class="r" x="24" y="436">设计含义：切换策略必须与地址规划联合设计。没有"按业务分块的地址"，就没有"按组设阈值"这种精度——这也是地址规划排在前面的原因。</text>
  <text class="g" x="24" y="454">观察：show ip mroute 中的 RPT 位从出现到消失的时间，就是切换耗时；若长期存在说明切换未完成（常见于源不可达）。</text>
  <text class="g" x="24" y="472">SSM 场景不存在这一步：没有共享树，所以没有切换、也没有双份包窗口。</text>
</svg>
