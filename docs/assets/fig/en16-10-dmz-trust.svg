<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Three trust levels with one-way rules into the DMZ, three ways to publish a service and the layered skeleton behind a public service</title>
  <desc id="d15">Left: internet, DMZ and internal form three trust levels with two one-way rules - inbound may reach only the DMZ, and the DMZ may not cross into the internal network without a whitelisted exception with logging; the value of the DMZ is the answer to what a compromised host inside it can reach, and if the answer is everything it is only a VLAN. Right: three ways to publish a service - directly in the DMZ with the lowest cost but the application itself as the exposure surface, a reverse proxy in front so the public side only reaches the proxy and WAF, rate limiting and source hiding become possible, or cloud scrubbing with origin protection through DNS or a CDN pointing at a scrubbing centre with origin whitelisting, which costs most and survives volumetric attacks. A skeleton shows DNS, CDN or WAF, reverse proxy, application and data, with the note that each layer shrinks exposure and adds latency and cost.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="426" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">A DMZ is a trust level with exactly one path, not a VLAN with a nice name</text>  <text class="s" x="24" y="45">Its value is not the segment. It is the answer to one question: what can a compromised host in it reach inside?</text>  <text class="k" x="24" y="76">THREE TRUST LEVELS, TWO ONE-WAY RULES</text>  <rect x="40" y="92" width="300" height="60" rx="3" fill="#fdf6f4" stroke="#f0d5cf" stroke-width=".8"/>  <text class="b" x="52" y="110">互联网</text>  <text class="w" x="52" y="126">不可信，永远假设已被扫描</text>  <rect x="90" y="168" width="200" height="56" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <text class="b" x="102" y="186">DMZ</text>  <text class="w" x="102" y="202">只放必须被访问的</text>  <text class="w" x="102" y="214">服务；无内网发起</text>  <rect x="40" y="240" width="300" height="70" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="b" x="52" y="258">内网</text>  <text class="w" x="52" y="274">用户、数据库、域控</text>  <text class="w" x="52" y="288">DMZ 不得主动到内网</text>  <text class="x" x="52" y="302">唯一例外需白名单 + 日志</text>  <line x1="190" y1="152" x2="190" y2="168" stroke="#d0564a" stroke-width="1.2" marker-end="url(#ar)" marker-start="url(#ar)"/>  <text class="w" x="198" y="164">入向只能到 DMZ</text>  <line x1="190" y1="224" x2="190" y2="240" stroke="#d0564a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>  <text class="x" x="198" y="236">禁止横穿</text>  <line x1="52" y1="160" x2="100" y2="168" stroke="#d0564a" stroke-width="1"/>  <line x1="330" y1="160" x2="280" y2="168" stroke="#d0564a" stroke-width="1"/>  <text class="w" x="40" y="330">DMZ 的价值 = 受损后“能到内网什么”</text>  <text class="w" x="40" y="344">如果答案是“全部”，那它只是一个 VLAN</text>  <rect x="370" y="92" width="506" height="244" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="382" y="110">THREE WAYS TO PUBLISH A SERVICE</text>  <rect x="382" y="118" width="482" height="20" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="390" y="131">方式</text>  <text class="k" x="486.0" y="131">结构</text>  <text class="k" x="696.0" y="131">成本</text>  <text class="k" x="752.0" y="131">得到什么</text>  <rect x="382" y="138" width="482" height="44" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="390" y="174">直接放 DMZ</text>  <text class="c" x="486.0" y="174">公网 IP 直达应用</text>  <text class="c" x="696.0" y="174">最低</text>  <text class="x" x="752.0" y="174">暴露面 = 应用本身</text>  <line x1="382" y1="182" x2="864" y2="182" stroke="#eef2f8" stroke-width=".7"/>  <rect x="382" y="182" width="482" height="44" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="390" y="218">反向代理前置</text>  <text class="c" x="486.0" y="218">公网只到代理，代理到源站</text>  <text class="c" x="696.0" y="218">中</text>  <text class="g" x="752.0" y="218">可做 WAF / 限速 / 隐藏源站</text>  <line x1="382" y1="226" x2="864" y2="226" stroke="#eef2f8" stroke-width=".7"/>  <rect x="382" y="226" width="482" height="44" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="390" y="262">云清洗 + 源站保护</text>  <text class="c" x="486.0" y="262">DNS/CDN 指到清洗，回源白名单</text>  <text class="c" x="696.0" y="262">高</text>  <text class="g" x="752.0" y="262">抗量级攻击 + 隐藏源</text>  <line x1="382" y1="270" x2="864" y2="270" stroke="#eef2f8" stroke-width=".7"/>  <text class="k" x="382" y="292">THE SKELETON EVERY PUBLIC SERVICE NEEDS</text>  <rect x="382" y="300" width="52" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="408.0" y="311" text-anchor="middle">DNS</text>  <rect x="440" y="300" width="74" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="477.0" y="311" text-anchor="middle">CDN / WAF</text>  <rect x="520" y="300" width="70" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="555.0" y="311" text-anchor="middle">反向代理</text>  <rect x="596" y="300" width="48" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="620.0" y="311" text-anchor="middle">应用</text>  <rect x="650" y="300" width="48" height="16" rx="8.0" fill="#eef3fb" stroke="#c9dcfb" stroke-width=".7"/>  <text class="r" x="674.0" y="311" text-anchor="middle">数据</text>  <text class="w" x="382" y="330">每加一层：暴露面变小、延迟变大、成本变高 - 按业务重要性选层数，而不是一律加满</text>  <line x1="24" y1="352" x2="876" y2="352" stroke="#dfe6f1" stroke-width=".8"/>  <text class="x" x="24" y="372">The DMZ anti-pattern: many hosts, one flat segment, a rule allowing the segment to reach the internal server farm “for management”.</text>  <text class="w" x="24" y="394">Review question for every DMZ: list the internal destinations it is allowed to reach, and the business owner of each one. If the list is longer</text>  <text class="w" x="24" y="408">than one page, the DMZ has become a second internal network with a public front door.</text>
</svg>
