<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The four path-isolation techniques with their encapsulation, scale ceiling, operational cost and best fit</title>
  <desc id="d15">Four panels. Technique one, VLAN plus VRF, is hop by hop with no tunnels across access, distribution and core, using an 802.1Q tag with a 12-bit VLAN ID, a ceiling of 4096 VLANs with VLAN explosion on trunks, and the operational cost that every hop must be consistent or the path breaks; it fits two to four domains without tunnel skill. Technique two adds GRE point to point, with GRE and outer IP overhead of 24 bytes and an MTU of 1476, one tunnel per pair so the mesh grows as n times n minus one over two, endpoints that must be documented, and a fit of two sites with few domains. Technique three uses mGRE and NHRP for point to multipoint, with per-spoke registration, a hub bottleneck below 200 spokes, NBMA hub-and-spoke policy, and a fit of branch overlays. Technique four is an MPLS VPN with a label stack and MP-BGP route targets and distinguishers, scaling to thousands of VRFs, requiring MPLS skill, fitted to large campuses with many tenants. A footer notes that VXLAN and EVPN replace the transport, not the decision.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="548" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Four end-to-end path-isolation techniques, and what each one costs</text>  <text class="s" x="24" y="45">Scale, complexity and team knowledge decide - not fashion. The ceiling is a property of the technique, not of the vendor.</text>  <rect x="24" y="88" width="852" height="92" rx="3" fill="#f4f8ff" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="88" width="3.2" height="92" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="38" y="108" font-size="11" fill="#4a7ee0">T1</text>  <text class="b" x="66" y="108">VLAN + VRF</text>  <text class="w" x="66" y="122">hop by hop, no tunnels</text>  <text class="m" x="38" y="150">access VLAN 100 - 802.1Q - dist VRF-A - core VRF-A - dis</text>  <text class="m" x="38" y="164">t VRF-A</text>  <text class="k" x="300" y="108">ENCAPSULATION</text>  <text class="c" x="300" y="122">802.1Q tag, 12-bit VLAN ID</text>  <text class="c" x="300" y="136"></text>  <text class="k" x="300" y="158">SCALE CEILING</text>  <text class="c" x="300" y="170">4096 VLANs, VLAN explosion on trunks</text>  <text class="w" x="610" y="122">every hop consistent</text>  <text class="w" x="610" y="134">or the path breaks</text>  <text class="k" x="610" y="108">OPERATIONAL COST</text>  <text class="k" x="610" y="158">FITS</text>  <text class="c" x="610" y="170">2-4 domains, no tunnel skill</text>  <rect x="24" y="188" width="852" height="92" rx="3" fill="#f3fbf9" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="188" width="3.2" height="92" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="38" y="208" font-size="11" fill="#29a08f">T2</text>  <text class="b" x="66" y="208">VRF + GRE</text>  <text class="w" x="66" y="222">point to point</text>  <text class="m" x="38" y="250">dist VRF-A == GRE tunnel == dist VRF-A</text>  <text class="m" x="38" y="264"></text>  <text class="k" x="300" y="208">ENCAPSULATION</text>  <text class="c" x="300" y="222">GRE + outer IP, 24 B overhead, MTU 1476</text>  <text class="c" x="300" y="236"></text>  <text class="k" x="300" y="258">SCALE CEILING</text>  <text class="c" x="300" y="270">one tunnel per pair, mesh grows as n(n-1)/2</text>  <text class="w" x="610" y="222">tunnel endpoints</text>  <text class="w" x="610" y="234">to document</text>  <text class="k" x="610" y="208">OPERATIONAL COST</text>  <text class="k" x="610" y="258">FITS</text>  <text class="c" x="610" y="270">two sites, few domains</text>  <rect x="24" y="288" width="852" height="92" rx="3" fill="#f8f5fe" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="288" width="3.2" height="92" rx="1" fill="#8b6bd0" stroke="none"/>  <text class="B" x="38" y="308" font-size="11" fill="#8b6bd0">T3</text>  <text class="b" x="66" y="308">VRF + mGRE</text>  <text class="w" x="66" y="322">point to multipoint</text>  <text class="m" x="38" y="350">hub VRF-A == mGRE cloud == spokes</text>  <text class="m" x="38" y="364"></text>  <text class="k" x="300" y="308">ENCAPSULATION</text>  <text class="c" x="300" y="322">mGRE + NHRP, per-spoke registration</text>  <text class="c" x="300" y="336"></text>  <text class="k" x="300" y="358">SCALE CEILING</text>  <text class="c" x="300" y="370">hub is the bottleneck, &lt; 200 spokes</text>  <text class="w" x="610" y="322">NBMA, hub-and-spoke</text>  <text class="w" x="610" y="334">policy</text>  <text class="k" x="610" y="308">OPERATIONAL COST</text>  <text class="k" x="610" y="358">FITS</text>  <text class="c" x="610" y="370">branch overlay, many spokes</text>  <rect x="24" y="388" width="852" height="92" rx="3" fill="#fdf8ee" stroke="#eef2f8" stroke-width=".8"/>  <rect x="24" y="388" width="3.2" height="92" rx="1" fill="#d99b2b" stroke="none"/>  <text class="B" x="38" y="408" font-size="11" fill="#d99b2b">T4</text>  <text class="b" x="66" y="408">MPLS VPN</text>  <text class="w" x="66" y="422">label switched</text>  <text class="m" x="38" y="450">PE VRF-A - label - P router - PE VRF-A</text>  <text class="m" x="38" y="464"></text>  <text class="k" x="300" y="408">ENCAPSULATION</text>  <text class="c" x="300" y="422">label stack, MP-BGP with RT/RD</text>  <text class="c" x="300" y="436"></text>  <text class="k" x="300" y="458">SCALE CEILING</text>  <text class="c" x="300" y="470">thousands of VRFs, per-VRF routing</text>  <text class="w" x="610" y="422">MPLS skill, carrier-grade</text>  <text class="w" x="610" y="434">operations</text>  <text class="k" x="610" y="408">OPERATIONAL COST</text>  <text class="k" x="610" y="458">FITS</text>  <text class="c" x="610" y="470">large campus, many tenants</text>  <line x1="24" y1="494" x2="876" y2="494" stroke="#dfe6f1" stroke-width=".8"/>  <text class="x" x="24" y="514">The ceiling is the technique: VLAN + VRF does not scale past a few domains, and mGRE does not scale past a few hundred spokes.</text>  <text class="w" x="24" y="530">Modern alternatives (VXLAN/EVPN, SDA) replace the transport, not the decision - you still have to choose the isolation granularity first.</text>
</svg>
