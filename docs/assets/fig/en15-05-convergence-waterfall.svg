<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Convergence time as a stack of timers for the three access models, plus the host recovery tail</title>
  <desc id="d15">Horizontal stacked bars on a zero to twenty second axis. Multitier STP with tuned RSTP stacks detection at one to three seconds, topology at one to five seconds and gateway switchover at one to ten seconds, three to eighteen seconds in total. Routed access with BFD and an IGP stacks fifty to two hundred milliseconds of detection with two hundred to one thousand milliseconds of IGP convergence, under one second in total. Switch clustering stacks under one second of member removal with bundle recalculation, under one and a half seconds in total. A separate strip below shows host and session recovery of zero to three hundred seconds, identical for all three models, described as the tail that decides the user experience.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="396" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Convergence is the sum of every timer on the worst path</text>  <text class="s" x="24" y="45">Not a setting and not a protocol property: detection, plus topology, plus gateway, plus whatever the host does next.</text>  <line x1="168.0" y1="96" x2="168.0" y2="258" stroke="#eef2f8" stroke-width=".8"/>  <text class="k" x="168.0" y="90" text-anchor="middle">0s</text>  <line x1="328.0" y1="96" x2="328.0" y2="258" stroke="#eef2f8" stroke-width=".8"/>  <text class="k" x="328.0" y="90" text-anchor="middle">5s</text>  <line x1="488.0" y1="96" x2="488.0" y2="258" stroke="#eef2f8" stroke-width=".8"/>  <text class="k" x="488.0" y="90" text-anchor="middle">10s</text>  <line x1="648.0" y1="96" x2="648.0" y2="258" stroke="#eef2f8" stroke-width=".8"/>  <text class="k" x="648.0" y="90" text-anchor="middle">15s</text>  <line x1="808.0" y1="96" x2="808.0" y2="258" stroke="#eef2f8" stroke-width=".8"/>  <text class="k" x="808.0" y="90" text-anchor="middle">20s</text>  <text class="b" x="24" y="134">Multitier STP (tuned RSTP)</text>  <rect x="168" y="116" width="64.0" height="26" rx="2" fill="#f0b8ae" stroke="none"/>  <rect x="232.0" y="116" width="96.0" height="26" rx="2" fill="#f6d08a" stroke="none"/>  <text class="c" x="238.0" y="133">topology 1-5 s</text>  <rect x="328.0" y="116" width="160.0" height="26" rx="2" fill="#c9d8f6" stroke="none"/>  <text class="c" x="334.0" y="133">gateway 1-10 s</text>  <text class="x" x="498.0" y="133">3-18 s</text>  <text class="b" x="24" y="184">Routed access (IGP + BFD)</text>  <rect x="168" y="166" width="12.8" height="26" rx="2" fill="#a9dccf" stroke="none"/>  <rect x="180.8" y="166" width="22.4" height="26" rx="2" fill="#7fc9b8" stroke="none"/>  <text class="g" x="213.20000000000002" y="183">&lt; 1 s</text>  <text class="b" x="24" y="234">Switch clustering</text>  <rect x="168" y="216" width="19.2" height="26" rx="2" fill="#c3b6ea" stroke="none"/>  <rect x="187.2" y="216" width="16.0" height="26" rx="2" fill="#a894dd" stroke="none"/>  <text class="r" x="213.2" y="233">&lt; 1.5 s</text>  <text class="w" x="824.0" y="128">network</text>  <text class="w" x="824.0" y="141">side only</text>  <line x1="24" y1="280" x2="876" y2="280" stroke="#dfe6f1" stroke-width=".8"/>  <text class="b" x="24" y="300">The tail nobody puts in the design document: host and session recovery, 0-300 s</text>  <rect x="24" y="310" width="852" height="26" rx="3" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".8"/>  <rect x="24" y="310" width="150" height="26" rx="2" fill="#f0b8ae" stroke="none"/>  <text class="c" x="30" y="327">TCP retransmit ladder</text>  <text class="x" x="196" y="327">identical for all three models, so the model choice stops mattering at the application layer</text>  <text class="w" x="24" y="362">Tuning order that pays: BFD before timer games, stub and summarisation before area redesign, and one</text>  <text class="w" x="24" y="376">application-level reconnect policy that nobody has to invent during an incident.</text>
</svg>
