<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-labelledby="t511 d511">
  <title id="t511">Case 1 compared: jumping straight to phase D against starting at phases A and B in the same bank</title>
  <desc id="d511">Two lanes. The shortcut lane starts from a business goal of moving core banking to the cloud within two years, starts at phase D asking private or public cloud, which SDN vendor and VXLAN or EVPN, spends four months without a B capability or a C data model, and ends with the CFO asking three questions that cannot be answered. The second lane starts at A for vision, then B for business, which shows a new business launch takes eleven weeks against three for competitors, then C and D, which show six of those weeks are network resource requests; the design that followed was self-service requests plus automated provisioning, compressing six weeks to two days. Three metric cards follow: three months to a visible result, one tenth of the original cost, and an eleven week target against three week competitors.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 8.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:7.8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .v{font:700 10px "Segoe UI",sans-serif;fill:#1a2233}
  </style>

  <rect x="0" y="0" width="900" height="400" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Case 1: the same bank, twice — once from the technology, once from the outcome</text>
  <text class="s" x="24" y="45">The first attempt answered a question nobody had asked; the second found the eleven weeks and the six of them spent on network requests</text>

  <text class="k" x="24" y="66">THE SHORTCUT &#183; STRAIGHT TO PHASE D</text>
  <rect x="24" y="76" width="190" height="66" rx="2" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <text class="b" x="34" y="92" fill="#c0392b">business goal</text>
  <text class="c" x="34" y="108">&#8220;move core banking to the</text>
  <text class="c" x="34" y="120">cloud within two years&#8221;</text>
  <text class="w" x="34" y="134">no outcome named</text>
  <line x1="216" y1="109" x2="230" y2="109" stroke="#9aa8ba" stroke-width=".9"/>
  <path d="M228 105 l7 4 l-7 4 z" fill="#9aa8ba"/>

  <rect x="234" y="76" width="190" height="66" rx="2" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <text class="b" x="244" y="92" fill="#c0392b">start at D</text>
  <text class="c" x="244" y="108">private or public? which SDN</text>
  <text class="c" x="244" y="120">vendor? VXLAN or EVPN?</text>
  <text class="w" x="244" y="134">a comparison nobody asked for</text>
  <line x1="426" y1="109" x2="440" y2="109" stroke="#9aa8ba" stroke-width=".9"/>
  <path d="M438 105 l7 4 l-7 4 z" fill="#9aa8ba"/>

  <rect x="444" y="76" width="190" height="66" rx="2" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <text class="b" x="454" y="92" fill="#c0392b">four months of work</text>
  <text class="c" x="454" y="108">no B capability, no C data</text>
  <text class="c" x="454" y="120">model, no baseline</text>
  <text class="w" x="454" y="134">documents without a basis</text>
  <line x1="636" y1="109" x2="650" y2="109" stroke="#9aa8ba" stroke-width=".9"/>
  <path d="M648 105 l7 4 l-7 4 z" fill="#9aa8ba"/>

  <rect x="654" y="76" width="222" height="66" rx="2" fill="#fdedeb" stroke="#c0392b" stroke-width=".9"/>
  <text class="b" x="664" y="92" fill="#c0392b">the CFO asks three questions</text>
  <text class="c" x="664" y="108">cost per transaction? weeks saved?</text>
  <text class="c" x="664" y="120">what do we lose by not doing it?</text>
  <text class="w" x="664" y="134">three questions, zero answers</text>

  <text class="k" x="24" y="166">THE SAME BANK, STARTING AT A</text>
  <rect x="24" y="176" width="190" height="66" rx="2" fill="#f5fdfa" stroke="#0f7f73" stroke-width=".7"/>
  <text class="b" x="34" y="192" fill="#0f7f73">A &#183; architecture vision</text>
  <text class="c" x="34" y="208">&#8220;cloud for which outcome,</text>
  <text class="c" x="34" y="220">measured how, by when&#8221;</text>
  <text class="w" x="34" y="234">the question that was missing</text>
  <line x1="216" y1="209" x2="230" y2="209" stroke="#9aa8ba" stroke-width=".9"/>
  <path d="M228 205 l7 4 l-7 4 z" fill="#9aa8ba"/>

  <rect x="234" y="176" width="190" height="66" rx="2" fill="#f5fdfa" stroke="#0f7f73" stroke-width=".7"/>
  <text class="b" x="244" y="192" fill="#0f7f73">B &#183; business architecture</text>
  <text class="c" x="244" y="208">a new launch takes 11 weeks;</text>
  <text class="c" x="244" y="220">competitors take 3</text>
  <text class="w" x="244" y="234">the real pain, finally written down</text>
  <line x1="426" y1="209" x2="440" y2="209" stroke="#9aa8ba" stroke-width=".9"/>
  <path d="M438 205 l7 4 l-7 4 z" fill="#9aa8ba"/>

  <rect x="444" y="176" width="190" height="66" rx="2" fill="#f5fdfa" stroke="#0f7f73" stroke-width=".7"/>
  <text class="b" x="454" y="192" fill="#0f7f73">C and D &#183; the bottleneck</text>
  <text class="c" x="454" y="208">six of those eleven weeks are</text>
  <text class="c" x="454" y="220">requests for network resources</text>
  <text class="w" x="454" y="234">located before any cloud decision</text>
  <line x1="636" y1="209" x2="650" y2="209" stroke="#9aa8ba" stroke-width=".9"/>
  <path d="M648 205 l7 4 l-7 4 z" fill="#9aa8ba"/>

  <rect x="654" y="176" width="222" height="66" rx="2" fill="#eef7f5" stroke="#0f7f73" stroke-width=".9"/>
  <text class="b" x="664" y="192" fill="#0f7f73">the design that followed</text>
  <text class="c" x="664" y="208">self-service requests plus automated</text>
  <text class="c" x="664" y="220">provisioning: 6 weeks &#8594; 2 days</text>
  <text class="w" x="664" y="234">not a cloud migration at all</text>

  <rect x="24" y="264" width="272" height="44" rx="3" fill="#ffffff" stroke="#0f7f73" stroke-width=".7"/>
  <text class="v" x="36" y="286" fill="#0f7f73">3 months</text>
  <text class="w" x="36" y="300">to a visible result, not two years</text>
  <rect x="304" y="264" width="272" height="44" rx="3" fill="#ffffff" stroke="#0f7f73" stroke-width=".7"/>
  <text class="v" x="316" y="286" fill="#0f7f73">1 / 10</text>
  <text class="w" x="316" y="300">of the cost of the original proposal</text>
  <rect x="584" y="264" width="272" height="44" rx="3" fill="#ffffff" stroke="#0f7f73" stroke-width=".7"/>
  <text class="v" x="596" y="286" fill="#0f7f73">11 weeks &#8594; 3</text>
  <text class="w" x="596" y="300">the outcome the business actually wanted</text>

  <rect x="24" y="322" width="852" height="46" rx="3" fill="#fff8f7" stroke="#c0392b" stroke-width=".7"/>
  <rect x="24" y="322" width="4" height="46" fill="#c0392b"/>
  <text class="c" x="40" y="342" fill="#c0392b"><tspan style="font-weight:700">Before the requirement is clarified, every technical proposal is a guess.</tspan> A and B look soft, and they are the only gate against technology for its own sake.</text>
  <text class="c" x="40" y="358">Four months in D did not fail for lack of effort; it failed because the question had never been written down.</text>

  <text class="w" x="24" y="390">The expensive part of skipping phase A is not the wasted document, it is the design that survives and has to be defended later.</text>
</svg>
