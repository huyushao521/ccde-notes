<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">DMVPN phase one, two and three compared for spoke-to-spoke behaviour, hub loading and summarisation</title>
  <desc id="d15">Three panels show the topology of each phase. Phase one is hub and spoke only: mGRE with NHRP but no spoke routes, so all spoke traffic hairpins through the hub. Phase two adds NHRP mapping so spokes build direct tunnels, with the hub forwarding only the first packet, at the cost of the hub no longer being able to summarise. Phase three adds the NHRP shortcut plus a hub summary route, so the hub advertises one aggregate and still shortens the data path. A five-row table compares spoke-to-spoke behaviour, configuration per site, whether the hub can summarise, hub load and the requirement for each phase. The choice is a measurement: when east-west traffic exceeds thirty percent of WAN traffic, phase two or three is justified; below that, phase one is honest and cheaper, and phase two plus a hub summary is the classic contradiction that re-hairpins all traffic.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="506" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">DMVPN's three phases decide whether spokes can talk directly</text>  <text class="s" x="24" y="45">Phase 1 hairpins through the hub, phase 2 adds shortcut paths, phase 3 adds the shortcut plus summarisation</text>
  <rect x="24" y="68" width="268" height="150" rx="3" fill="#ffffff" stroke="#29a08f" stroke-width=".8"/>
  <text class="k" x="36" y="86">PHASE 1</text>
  <text class="b" x="36" y="104">Hub and spoke only</text>
  <text class="c" x="36" y="120">mGRE + NHRP, no spoke route</text>
  <rect x="132" y="132" width="52" height="22" rx="3" fill="#eef3fb" stroke="#29a08f" stroke-width=".8"/>
  <text class="c" x="158" y="147" text-anchor="middle">HUB</text>
  <rect x="36" y="190" width="44" height="20" rx="3" fill="#f7f9fd" stroke="#29a08f" stroke-width=".8"/>
  <text class="c" x="58" y="204" text-anchor="middle">SPOKE 1</text>
  <line x1="158" y1="154" x2="58" y2="190" stroke="#9fb3d1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="236" y="190" width="44" height="20" rx="3" fill="#f7f9fd" stroke="#29a08f" stroke-width=".8"/>
  <text class="c" x="258" y="204" text-anchor="middle">SPOKE 2</text>
  <line x1="158" y1="154" x2="258" y2="190" stroke="#9fb3d1" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="w" x="156" y="178" text-anchor="middle">via hub</text>
  <rect x="316" y="68" width="268" height="150" rx="3" fill="#ffffff" stroke="#8b6bd0" stroke-width=".8"/>
  <text class="k" x="328" y="86">PHASE 2</text>
  <text class="b" x="328" y="104">Spoke to spoke, direct</text>
  <text class="c" x="328" y="120">NHRP maps the peer; hub forwards first packet</text>
  <rect x="424" y="132" width="52" height="22" rx="3" fill="#eef3fb" stroke="#8b6bd0" stroke-width=".8"/>
  <text class="c" x="450" y="147" text-anchor="middle">HUB</text>
  <rect x="328" y="190" width="44" height="20" rx="3" fill="#f7f9fd" stroke="#8b6bd0" stroke-width=".8"/>
  <text class="c" x="350" y="204" text-anchor="middle">SPOKE 1</text>
  <line x1="450" y1="154" x2="350" y2="190" stroke="#9fb3d1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="528" y="190" width="44" height="20" rx="3" fill="#f7f9fd" stroke="#8b6bd0" stroke-width=".8"/>
  <text class="c" x="550" y="204" text-anchor="middle">SPOKE 2</text>
  <line x1="450" y1="154" x2="550" y2="190" stroke="#9fb3d1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="350" y1="200" x2="550" y2="200" stroke="#8b6bd0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="w" x="450" y="178" text-anchor="middle">direct</text>
  <rect x="608" y="68" width="268" height="150" rx="3" fill="#ffffff" stroke="#4a7ee0" stroke-width=".8"/>
  <text class="k" x="620" y="86">PHASE 3</text>
  <text class="b" x="620" y="104">Shortcut + summary</text>
  <text class="c" x="620" y="120">hub advertises a summary, NHRP shortens the path</text>
  <rect x="716" y="132" width="52" height="22" rx="3" fill="#eef3fb" stroke="#4a7ee0" stroke-width=".8"/>
  <text class="c" x="742" y="147" text-anchor="middle">HUB</text>
  <rect x="620" y="190" width="44" height="20" rx="3" fill="#f7f9fd" stroke="#4a7ee0" stroke-width=".8"/>
  <text class="c" x="642" y="204" text-anchor="middle">SPOKE 1</text>
  <line x1="742" y1="154" x2="642" y2="190" stroke="#9fb3d1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="820" y="190" width="44" height="20" rx="3" fill="#f7f9fd" stroke="#4a7ee0" stroke-width=".8"/>
  <text class="c" x="842" y="204" text-anchor="middle">SPOKE 2</text>
  <line x1="742" y1="154" x2="842" y2="190" stroke="#9fb3d1" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="642" y1="200" x2="842" y2="200" stroke="#4a7ee0" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="w" x="742" y="178" text-anchor="middle">shortcut</text>
  <rect x="24" y="232" width="852" height="22" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="32" y="247">BEHAVIOUR</text>  <text class="k" x="222.0" y="247">PHASE 1</text>  <text class="k" x="422.0" y="247">PHASE 2</text>  <text class="k" x="622.0" y="247">PHASE 3</text>  <rect x="24" y="254" width="852" height="22" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="268">Spoke to spoke</text>  <text class="c" x="222.0" y="268">through the hub</text>  <text class="c" x="422.0" y="268">direct tunnel</text>  <text class="c" x="622.0" y="268">direct shortcut</text>  <line x1="24" y1="276" x2="876" y2="276" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="276" width="852" height="22" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="290">Hub config per site</text>  <text class="c" x="222.0" y="290">1</text>  <text class="c" x="422.0" y="290">1</text>  <text class="c" x="622.0" y="290">1</text>  <line x1="24" y1="298" x2="876" y2="298" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="298" width="852" height="22" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="312">Hub can summarise</text>  <text class="x" x="222.0" y="312">no</text>  <text class="c" x="422.0" y="312">only if spokes register</text>  <text class="g" x="622.0" y="312">yes, by design</text>  <line x1="24" y1="320" x2="876" y2="320" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="320" width="852" height="22" rx="2" fill="#f7f9fd" stroke="none" stroke-width=".8"/>  <text class="b" x="32" y="334">Hub load</text>  <text class="x" x="222.0" y="334">all spoke traffic</text>  <text class="g" x="422.0" y="334">first packet only</text>  <text class="g" x="622.0" y="334">control only</text>  <line x1="24" y1="342" x2="876" y2="342" stroke="#eef2f8" stroke-width=".7"/>  <rect x="24" y="342" width="852" height="22" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="b" x="32" y="356">Requirement</text>  <text class="c" x="222.0" y="356">any-to-hub only</text>  <text class="c" x="422.0" y="356">routing knows all spokes</text>  <text class="c" x="622.0" y="356">NHRP shortcut support</text>  <line x1="24" y1="364" x2="876" y2="364" stroke="#eef2f8" stroke-width=".7"/>
  <rect x="24" y="388" width="852" height="74" rx="3" fill="#f4f8ff" stroke="#c9dcfb" stroke-width=".8"/>
  <text class="k" x="36" y="406">HOW TO CHOOSE, IN ONE MEASUREMENT</text>
  <text class="b" x="36" y="424">Measure east-west traffic as a share of WAN traffic. Above 30% through the hub: phase 2 or 3. Below: phase 1 is honest and cheaper.</text>
  <text class="c" x="36" y="442">Phase 2 plus a hub summary route is the classic contradiction: the summary removes the /24 the spokes need for the shortcut, so traffic hairpins again.</text>
  <text class="x" x="36" y="456">Ask for the configuration, not the phase number: summarisation and shortcut policy are decided per site, not per design slide.</text>
  <line x1="24" y1="476" x2="876" y2="476" stroke="#dfe6f1" stroke-width=".8"/>
  <text class="c" x="24" y="492">Phase 3 exists precisely to give you both: a summarised spoke range at the hub and a direct data path when it matters.</text>
</svg>
