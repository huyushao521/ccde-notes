<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">Scalability as the slope of incremental cost, with the practical ceilings that make the slope step instead of staying linear</title>
  <desc id="d15">A chart with endpoints or blocks added on the horizontal axis and cost per step on the vertical axis. A green straight line is labelled linear, where each block costs the same, and a red stepped line is labelled step cost, where a per-device limit was crossed, naming MAC table, ARP, VLAN and STP diameter. Beside the chart, a table of practical ceilings: 500 endpoints per VLAN with 250 recommended, 8 VLANs per closet, 200 VLANs per campus, a spanning tree diameter of 7 hops, 8,000 ARP entries per gateway, campus IGP routes in the low thousands, 50 to 100 VRFs per distribution switch with 3 to 20 normal, and fewer than 200 tunnel peers. Three questions below expose a non-scalable design: the cost of block number six, which resource is already at 50 percent, and what happens at 80 percent of the datasheet number.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="386" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Scalability is the slope of the incremental cost, not the maximum on the datasheet</text>  <text class="s" x="24" y="45">A design scales when adding the next block costs the same as the last one - in money, in config and in failure modes.</text>  <line x1="70" y1="296" x2="540" y2="296" stroke="#dfe6f1" stroke-width="1"/>  <line x1="70" y1="96" x2="70" y2="296" stroke="#dfe6f1" stroke-width="1"/>  <text class="w" x="536" y="288" text-anchor="end">blocks added</text>  <text class="w" x="60" y="108" text-anchor="end">cost per step</text>  <line x1="70" y1="246" x2="540" y2="246" stroke="#f2f5fa" stroke-width=".8"/>  <line x1="70" y1="196" x2="540" y2="196" stroke="#f2f5fa" stroke-width=".8"/>  <line x1="70" y1="146" x2="540" y2="146" stroke="#f2f5fa" stroke-width=".8"/>  <path d="M 70 276 L 540 116" fill="none" stroke="#29a08f" stroke-width="1.6"/>  <text class="g" x="430" y="128">linear: predictable budget</text>  <text class="w" x="430" y="142">each block costs the same</text>  <path d="M 70 280 L 190 272 L 200 216 L 330 208 L 340 150 L 470 140 L 480 100" fill="none" stroke="#d0564a" stroke-width="1.6"/>  <text class="x" x="210" y="200">step cost:</text>  <text class="x" x="210" y="214">a per-device limit was crossed</text>  <text class="w" x="200" y="186">MAC table, ARP, VLAN, STP diameter</text>  <text class="w" x="360" y="262">the second block is where designs</text>  <text class="w" x="360" y="276">stop being linear</text>  <text class="k" x="566" y="100">PRACTICAL CEILINGS THAT BEND THE CURVE</text>  <rect x="566" y="108" width="310" height="20" rx="2" fill="#f2f6fd" stroke="none" stroke-width=".8"/>  <text class="k" x="574" y="121">Resource</text>  <text class="k" x="769.0" y="121">Ceiling</text>  <rect x="566" y="128" width="310" height="23" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="574" y="143">Endpoints per VLAN / subnet</text>  <text class="c" x="769.0" y="143">500 (250 better)</text>  <line x1="566" y1="151" x2="876" y2="151" stroke="#eef2f8" stroke-width=".7"/>  <rect x="566" y="151" width="310" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="574" y="166">VLANs per closet</text>  <text class="c" x="769.0" y="166">&lt;= 8</text>  <line x1="566" y1="174" x2="876" y2="174" stroke="#eef2f8" stroke-width=".7"/>  <rect x="566" y="174" width="310" height="23" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="574" y="189">VLANs per campus</text>  <text class="c" x="769.0" y="189">&lt;= 200</text>  <line x1="566" y1="197" x2="876" y2="197" stroke="#eef2f8" stroke-width=".7"/>  <rect x="566" y="197" width="310" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="574" y="212">Spanning-tree diameter</text>  <text class="c" x="769.0" y="212">&lt;= 7 hops</text>  <line x1="566" y1="220" x2="876" y2="220" stroke="#eef2f8" stroke-width=".7"/>  <rect x="566" y="220" width="310" height="23" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="574" y="235">ARP / ND entries per gateway</text>  <text class="c" x="769.0" y="235">&lt;= 8,000</text>  <line x1="566" y1="243" x2="876" y2="243" stroke="#eef2f8" stroke-width=".7"/>  <rect x="566" y="243" width="310" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="574" y="258">Campus IGP routes</text>  <text class="c" x="769.0" y="258">low thousands</text>  <line x1="566" y1="266" x2="876" y2="266" stroke="#eef2f8" stroke-width=".7"/>  <rect x="566" y="266" width="310" height="23" rx="2" fill="#f7f9fc" stroke="none" stroke-width=".8"/>  <text class="c" x="574" y="281">VRFs per distribution switch</text>  <text class="c" x="769.0" y="281">50-100</text>  <line x1="566" y1="289" x2="876" y2="289" stroke="#eef2f8" stroke-width=".7"/>  <rect x="566" y="289" width="310" height="23" rx="0" fill="#ffffff" stroke="none" stroke-width=".8" opacity="0"/>  <text class="c" x="574" y="304">Tunnel / mGRE peers</text>  <text class="c" x="769.0" y="304">&lt; 200</text>  <line x1="566" y1="312" x2="876" y2="312" stroke="#eef2f8" stroke-width=".7"/>  <text class="b" x="24" y="320">Three questions that expose a non-scalable design before it is built</text>  <text class="w" x="24" y="338">1. What is the cost of block number six - one more pair of distribution switches, or a redesign of the IGP?</text>  <text class="w" x="24" y="352">2. Which resource is at 50% today: MAC table, ARP table, RIB, VLAN count, PoE budget, session table?</text>  <text class="w" x="24" y="366">3. If the answer to "how many can it hold" is a datasheet number, what happens at 80% of that number?</text>
</svg>
