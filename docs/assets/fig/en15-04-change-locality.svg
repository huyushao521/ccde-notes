<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">A flat campus against a hierarchical campus, measured by how many devices one change touches</title>
  <desc id="d15">Left panel: fourteen access switches in two rows forming one flat STP and broadcast domain; adding a VLAN puts all fourteen devices in the change window and forces a campus wide review, a maintenance window and an untested rollback plan. Right panel: the same fourteen switches arranged as two core devices, a distribution pair and three IDFs of two switches each; only one IDF is highlighted, so two devices are touched while the root, gateway and summarisation points stay where the design put them. A bottom row lists what hierarchy buys: change locality, fault isolation, team scaling and growth cost.</desc>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:9.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .b{font:600 9px "Segoe UI",sans-serif;fill:#1a2233}
    .B{font:700 10.5px "Segoe UI",sans-serif;fill:#1a2233}
    .c{font:8px "Segoe UI",sans-serif;fill:#4a5a72}
    .w{font:7.5px "Segoe UI",sans-serif;fill:#7c8b9f}
    .k{font:700 7px "Segoe UI",sans-serif;fill:#9aa8ba;letter-spacing:.5px}
    .x{font:700 7.5px "Segoe UI",sans-serif;fill:#c0392b}
    .g{font:700 7.5px "Segoe UI",sans-serif;fill:#0f7f73}
    .r{font:700 7.5px "Segoe UI",sans-serif;fill:#1f4fc0}
    .m{font:400 7.5px "Consolas",monospace;fill:#3b4657}
    .n{font:700 8px "Segoe UI",sans-serif;fill:#ffffff}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb3d1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a7ee0"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d0564a"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29a08f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="414" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Hierarchy is a change-management device, not a drawing style</text>  <text class="s" x="24" y="45">Same fourteen switches, same links. The difference is how many of them one add-a-VLAN change touches.</text>  <rect x="24" y="86" width="414" height="228" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="36" y="104">FLAT: ONE BIG DOMAIN</text>  <text class="b" x="36" y="122">A change touches every device</text>  <rect x="44" y="146" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="48" y1="161" x2="48" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="66" y1="161" x2="66" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="44" y="196" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="48" y1="211" x2="48" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="66" y1="211" x2="66" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="98" y="146" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="102" y1="161" x2="102" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="120" y1="161" x2="120" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="98" y="196" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="102" y1="211" x2="102" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="120" y1="211" x2="120" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="152" y="146" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="156" y1="161" x2="156" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="174" y1="161" x2="174" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="152" y="196" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="156" y1="211" x2="156" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="174" y1="211" x2="174" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="206" y="146" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="210" y1="161" x2="210" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="228" y1="161" x2="228" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="206" y="196" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="210" y1="211" x2="210" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="228" y1="211" x2="228" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="260" y="146" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="264" y1="161" x2="264" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="282" y1="161" x2="282" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="260" y="196" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="264" y1="211" x2="264" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="282" y1="211" x2="282" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="314" y="146" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="318" y1="161" x2="318" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="336" y1="161" x2="336" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="314" y="196" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="318" y1="211" x2="318" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="336" y1="211" x2="336" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="368" y="146" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="372" y1="161" x2="372" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="390" y1="161" x2="390" y2="166" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="368" y="196" width="26" height="15" rx="3" fill="#fdf0ee" stroke="#eec7bf" stroke-width=".8"/>  <line x1="372" y1="211" x2="372" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="390" y1="211" x2="390" y2="216" stroke="#c9d8f6" stroke-width=".7"/>  <text class="w" x="44" y="236">one STP domain, one broadcast domain, one gateway pair</text>  <rect x="36" y="246" width="390" height="58" rx="3" fill="#fdf6f4" stroke="#f0d4cd" stroke-width=".8" stroke-dasharray="3 3"/>  <text class="x" x="48" y="264">14 devices in the change window</text>  <text class="w" x="48" y="278">campus-wide review, a maintenance window,</text>  <text class="w" x="48" y="291">and a rollback plan nobody has ever tested</text>  <rect x="462" y="86" width="414" height="228" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="k" x="474" y="104">HIERARCHICAL: BLOCK + CLOSET</text>  <text class="b" x="474" y="122">A change touches one closet</text>  <rect x="596" y="140" width="30" height="15" rx="3" fill="#eef3fb" stroke="#c9d8f6" stroke-width=".8"/>  <line x1="600" y1="155" x2="600" y2="160" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="622" y1="155" x2="622" y2="160" stroke="#c9d8f6" stroke-width=".7"/>  <text class="w" x="632" y="152">core</text>  <rect x="556" y="176" width="30" height="15" rx="3" fill="#eef3fb" stroke="#c9d8f6" stroke-width=".8"/>  <line x1="560" y1="191" x2="560" y2="196" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="582" y1="191" x2="582" y2="196" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="668" y="176" width="30" height="15" rx="3" fill="#eef3fb" stroke="#c9d8f6" stroke-width=".8"/>  <line x1="672" y1="191" x2="672" y2="196" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="694" y1="191" x2="694" y2="196" stroke="#c9d8f6" stroke-width=".7"/>  <text class="w" x="704" y="188">distribution pair</text>  <rect x="494" y="224" width="26" height="15" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <line x1="498" y1="239" x2="498" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="516" y1="239" x2="516" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="528" y="224" width="26" height="15" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <line x1="532" y1="239" x2="532" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="550" y1="239" x2="550" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <text class="w" x="494" y="258">IDF 1</text>  <rect x="622" y="224" width="26" height="15" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <line x1="626" y1="239" x2="626" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="644" y1="239" x2="644" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="656" y="224" width="26" height="15" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <line x1="660" y1="239" x2="660" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="678" y1="239" x2="678" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <text class="w" x="622" y="258">IDF 2</text>  <rect x="750" y="224" width="26" height="15" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <line x1="754" y1="239" x2="754" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="772" y1="239" x2="772" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <rect x="784" y="224" width="26" height="15" rx="3" fill="#ffffff" stroke="#c9d8f6" stroke-width=".8"/>  <line x1="788" y1="239" x2="788" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <line x1="806" y1="239" x2="806" y2="244" stroke="#c9d8f6" stroke-width=".7"/>  <text class="w" x="750" y="258">IDF 3</text>  <rect x="486" y="210" width="106" height="60" rx="3" fill="none" stroke="#29a08f" stroke-width="1.2" stroke-dasharray="3 3"/>  <rect x="474" y="268" width="390" height="38" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <text class="g" x="486" y="285">2 devices touched, one closet re-reviewed</text>  <text class="w" x="486" y="299">root, gateway and summary stay where the design put them</text>  <text class="b" x="24" y="342">What hierarchy actually buys</text>  <rect x="24" y="352" width="204" height="46" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="36" y="370">Change locality</text>  <text class="w" x="36" y="385">one closet, one block, one plan</text>  <rect x="240" y="352" width="204" height="46" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="252" y="370">Fault isolation</text>  <text class="w" x="252" y="385">the blast radius stops at a boundary</text>  <rect x="456" y="352" width="204" height="46" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="468" y="370">Team scaling</text>  <text class="w" x="468" y="385">each team owns one layer</text>  <rect x="672" y="352" width="204" height="46" rx="3" fill="#ffffff" stroke="#e2e9f4" stroke-width=".8"/>  <text class="b" x="684" y="370">Growth cost</text>  <text class="w" x="684" y="385">add a block, not a redesign</text>
</svg>
