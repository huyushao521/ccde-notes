<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="100%" role="img" aria-labelledby="t15 d15">
  <title id="t15">The fifteen truths of campus design grouped into four themes</title>
  <desc id="d15">Fifteen numbered statements in a five by three grid, colour coded by theme. Failure domain: how big is the failure domain; hierarchy makes change local; STP has no topological intent. Behaviour: layer 2 is not simpler; FHRP saves the address and not the hop; routed access moves the traps to layer 3; clustering welds two failures into one; the three access models differ on failure behaviour; wireless makes layer 2 first class again. Budget and scale: convergence is a sum of timers; IGP choice is team skill plus convergence budget plus area design; scalability means linear incremental cost. Cost: virtualisation costs operational load; a VRF is not a firewall; the real bottleneck of service virtualisation is the return path.</desc>
