  <rect x="0" y="0" width="900" height="538" fill="#fbfcfe"/>
  <text class="h" x="24" y="28">Fifteen counter-intuitive truths, four themes</text>  <text class="s" x="24" y="45">Read down the columns, not across the list: failure domain, failure behaviour, operational cost, scale.</text>  <rect x="34" y="88" width="160" height="116" rx="3" fill="#f4f8ff" stroke="#d9e5fb" stroke-width=".8"/>  <rect x="34" y="88" width="3.2" height="116" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="47" y="114" font-size="13">01</text>  <text class="b" x="47" y="138">How big is the</text>  <text class="b" x="47" y="151">failure domain</text>  <text class="k" x="47" y="194">FAILURE DOMAIN</text>  <rect x="202" y="88" width="160" height="116" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <rect x="202" y="88" width="3.2" height="116" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="215" y="114" font-size="13">02</text>  <text class="b" x="215" y="138">"L2 is simpler"</text>  <text class="b" x="215" y="151">is an illusion</text>  <text class="k" x="215" y="194">BEHAVIOUR</text>  <rect x="370" y="88" width="160" height="116" rx="3" fill="#f4f8ff" stroke="#d9e5fb" stroke-width=".8"/>  <rect x="370" y="88" width="3.2" height="116" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="383" y="114" font-size="13">03</text>  <text class="b" x="383" y="138">Hierarchy makes</text>  <text class="b" x="383" y="151">change local</text>  <text class="k" x="383" y="194">FAILURE DOMAIN</text>  <rect x="538" y="88" width="160" height="116" rx="3" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <rect x="538" y="88" width="3.2" height="116" rx="1" fill="#8b6bd0" stroke="none"/>  <text class="B" x="551" y="114" font-size="13">04</text>  <text class="b" x="551" y="138">Convergence is a</text>  <text class="b" x="551" y="151">sum of timers</text>  <text class="k" x="551" y="194">BUDGET / SCALE</text>  <rect x="706" y="88" width="160" height="116" rx="3" fill="#f4f8ff" stroke="#d9e5fb" stroke-width=".8"/>  <rect x="706" y="88" width="3.2" height="116" rx="1" fill="#4a7ee0" stroke="none"/>  <text class="B" x="719" y="114" font-size="13">05</text>  <text class="b" x="719" y="138">STP has no</text>  <text class="b" x="719" y="151">topological intent</text>  <text class="k" x="719" y="194">FAILURE DOMAIN</text>  <rect x="34" y="214" width="160" height="116" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <rect x="34" y="214" width="3.2" height="116" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="47" y="240" font-size="13">06</text>  <text class="b" x="47" y="264">FHRP saves the</text>  <text class="b" x="47" y="277">address, not the hop</text>  <text class="k" x="47" y="320">BEHAVIOUR</text>  <rect x="202" y="214" width="160" height="116" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <rect x="202" y="214" width="3.2" height="116" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="215" y="240" font-size="13">07</text>  <text class="b" x="215" y="264">Routed access moves</text>  <text class="b" x="215" y="277">the traps to L3</text>  <text class="k" x="215" y="320">BEHAVIOUR</text>  <rect x="370" y="214" width="160" height="116" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <rect x="370" y="214" width="3.2" height="116" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="383" y="240" font-size="13">08</text>  <text class="b" x="383" y="264">Clustering welds two</text>  <text class="b" x="383" y="277">failures into one</text>  <text class="k" x="383" y="320">BEHAVIOUR</text>  <rect x="538" y="214" width="160" height="116" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <rect x="538" y="214" width="3.2" height="116" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="551" y="240" font-size="13">09</text>  <text class="b" x="551" y="264">Models differ on</text>  <text class="b" x="551" y="277">failure behaviour</text>  <text class="k" x="551" y="320">BEHAVIOUR</text>  <rect x="706" y="214" width="160" height="116" rx="3" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <rect x="706" y="214" width="3.2" height="116" rx="1" fill="#8b6bd0" stroke="none"/>  <text class="B" x="719" y="240" font-size="13">10</text>  <text class="b" x="719" y="264">IGP = skill +</text>  <text class="b" x="719" y="277">budget + areas</text>  <text class="k" x="719" y="320">BUDGET / SCALE</text>  <rect x="34" y="340" width="160" height="116" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <rect x="34" y="340" width="3.2" height="116" rx="1" fill="#d99b2b" stroke="none"/>  <text class="B" x="47" y="366" font-size="13">11</text>  <text class="b" x="47" y="390">Virtualisation costs</text>  <text class="b" x="47" y="403">operational load</text>  <text class="k" x="47" y="446">COST</text>  <rect x="202" y="340" width="160" height="116" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <rect x="202" y="340" width="3.2" height="116" rx="1" fill="#d99b2b" stroke="none"/>  <text class="B" x="215" y="366" font-size="13">12</text>  <text class="b" x="215" y="390">A VRF is not</text>  <text class="b" x="215" y="403">a firewall</text>  <text class="k" x="215" y="446">COST</text>  <rect x="370" y="340" width="160" height="116" rx="3" fill="#fdf8ee" stroke="#f0e1c2" stroke-width=".8"/>  <rect x="370" y="340" width="3.2" height="116" rx="1" fill="#d99b2b" stroke="none"/>  <text class="B" x="383" y="366" font-size="13">13</text>  <text class="b" x="383" y="390">The bottleneck is</text>  <text class="b" x="383" y="403">the return path</text>  <text class="k" x="383" y="446">COST</text>  <rect x="538" y="340" width="160" height="116" rx="3" fill="#f3fbf9" stroke="#cfeae5" stroke-width=".8"/>  <rect x="538" y="340" width="3.2" height="116" rx="1" fill="#29a08f" stroke="none"/>  <text class="B" x="551" y="366" font-size="13">14</text>  <text class="b" x="551" y="390">Wireless makes L2</text>  <text class="b" x="551" y="403">first-class again</text>  <text class="k" x="551" y="446">BEHAVIOUR</text>  <rect x="706" y="340" width="160" height="116" rx="3" fill="#f8f5fe" stroke="#e2d9f7" stroke-width=".8"/>  <rect x="706" y="340" width="3.2" height="116" rx="1" fill="#8b6bd0" stroke="none"/>  <text class="B" x="719" y="366" font-size="13">15</text>  <text class="b" x="719" y="390">Scalability = linear</text>  <text class="b" x="719" y="403">incremental cost</text>  <text class="k" x="719" y="446">BUDGET / SCALE</text>  <rect x="34" y="476" width="10" height="10" rx="2" fill="#4a7ee0" stroke="none"/>  <text class="c" x="49" y="484.5">failure domain</text>  <rect x="199" y="476" width="10" height="10" rx="2" fill="#29a08f" stroke="none"/>  <text class="c" x="214" y="484.5">failure behaviour</text>  <rect x="364" y="476" width="10" height="10" rx="2" fill="#8b6bd0" stroke="none"/>  <text class="c" x="379" y="484.5">budget and scale</text>  <rect x="529" y="476" width="10" height="10" rx="2" fill="#d99b2b" stroke="none"/>  <text class="c" x="544" y="484.5">operational cost</text>  <text class="w" x="34" y="516">Every truth is a review question: ask it while the design is a drawing, not while the incident is live.</text>
</svg>
