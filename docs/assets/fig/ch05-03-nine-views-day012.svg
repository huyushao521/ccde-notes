<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" role="img" aria-labelledby="t3 d3">

  <title id="t3">业务架构的九个架构视角与 Day 0 / Day 1 / Day 2 运维周期</title>
  <desc id="d3">九宫格列出战略与愿景、业务、应用、技术、基础设施、物理、数据、运营、治理九个视角及各自支撑的内容；下方把运营架构对接到 Day 0 规划与设计、Day 1 部署与开通、Day 2 日常运维与变更。</desc>
  <style>
    .h{font:600 12.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2233}
    .s{font:10px "Segoe UI","Microsoft YaHei",sans-serif;fill:#7c8b9f}
    .n{font:600 11.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1a2233}
    .b{font:9.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#4a5a72}
    .d{font:600 10.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#1f4fc0}
    .db{font:9.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#4a5a72}
    .t{font:9.5px "Segoe UI","Microsoft YaHei",sans-serif;fill:#7c8b9f}
  </style>

  <rect x="0" y="0" width="900" height="420" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">九个架构视角：一张检查表，防止"只画了网络那三格"</text>
  <text class="s" x="24" y="48">网络设计师常只看技术、基础设施两格；其余七格决定了这两格能不能成立</text>

  <rect x="24" y="76" width="262" height="62" rx="7" fill="#eaf1ff" stroke="#c9dbff" stroke-width="1"/>
  <text class="n" x="40" y="98">战略和愿景</text>
  <text class="b" x="40" y="118">把架构能力对齐业务目标与成果</text>

  <rect x="300" y="76" width="262" height="62" rx="7" fill="#eaf1ff" stroke="#c9dbff" stroke-width="1"/>
  <text class="n" x="316" y="98">业务架构</text>
  <text class="b" x="316" y="118">与业务模型、市场与行业视角一致</text>

  <rect x="576" y="76" width="262" height="62" rx="7" fill="#eaf1ff" stroke="#c9dbff" stroke-width="1"/>
  <text class="n" x="592" y="98">应用架构</text>
  <text class="b" x="592" y="118">与混合云共存，支持三层 / N 层标准</text>

  <rect x="24" y="148" width="262" height="62" rx="7" fill="#e8f7f4" stroke="#b6e3da" stroke-width="1"/>
  <text class="n" x="40" y="170">技术架构</text>
  <text class="b" x="40" y="190">自动化、配置、编排、分析与遥测</text>

  <rect x="300" y="148" width="262" height="62" rx="7" fill="#e8f7f4" stroke="#b6e3da" stroke-width="1"/>
  <text class="n" x="316" y="170">基础设施架构</text>
  <text class="b" x="316" y="190">数据中心、云、协作、安全、SASE、IoT</text>

  <rect x="576" y="148" width="262" height="62" rx="7" fill="#e8f7f4" stroke="#b6e3da" stroke-width="1"/>
  <text class="n" x="592" y="170">物理架构</text>
  <text class="b" x="592" y="190">计算、存储与虚拟化</text>

  <rect x="24" y="220" width="262" height="62" rx="7" fill="#f4f7fb" stroke="#dbe4f0" stroke-width="1"/>
  <text class="n" x="40" y="242">数据架构</text>
  <text class="b" x="40" y="262">商业智能、集成、安全、管理与运营</text>

  <rect x="300" y="220" width="262" height="62" rx="7" fill="#fff4e0" stroke="#f0d6a8" stroke-width="1.1"/>
  <text class="n" x="316" y="242" fill="#a86400">运营架构</text>
  <text class="b" x="316" y="262" fill="#a86400">ITIL 服务能力，对齐 Day 0 / 1 / 2</text>

  <rect x="576" y="220" width="262" height="62" rx="7" fill="#f4f7fb" stroke="#dbe4f0" stroke-width="1"/>
  <text class="n" x="592" y="242">架构治理</text>
  <text class="b" x="592" y="262">架构管理办公室，覆盖规划到运营</text>

  <line x1="24" y1="296" x2="838" y2="296" stroke="#d98600" stroke-width="1.1"/>
  <line x1="24" y1="290" x2="24" y2="302" stroke="#d98600" stroke-width="1.1"/>
  <line x1="838" y1="290" x2="838" y2="302" stroke="#d98600" stroke-width="1.1"/>
  <line x1="431" y1="282" x2="431" y2="296" stroke="#d98600" stroke-width="1.1" stroke-dasharray="3 2"/>
  <text class="t" x="838" y="288" text-anchor="end" fill="#a86400">运营架构（ITIL）横跨 Day 0 → Day 2 全周期</text>

  <rect x="24" y="310" width="270" height="56" rx="7" fill="#fff" stroke="#dbe4f0" stroke-width="1"/>
  <text class="d" x="38" y="330">Day 0 · 规划与设计</text>
  <text class="db" x="38" y="348">还没上线：选型、分段、地址、容量</text>

  <rect x="310" y="310" width="270" height="56" rx="7" fill="#fff" stroke="#dbe4f0" stroke-width="1"/>
  <text class="d" x="324" y="330">Day 1 · 部署与开通</text>
  <text class="db" x="324" y="348">上线那一刻：配置下发、迁移、验收</text>

  <rect x="596" y="310" width="242" height="56" rx="7" fill="#fff" stroke="#dbe4f0" stroke-width="1"/>
  <text class="d" x="610" y="330">Day 2 · 日常运维与变更</text>
  <text class="db" x="610" y="348">长期运行：监控、变更、故障处置</text>

  <text class="t" x="24" y="390">设计失败常常不是 Day 0 选错了技术，而是没算 Day 2 的运维成本——配置太复杂，人为变更就成了主要故障源。</text>
  <text class="t" x="24" y="408" fill="#a32020">所以"运营架构"这一格在评审里最该被追问：这套设计在一周三次变更的团队手里，还能维持吗？</text>
</svg>
