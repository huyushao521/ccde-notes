<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="100%" role="img" aria-labelledby="t1 d1">

  <title id="t1">Top-down and bottom-up are two directions of the same design, not rival camps</title>
  <desc id="d1">Business drivers at the top feed a top-down lane that derives requirements, scope and design options downward, while a bottom-up lane checks current-state capability and technology feasibility upward. The two lanes iterate and meet in a design decision that survives contact with the business.</desc>
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fed"/>
    </marker>
    <marker id="o1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d98600"/>
    </marker>
  </defs>
  <style>
    .h{font:600 12.5px "Segoe UI",sans-serif;fill:#1a2233}
    .s{font:10px "Segoe UI",sans-serif;fill:#7c8b9f}
    .ln{font:700 9px "Segoe UI",sans-serif;fill:#1f4fc0;letter-spacing:.4px}
    .ln2{font:700 9px "Segoe UI",sans-serif;fill:#a86400;letter-spacing:.4px}
    .n{font:9px "Segoe UI",sans-serif;fill:#4a5a72}
    .nb{font:600 9.5px "Segoe UI",sans-serif;fill:#1a2233}
    .t{font:9px "Segoe UI",sans-serif;fill:#7c8b9f}
    .w{font:600 9.5px "Segoe UI",sans-serif;fill:#1a2233}
  </style>

  <rect x="0" y="0" width="900" height="392" fill="#fbfcfe"/>
  <text class="h" x="24" y="30">Two directions, one design: push requirements down, verify feasibility up</text>
  <text class="s" x="24" y="48">Bottom-up alone gets overturned by the business; top-down alone never lands</text>

  <rect x="80" y="64" width="740" height="34" rx="5" fill="#eaf1ff" stroke="#2f6fed"/>
  <text class="nb" x="450" y="86" text-anchor="middle">Business: drivers · priorities · outcomes · technical objectives</text>

  <text class="ln" x="88" y="112">TOP-DOWN · requirements</text>
  <text class="ln2" x="528" y="112">BOTTOM-UP · feasibility</text>

  <rect x="80" y="122" width="300" height="44" rx="5" fill="#fff" stroke="#2f6fed"/>
  <text class="n" x="94" y="140">1  Business objectives and priorities</text>
  <text class="t" x="94" y="156">what the company is trying to achieve</text>

  <rect x="80" y="178" width="300" height="44" rx="5" fill="#fff" stroke="#2f6fed"/>
  <text class="n" x="94" y="196">2  Requirements: functional, technical, application</text>
  <text class="t" x="94" y="212">each with a stated level, not a slogan</text>

  <rect x="80" y="234" width="300" height="44" rx="5" fill="#fff" stroke="#2f6fed"/>
  <text class="n" x="94" y="252">3  Scope and candidate design options</text>
  <text class="t" x="94" y="268">what is in, and explicitly what is out</text>

  <rect x="520" y="122" width="300" height="44" rx="5" fill="#fff" stroke="#d98600"/>
  <text class="n" x="534" y="140">3  Technology and vendor options</text>
  <text class="t" x="534" y="156">features, protocols, release support</text>

  <rect x="520" y="178" width="300" height="44" rx="5" fill="#fff" stroke="#d98600"/>
  <text class="n" x="534" y="196">2  Current-state capability and constraints</text>
  <text class="t" x="534" y="212">staff skills, legacy kit, budget, contracts</text>

  <rect x="520" y="234" width="300" height="44" rx="5" fill="#fff" stroke="#d98600"/>
  <text class="n" x="534" y="252">1  Current-state discovery</text>
  <text class="t" x="534" y="268">measure before you redesign</text>

  <line x1="230" y1="166" x2="230" y2="176" stroke="#2f6fed" marker-end="url(#b1)"/>
  <line x1="230" y1="222" x2="230" y2="232" stroke="#2f6fed" marker-end="url(#b1)"/>
  <line x1="230" y1="100" x2="230" y2="120" stroke="#2f6fed" marker-end="url(#b1)"/>
  <line x1="670" y1="232" x2="670" y2="222" stroke="#d98600" marker-end="url(#o1)"/>
  <line x1="670" y1="176" x2="670" y2="166" stroke="#d98600" marker-end="url(#o1)"/>
  <line x1="670" y1="120" x2="670" y2="100" stroke="#d98600" marker-end="url(#o1)"/>

  <line x1="460" y1="122" x2="460" y2="278" stroke="#8494a8" stroke-dasharray="4 3" marker-start="url(#b1)" marker-end="url(#o1)"/>
  <text class="t" x="470" y="204" text-anchor="middle" transform="rotate(-90 470 204)">iterate until both agree</text>

  <rect x="80" y="296" width="740" height="40" rx="5" fill="#e8f7f4" stroke="#0f7f73"/>
  <text class="w" x="450" y="321" text-anchor="middle" fill="#0f7f73">Design decision that survives contact with the business</text>

  <text class="t" x="24" y="360">Danger 1 — technology first ("SD-WAN in", "vendor A in"): the business case is written after the decision and gets overturned within six months.</text>
  <text class="t" x="24" y="378">Danger 2 — business only: a solution nobody can build, fund or operate. The two lanes must be walked every time, and re-walked when requirements change.</text>
</svg>
